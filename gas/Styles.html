<style>
:root {
  /* Primary — 銀松苑グリーン */
  --green: #176b52;
  --green-dark: #0d4c3a;
  --green-l1: #82d9b8;
  --green-l2: #49ad86;
  --green-l3: #9fd8c1;
  --green-l4: #d4ebe1;
  /* 訓練モード */
  --purple: #5b5ea6;
  --purple-dark: #43468c;
  --purple-pale: #efeffa;
  /* アラート */
  --alert: #d5688e;
  --alert-bg: #fbeff3;
  --alert-border: #f0cbd8;
  --alert-text: #8a4560;
  /* 背景 */
  --page: #f1f4ef;
  --card-face: #fbfcfa;
  --input-bg: #f1f5f0;
  --subtle-bg: #fcfdfb;
  --sidebar: #142d24;
  --camera: #12231d;
  /* ボーダー */
  --border: #dce5db;
  --border-success: #bfdcbe;
  --border-undone: #c9d5c8;
  /* テキスト */
  --text: #14231d;
  --text-sub: #354b41;
  --text-aux: #52665c;
  --text-success: #4a6b4d;
  --text-disabled: #9aa89c;
  /* 成功背景 */
  --success-bg: #e3f1e1;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  background: radial-gradient(circle at 12% -10%, rgba(130,217,184,.2), transparent 32rem), var(--page);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

a {
  color: var(--green);
}
a:hover {
  color: var(--green-dark);
}

button {
  font-family: inherit;
  border: none;
  background: none;
  padding: 0;
  margin: 0;
  cursor: pointer;
  color: inherit;
}

input,
textarea,
select {
  font-family: inherit;
  color: inherit;
}

/* ---------- モバイル画面フレーム(390px カード) ---------- */
.phone-wrap {
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 24px 12px 48px;
}

.phone {
  width: 100%;
  max-width: 390px;
  background: var(--card-face);
  border-radius: 28px;
  /* overflow:hidden だと下部タブバーの sticky が効かないため、
     角丸はヘッダー/タブバー側に持たせる */
  overflow: visible;
  box-shadow: 0 12px 40px rgba(31, 42, 34, 0.14);
  border: 1px solid var(--border);
  /* タブバーを最下部へ寄せるための縦フレックス */
  display: flex;
  flex-direction: column;
}
.phone-body { flex: 1 1 auto; }
.phone > .phone-header:first-child { border-radius: 27px 27px 0 0; }
.phone > :last-child { border-radius: 0 0 27px 27px; }
.phone > .phone-body:last-child { border-radius: 0 0 27px 27px; }

/* ---------- 下部タブバー(受付/利用者/管理) ---------- */
.tab-bar {
  position: sticky;
  bottom: 0;
  z-index: 40;
  display: flex;
  gap: 4px;
  background: var(--card-face);
  border-top: 1px solid var(--border);
  padding: 6px 10px calc(6px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -4px 16px rgba(31, 42, 34, 0.06);
}
.tab-item {
  flex: 1 1 0;
  min-height: 56px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  border: 0;
  border-radius: 14px;
  background: transparent;
  cursor: pointer;
  font-family: inherit;
  font-size: 11.5px;
  font-weight: 800;
  letter-spacing: 0.04em;
  color: var(--text-aux);
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s, color 0.15s;
}
.tab-item svg { width: 24px; height: 24px; }
.tab-item.active {
  color: var(--green);
  background: var(--green-l4);
}
.tab-item:active { transform: scale(0.96); }
@media print { .tab-bar { display: none !important; } }
/* 管理画面: PC幅ではサイドバーがあるためタブバーは出さない。
   admin-wrap 直下のタブバーは画面下に固定する */
.admin-wrap > .tab-bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  border-radius: 0;
}
.admin-wrap { padding-bottom: 76px; }
@media (min-width: 901px) {
  .admin-wrap > .tab-bar { display: none; }
  .admin-wrap { padding-bottom: 0; }
}

/* ---------- 管理画面: スマホ用ヘッダー ---------- */
/* PCではサイドバーを使うため非表示。スマホでは横スクロールタブの代わりに
   「‹ 管理メニュー」+ 現在の機能名を固定表示する */
.admin-mobile-head { display: none; }
@media (max-width: 900px) {
  .admin-sidebar { display: none !important; }
  .admin-mobile-head {
    position: sticky;
    top: 0;
    z-index: 35;
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--green);
    color: #fff;
    padding: 12px 16px;
    padding-top: calc(12px + env(safe-area-inset-top, 0px));
  }
  .admin-mobile-head .back-btn {
    flex: none;
    width: 42px;
    height: 42px;
    border: 0;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.16);
    color: #fff;
    font-size: 24px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
  }
  .admin-mobile-head .h-sub {
    font-size: 11px;
    opacity: 0.85;
    letter-spacing: 0.06em;
  }
  .admin-mobile-head .h-title {
    font-size: 18px;
    font-weight: 800;
  }
}

@media (max-width: 430px) {
  .phone-wrap {
    padding: 0;
  }
  .phone {
    max-width: none;
    border-radius: 0;
    border: none;
    min-height: 100dvh;
  }
  .phone > .phone-header:first-child,
  .phone > :last-child,
  .phone > .phone-body:last-child { border-radius: 0; }
}

.phone-header {
  background: var(--green);
  color: #fff;
  padding: 18px 20px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.phone-header.training {
  background: var(--purple);
  padding: 16px 20px;
}

.phone-header.compact {
  padding: 16px 20px;
}

.phone-header .logo {
  height: 34px;
  width: 34px;
  background: #fff;
  border-radius: 99px;
  padding: 2px;
  object-fit: contain;
}

.phone-header .back-btn {
  font-size: 22px;
  color: #fff;
  line-height: 1;
  padding: 4px 6px;
  margin-left: -6px;
  min-width: 44px;
  min-height: 44px;
  display: flex;
  align-items: center;
}

.phone-header .h-sub {
  font-size: 12px;
  opacity: 0.85;
}
.phone-header .h-title {
  font-size: 19px;
  font-weight: 900;
}

.phone-header .h-right {
  margin-left: auto;
  text-align: right;
}

.pill-badge {
  background: rgba(255, 255, 255, 0.18);
  border-radius: 99px;
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 700;
}

.qr-read-badge {
  display: inline-block;
  background: rgba(255, 255, 255, 0.18);
  border-radius: 12px;
  padding: 6px 10px;
  font-size: 11px;
  font-weight: 700;
  text-align: center;
  line-height: 1.35;
}

.phone-body {
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* ---------- カメラビュー ---------- */
.camera-view {
  background: var(--camera);
  border-radius: 20px;
  height: 280px;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.camera-view video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.camera-dim {
  position: absolute;
  inset: 44px 64px;
  border-radius: 16px;
  box-shadow: 0 0 0 3000px rgba(0, 0, 0, 0.35);
}

.camera-corner {
  position: absolute;
  width: 28px;
  height: 28px;
}
.camera-corner.tl {
  top: 44px;
  left: 64px;
  border-top: 4px solid var(--green-l1);
  border-left: 4px solid var(--green-l1);
  border-radius: 6px 0 0 0;
}
.camera-corner.tr {
  top: 44px;
  right: 64px;
  border-top: 4px solid var(--green-l1);
  border-right: 4px solid var(--green-l1);
  border-radius: 0 6px 0 0;
}
.camera-corner.bl {
  bottom: 44px;
  left: 64px;
  border-bottom: 4px solid var(--green-l1);
  border-left: 4px solid var(--green-l1);
  border-radius: 0 0 0 6px;
}
.camera-corner.br {
  bottom: 44px;
  right: 64px;
  border-bottom: 4px solid var(--green-l1);
  border-right: 4px solid var(--green-l1);
  border-radius: 0 0 6px 0;
}

.camera-hint {
  color: #b7c9b8;
  font-size: 15px;
  font-weight: 700;
  position: relative;
  text-align: center;
  padding: 0 24px;
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
}

.capture-wrap {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 14px;
  display: flex;
  justify-content: center;
  z-index: 2;
}

.capture-btn {
  background: var(--green);
  color: #fff;
  border-radius: 99px;
  min-height: 48px;
  padding: 0 24px;
  font-size: 16px;
  font-weight: 900;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
}
.capture-btn:active {
  background: var(--green-dark);
}

/* ---------- トースト ---------- */
.toast-success {
  background: var(--success-bg);
  border: 1px solid var(--border-success);
  border-radius: 16px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  text-align: left;
}

.toast-success .check-circle {
  width: 44px;
  height: 44px;
  flex: none;
  border-radius: 99px;
  background: var(--green);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 900;
}

.toast-success .t-title {
  font-size: 17px;
  font-weight: 900;
}
.toast-success .t-sub {
  font-size: 13px;
  color: var(--text-success);
}

.toast-error {
  background: var(--alert-bg);
  border: 1px solid var(--alert-border);
  border-radius: 16px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.toast-error .x-circle {
  width: 44px;
  height: 44px;
  flex: none;
  border-radius: 99px;
  background: var(--alert);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: 900;
}

.toast-error .t-title {
  font-size: 15px;
  font-weight: 900;
  color: var(--alert-text);
}
.toast-error .t-sub {
  font-size: 13px;
  color: var(--alert-text);
}

/* ---------- リスト ---------- */
.section-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 8px;
}
.section-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-sub);
}
.section-note {
  font-size: 13px;
  color: var(--text-aux);
}

.row-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.person-row {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 44px;
}

.person-row.pending {
  border: 1px dashed var(--border-undone);
  opacity: 0.65;
}

.status-dot {
  width: 10px;
  height: 10px;
  flex: none;
  border-radius: 99px;
  background: var(--green);
}
.person-row.pending .status-dot {
  background: var(--border-undone);
}

.person-name {
  font-size: 15px;
  font-weight: 700;
}
.person-care {
  font-size: 12px;
  color: var(--text-aux);
}
.person-time {
  margin-left: auto;
  font-size: 13px;
  color: var(--text-success);
  font-weight: 700;
}
.person-row.pending .person-time {
  color: var(--text-disabled);
  font-weight: 400;
}

/* ---------- カード ---------- */
.card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 14px 16px;
}

.card-label {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-sub);
}
.card-label .unit {
  font-weight: 400;
  color: var(--text-aux);
}

/* ---------- バイタル入力 ---------- */
.bp-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.bp-title {
  font-size: 15px;
  font-weight: 900;
}
.bp-unit {
  font-size: 12px;
  color: var(--text-aux);
}
.bp-prev {
  margin-left: auto;
  font-size: 12px;
  color: var(--text-aux);
}

.bp-inputs {
  display: flex;
  gap: 10px;
  align-items: center;
}
.bp-slash {
  color: var(--text-disabled);
  font-size: 20px;
  font-weight: 700;
}

.num-box {
  flex: 1;
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 8px;
  text-align: center;
}
.num-box:focus-within {
  border: 2px solid var(--green);
  padding: 7px;
}
.num-box .nb-label {
  font-size: 11px;
  color: var(--text-aux);
}
.num-box input {
  width: 100%;
  border: none;
  background: transparent;
  outline: none;
  text-align: center;
  font-size: 30px;
  font-weight: 900;
  padding: 0;
  color: var(--text);
}
.num-box input::placeholder {
  color: var(--text-disabled);
  font-weight: 700;
}

.vitals-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.vital-cell {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 12px 14px;
}
.vital-cell:focus-within {
  border: 2px solid var(--green);
  padding: 11px 13px;
}
.vital-cell input {
  width: 100%;
  border: none;
  background: transparent;
  outline: none;
  font-size: 28px;
  font-weight: 900;
  padding: 0;
  color: var(--text);
}
.vital-cell input::placeholder {
  color: var(--text-disabled);
  font-weight: 700;
}
.vital-prev {
  font-size: 11px;
  color: var(--text-aux);
}

/* ---------- アラート ---------- */
.alert-banner {
  background: var(--alert-bg);
  border: 1px solid var(--alert-border);
  border-radius: 14px;
  padding: 10px 14px;
  display: flex;
  gap: 10px;
  align-items: center;
}
.alert-dot {
  width: 10px;
  height: 10px;
  flex: none;
  border-radius: 99px;
  background: var(--alert);
}
.alert-text {
  font-size: 13px;
  color: var(--alert-text);
  font-weight: 700;
}

/* ---------- ボタン ---------- */
.btn-row {
  display: flex;
  gap: 10px;
}

.btn-outline {
  flex: 1;
  background: #fff;
  border: 2px solid var(--green);
  color: var(--green);
  border-radius: 14px;
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 900;
}
.btn-outline:active {
  background: var(--input-bg);
}

.btn-primary {
  flex: 2;
  background: var(--green);
  color: #fff;
  border-radius: 14px;
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  font-weight: 900;
  box-shadow: 0 6px 16px rgba(46, 125, 50, 0.3);
}
.btn-primary:active {
  background: var(--green-dark);
}
.btn-primary:disabled {
  opacity: 0.5;
  box-shadow: none;
}

.btn-training {
  background: var(--purple);
  color: #fff;
  border-radius: 14px;
  min-height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 900;
  box-shadow: 0 6px 16px rgba(91, 94, 166, 0.3);
  width: 100%;
}
.btn-training:active {
  background: var(--purple-dark);
}
.btn-training:disabled {
  opacity: 0.5;
  box-shadow: none;
}

.link-plain {
  font-size: 13px;
  font-weight: 700;
  color: var(--green);
  text-align: center;
  padding: 8px;
  min-height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  width: 100%;
}

/* ---------- セグメント選択 ---------- */
.segment-row {
  display: flex;
  gap: 8px;
}

.segment {
  flex: 1;
  min-height: 48px;
  border: 1px solid var(--border);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 700;
  background: var(--input-bg);
  color: var(--text);
}
.segment.small {
  font-size: 15px;
}
.segment.selected {
  border: 2px solid var(--purple);
  background: var(--purple-pale);
  color: var(--purple-dark);
  font-weight: 900;
}

/* ---------- テキストエリア ---------- */
.note-area {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 12px;
  min-height: 64px;
  padding: 10px 12px;
  font-size: 14px;
  background: var(--subtle-bg);
  resize: vertical;
  outline: none;
}
.note-area:focus {
  border: 2px solid var(--purple);
  padding: 9px 11px;
}
.note-area::placeholder {
  color: var(--text-aux);
}

/* ---------- 実施状況リスト ---------- */
.exercise-row {
  background: var(--success-bg);
  border: 1px solid var(--border-success);
  border-radius: 12px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 44px;
}
.exercise-row .check {
  color: var(--green);
  font-weight: 900;
}
.exercise-row .ex-name {
  font-size: 14px;
  font-weight: 700;
}
.exercise-row .ex-summary {
  margin-left: auto;
  font-size: 12px;
  color: var(--text-success);
}

.exercise-row.undone {
  background: #fff;
  border: 1px dashed var(--border-undone);
  opacity: 0.7;
}
.exercise-row.undone .check {
  color: var(--text-disabled);
  font-weight: 400;
}
.exercise-row.undone .ex-summary {
  color: var(--text-disabled);
}

/* ---------- モーダル(手動選択フォールバック) ---------- */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(31, 42, 34, 0.5);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 50;
}
.modal-sheet {
  background: var(--card-face);
  border-radius: 20px 20px 0 0;
  width: 100%;
  max-width: 430px;
  max-height: 70dvh;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.modal-title {
  font-size: 16px;
  font-weight: 900;
}
.modal-row {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 48px;
  width: 100%;
  text-align: left;
  font-size: 15px;
  font-weight: 700;
}
.modal-row:active {
  background: var(--input-bg);
}

/* ---------- 管理者 PC 画面 ---------- */
.admin-wrap {
  min-height: 100dvh;
  padding: 24px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.admin-frame {
  width: 100%;
  max-width: 1180px;
  background: var(--card-face);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 12px 40px rgba(31, 42, 34, 0.14);
  border: 1px solid var(--border);
  display: flex;
  min-height: 720px;
}

.admin-sidebar {
  width: 220px;
  flex: none;
  background: var(--sidebar);
  color: var(--border);
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.admin-sidebar .brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 8px 16px;
}
.admin-sidebar .brand img {
  height: 30px;
  width: 30px;
  background: #fff;
  border-radius: 99px;
  padding: 2px;
  object-fit: contain;
}
.admin-sidebar .brand-name {
  font-size: 15px;
  font-weight: 900;
  color: #fff;
}

.nav-item {
  padding: 10px 12px;
  font-size: 14px;
  border-radius: 10px;
  color: var(--border);
  text-align: left;
  width: 100%;
  cursor: pointer;
  touch-action: manipulation;
}
@media (hover: hover) and (pointer: fine) {
  .nav-item:hover {
    background: rgba(255, 255, 255, 0.08);
  }
}

html {

  min-width: 0;
  min-height: 100%;

}

img,
svg,
canvas,
video {

}

input,
select,
textarea {

.phone-body > *,

.admin-content,

.camera-hint,

/* ---------- PDF要望: 基本情報・評価記録 ---------- */
.profile-grid {
  display: grid;
  gap: 8px;
}
.profile-item {
  background: #fff;
  border: 1px solid var(--border);
  border-left: 5px solid var(--green-l2);
  border-radius: 14px;
  padding: 12px 14px;
  display: grid;
  gap: 4px;
}
.profile-item.goal { border-left-color: var(--green); background: #f4faf7; }
.profile-item.caution { border-left-color: #d79532; background: #fff9ec; }
.profile-item span { color: var(--text-aux); font-size: 12px; font-weight: 700; }
.profile-item strong { font-size: 14px; line-height: 1.65; white-space: pre-wrap; }
.record-form { display: grid; gap: 10px; margin-bottom: 10px; }
.record-form .btn-outline { width: 100%; flex: none; }
.record-list { display: grid; gap: 7px; }
.record-line {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 2px 10px;
  align-items: baseline;
  padding: 10px 12px;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 12px;
}
.record-line b { font-size: 12px; color: var(--green-dark); }
.record-line span { font-size: 14px; font-weight: 700; }
.record-line small { grid-column: 1 / -1; color: var(--text-aux); line-height: 1.5; }
.record-line.assessment b { color: var(--purple-dark); }
.form-wide { grid-column: 1 / -1; }
.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.checkout-controls { display: flex; gap: 6px; min-width: 230px; }
.checkout-controls .select-plain { padding: 6px 8px; }
.checkout-controls .btn-csv { white-space: nowrap; }

/* ---------- 連絡帳 作成・A4横印刷 ---------- */
.notebook-tools {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 14px;
  color: var(--text-aux);
  font-size: 12px;
}
.notebook-tools .btn-outline { flex: none; min-height: 42px; padding: 0 16px; }
.notebook-count { margin-left: auto; font-weight: 800; color: var(--green-dark); }
.notebook-count.warn { color: var(--alert-text); }
.communication-sheet {
  width: 100%;
  max-width: 1120px;
  margin: 0 auto;
  padding: 28px 32px 18px;
  background: #fff;
  border: 1px solid #d8ded8;
  border-radius: 18px;
  box-shadow: 0 16px 42px rgba(20,45,36,.12);
  color: #17231d;
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
}
.notebook-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 24px;
  padding-bottom: 12px;
  border-bottom: 2px solid #2d5c4b;
}
.notebook-brand { display: flex; align-items: center; gap: 12px; }
.notebook-brand img { width: 54px; height: 54px; object-fit: contain; }
.notebook-brand small { color: var(--green); font-weight: 900; letter-spacing: .08em; }
.notebook-brand h1 { margin: 0; font-size: 30px; line-height: 1.1; letter-spacing: .04em; }
.notebook-meta { display: flex; gap: 22px; }
.notebook-meta div { min-width: 210px; padding: 6px 10px; border-bottom: 1px solid #8fa49b; }
.notebook-meta small { display: block; color: #5f7068; font-weight: 700; }
.notebook-meta strong { display: block; font-size: 17px; margin-top: 2px; }
.notebook-thanks { margin: 12px 0; font-size: 17px; font-weight: 900; }
.notebook-layout { display: grid; grid-template-columns: 1.1fr .9fr; gap: 14px; }
.notebook-left { display: grid; grid-template-rows: auto 1fr auto; gap: 12px; min-width: 0; }
.notebook-box { position: relative; border: 2px solid #d8ded8; border-radius: 13px; padding: 22px 18px 14px; min-width: 0; }
.notebook-box h2 {
  position: absolute;
  top: -15px;
  left: 22px;
  margin: 0;
  padding: 5px 16px;
  border-radius: 8px;
  font-size: 16px;
  line-height: 1.2;
}
.notebook-box.program { border-color: #ef927c; }
.notebook-box.program h2 { background: #f6b3a3; }
.notebook-box.facility { border-color: #e7bb48; min-height: 118px; }
.notebook-box.facility h2 { background: #ffd75c; }
.notebook-box.family { border-color: #86a94b; min-height: 96px; }
.notebook-box.family h2 { background: #8eae4f; color: #122111; }
.notebook-box.photo { border-color: #31a8c2; min-height: 470px; padding: 24px 16px 14px; }
.notebook-box.photo h2 { background: #27a8c8; color: #042c35; }
.notebook-box.program ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.notebook-box.program li { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: center; min-height: 28px; }
.notebook-box.program li > span { width: 24px; height: 24px; border-radius: 99px; display: grid; place-items: center; background: #fff1ee; color: #a44836; font-weight: 900; }
.notebook-box.program li b { font-size: 15px; }
.notebook-box.program li small { color: #59675f; }
.notebook-box.program li.planned { opacity: .68; }
.notebook-vitals { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #d5dcd7; display: grid; gap: 2px; font-size: 11px; color: #4f6258; }
.notebook-comment { min-height: 76px; line-height: 1.75; font-size: 14px; outline: none; white-space: pre-wrap; }
.notebook-comment:focus { background: #fff9e8; box-shadow: 0 0 0 3px rgba(231,187,72,.25); border-radius: 6px; }
.family-lines { display: grid; gap: 22px; padding-top: 12px; }
.family-lines span { display: block; border-bottom: 1px solid #b9c7bc; }
#notebook-photo { width: 100%; height: 100%; min-height: 420px; display: grid; place-items: center; overflow: hidden; border-radius: 8px; background: #eef6f7; }
#notebook-photo img { width: 100%; height: 100%; max-height: 450px; object-fit: cover; border-radius: 8px; }
.notebook-photo-empty { display: grid; place-items: center; gap: 5px; color: #55808a; text-align: center; }
.notebook-photo-empty span { font-size: 44px; font-weight: 900; opacity: .25; }
.notebook-photo-empty small { max-width: 180px; }
.notebook-footer { margin-top: 8px; text-align: right; color: #607069; font-size: 10px; }

@media (max-width: 900px) {
  .communication-sheet { padding: 20px; border-radius: 14px; overflow-x: auto; }
  .notebook-head { align-items: flex-start; flex-direction: column; }
  .notebook-meta { width: 100%; flex-direction: column; gap: 4px; }

/* ---------- 安全情報・管理者ゲート ---------- */
.precaution-banner {
  display: grid;
  grid-template-columns: 36px minmax(0, 1fr);
  gap: 10px;
  align-items: start;
  padding: 13px 14px;
  border: 2px solid #d46a46;
  border-radius: 14px;
  background: #fff2eb;
  color: #692915;
}
.precaution-icon {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: #c8512e;
  color: #fff;
  font-size: 22px;
  font-weight: 900;
}
.precaution-label { display: block; margin-bottom: 3px; font-size: 12px; font-weight: 900; letter-spacing: .04em; }
.precaution-banner strong { display: block; font-size: 15px; line-height: 1.6; }
.precaution-check { display: flex; align-items: center; gap: 8px; margin-top: 9px; font-size: 14px; font-weight: 900; }
.precaution-check input { width: 24px; height: 24px; accent-color: #a63f20; }
.admin-gate { width: 100%; max-width: 440px; display: grid; gap: 14px; }
.admin-gate .note-area { min-height: 50px; font-size: 20px; letter-spacing: 4px; }
.admin-gate .btn-primary { width: 100%; }

@media (max-width: 600px) {
  .notebook-count { width: 100%; margin-left: 0; }
  .day-table { display: block; min-width: 0; }
  .day-table .th { display: none; }
  .day-table .td {
    display: grid;
    grid-template-columns: 74px minmax(0, 1fr);
    gap: 8px;
    padding: 7px 10px;
    border-inline: 1px solid var(--border);
    border-bottom: 0;
  }
  .day-table .td::before { color: var(--text-aux); font-size: 11px; font-weight: 800; }
  .day-table .td:nth-child(5n + 1) { margin-top: 12px; border-top: 1px solid var(--border); border-radius: 12px 12px 0 0; }
  .day-table .td:nth-child(5n + 1)::before { content: '日付'; }
  .day-table .td:nth-child(5n + 2)::before { content: '来所'; }
  .day-table .td:nth-child(5n + 3)::before { content: 'バイタル'; }
  .day-table .td:nth-child(5n + 4)::before { content: '実施種目'; }
  .day-table .td:nth-child(5n + 5) { border-bottom: 1px solid var(--border); border-radius: 0 0 12px 12px; }
  .day-table .td:nth-child(5n + 5)::before { content: '所見'; }
  .gen-table { min-width: 0; }
  .gen-table thead { display: none; }
  .gen-table, .gen-table tbody, .gen-table tr, .gen-table td { display: block; width: 100%; }
  .gen-table tr { margin: 12px 0; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; background: #fff; }
  .gen-table td { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 8px; padding: 6px 0; border: 0; white-space: normal !important; }
  /* ラベルは JS が thead から data-label に転記する(表ごとの列ずれ防止) */
  .gen-table td::before {
    content: attr(data-label);
    color: var(--text-aux);
    font-size: 11px;
    font-weight: 800;
  }
  /* 見出しなし(操作ボタン列・全幅メッセージ)はラベル欄を作らない */
  .gen-table td[data-label=''] { display: block; }
  .gen-table td[data-label='']::before { content: none; }
  /* 帰苑登録などの操作類はラベルの下に全幅で並べ、はみ出させない */
  .gen-table .checkout-controls {
    min-width: 0;
    flex-wrap: wrap;
    width: 100%;
  }
  .gen-table .checkout-controls .select-plain { flex: 1 1 130px; min-width: 0; }
  .gen-table .checkout-controls .btn-csv { flex: 1 1 110px; }
}

/* ---------- 記録メニュー(ハブ画面) ---------- */
.menu-action {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  text-align: left;
  min-height: 76px;
  padding: 14px 16px;
  background: #fff;
  border: 2px solid var(--green);
  border-radius: 16px;
  box-shadow: 0 4px 12px rgba(31, 42, 34, 0.08);
}
.menu-action:active { background: var(--green-l4); transform: scale(0.99); }
.menu-action.training { border-color: var(--purple); }
.menu-action.training:active { background: var(--purple-pale); }
.menu-icon { flex: none; font-size: 30px; line-height: 1; }
.menu-text { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.menu-text strong { font-size: 18px; font-weight: 900; color: var(--text); }
.menu-text small { font-size: 13px; color: var(--text-aux); font-weight: 700; }
.menu-done {
  flex: none;
  width: 30px; height: 30px;
  display: grid; place-items: center;
  border-radius: 99px;
  background: var(--success-bg);
  border: 1px solid var(--border-success);
  color: var(--green); font-size: 16px; font-weight: 900;
}


/* ---------- 職員ログイン ---------- */
.pin-display {
  display: flex; justify-content: center; gap: 14px;
  min-height: 34px; align-items: center; margin: 4px 0 2px;
}
.pin-dot {
  width: 16px; height: 16px; border-radius: 99px;
  border: 2px solid var(--border); background: #fff;
}
.pin-dot.filled { background: var(--green); border-color: var(--green); }
.pin-pad {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
}
.pin-key {
  min-height: 64px; border-radius: 14px;
  background: #fff; border: 1px solid var(--border);
  font-size: 26px; font-weight: 900; color: var(--text);
}
.pin-key:active { background: var(--green-l4); }
.pin-key.sub { font-size: 16px; font-weight: 700; color: var(--text-aux); background: var(--input-bg); }
.role-badge {
  display: inline-block; flex: none;
  padding: 2px 9px; border-radius: 99px;
  background: var(--input-bg); border: 1px solid var(--border);
  font-size: 11px; font-weight: 900; color: var(--text-aux);
}
.role-badge.admin {
  background: var(--green-l4); border-color: var(--green-l3); color: var(--green-dark);
}
.signed-in-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding-top: 4px; border-top: 1px solid var(--border);
}
.signed-in-name { font-size: 13px; font-weight: 700; color: var(--text-aux); }
.signed-in-bar .link-plain { width: auto; padding: 8px 10px; font-size: 13px; }


/* ---------- 入力・操作の体感速度 ---------- */
.pin-placeholder { font-size: 14px; font-weight: 700; color: var(--text-aux); }
.pin-count { font-size: 13px; font-weight: 700; color: var(--text-aux); margin-left: 6px; }
.pin-display { flex-wrap: wrap; }

/* タップ待ち・ハイライトを消して反応を速く見せる */
button, a, input, select, textarea, .person-row, .menu-action, .exercise-row, .segment, .chip {
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.pin-key, .segment, .menu-action, .person-row.tappable, .chip {
  transition: background-color .08s linear, border-color .08s linear, transform .06s linear;
}
.pin-key:active { transform: scale(.96); background: var(--green-l4); }


/* ---------- アプリ更新の案内 ---------- */
.update-banner {
  position: fixed;
  left: 12px; right: 12px;
  bottom: calc(12px + env(safe-area-inset-bottom));
  z-index: 100;
  display: flex; align-items: center; gap: 10px;
  background: var(--sidebar); color: #fff;
