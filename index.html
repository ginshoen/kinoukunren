/** ふりがなから五十音の行(あ/か/さ…)を判定 */
function sortUsersKana(users) {
  return (users || []).slice().sort(function (a, b) {
    var ka = String(a.kana || a.name || '').replace(/[\s　]/g, '');
    var kb = String(b.kana || b.name || '').replace(/[\s　]/g, '');
    if (ka === kb) return String(a.id) < String(b.id) ? -1 : 1;
    return ka < kb ? -1 : 1;
  });
}

function kanaGyo(kana) {
  var c = (kana || '').replace(/\s/g, '').charAt(0);
  if (!c) return 'その他'; // indexOf('')は0を返すため空文字を先に弾く
  var rows = [
    ['あ', 'あいうえおぁぃぅぇぉ'], ['か', 'かきくけこがぎぐげご'],
    ['さ', 'さしすせそざじずぜぞ'], ['た', 'たちつてとだぢづでどっ'],
    ['な', 'なにぬねの'], ['は', 'はひふへほばびぶべぼぱぴぷぺぽ'],
    ['ま', 'まみむめも'], ['や', 'やゆよゃゅょ'], ['ら', 'らりるれろ'],
    ['わ', 'わをん'],
  ];
  for (var i = 0; i < rows.length; i++) {
    if (rows[i][1].indexOf(c) >= 0) return rows[i][0];
  }
  return 'その他';
}

/** 一覧行のHTML(状態: checked=来所済 / pending=本日予定・未着 / offday=予定なし) */
function userRowHtml(u, state, time, hasAlert) {
  var cls = 'person-row tappable' + (state === 'pending' ? ' pending' : state === 'offday' ? ' offday' : '');
  var right = state === 'checked' ? esc(time) : state === 'pending' ? '未着' : esc(u.scheduleLabel);
  return (
    '<button class="' + cls + '" data-name="' + esc((u.name + (u.kana || '')).replace(/\s/g, '')) + '"' +
    ' onclick="go(\'users/' + u.id + '\')">' +
    avatarHtml(u, 'avatar-sm') +
    '<span class="person-main"><span class="person-name">' + esc(u.name) + '</span>' +
    '<span class="person-care">' + esc(u.careLevel) + ' · ' + u.age + '歳</span></span>' +
    (hasAlert ? '<span class="badge-alert" title="本日アラートあり">⚑</span>' : '') +
    '<span class="person-time">' + right + '</span>' +
    '<span class="chev" aria-hidden="true">›</span></button>'
  );
}

function applyUserAlerts(alerts) {
  var rows = document.querySelectorAll('.person-row[data-user-id]');
  for (var i = 0; i < rows.length; i++) {
    var row = rows[i];
    var hasAlert = !!alerts[row.getAttribute('data-user-id')];
    row.setAttribute('data-alert', hasAlert ? '1' : '0');
    var badge = row.querySelector('.badge-alert');
    if (hasAlert && !badge) {
      badge = document.createElement('span');
      badge.className = 'badge-alert';
      badge.title = '本日アラートあり';
      badge.textContent = '⚑';
      row.insertBefore(badge, row.querySelector('.person-time'));
    } else if (!hasAlert && badge) {
      badge.remove();
    }
  }
  Actions.applyUserFilters();
}

function renderUserList(app, renderId) {
    // 一覧そのものは起動時に取得済みの利用者情報で即時表示する。
    // 当日アラートは画面をブロックせず、取得後に該当行だけを更新する。
    var alerts = S.todayAlerts || {};
    var checkedTime = {};
    S.todayCheckins.forEach(function (c) { checkedTime[c.userId] = c.time; });
    var todayWeekday = WEEKDAYS[new Date().getDay()];

    // かな行ごとにグループ化(かな未設定は「その他」)
    var groups = {};
    S.users.forEach(function (u) {
      var g = kanaGyo(u.kana);
      (groups[g] = groups[g] || []).push(u);
    });
    var order = ['あ', 'か', 'さ', 'た', 'な', 'は', 'ま', 'や', 'ら', 'わ', 'その他'];

    var listHtml = order.filter(function (g) { return groups[g]; }).map(function (g) {
      var rows = groups[g]
        .sort(function (a, b) { return (a.kana || a.name) < (b.kana || b.name) ? -1 : 1; })
        .map(function (u) {
          var state = checkedTime[u.id] ? 'checked'
            : String(u.scheduleLabel || '').indexOf(todayWeekday) >= 0 ? 'pending' : 'offday';
          var attr = ' data-user-id="' + esc(u.id) + '" data-state="' + state + '" data-alert="' + (alerts[u.id] ? '1' : '0') + '"';
          return userRowHtml(u, state, checkedTime[u.id], alerts[u.id])

      return '<div class="kana-group"><div class="kana-head">' + g +
        (g === 'その他' ? '' : '行') + '</div><div class="row-list">' + rows + '</div></div>';
    }).join('');

    app.innerHTML =

function vitalLineText(v) {
  if (!v) return null;
  var parts = ['血圧 <b>' + v.systolic + '/' + v.diastolic + '</b>', '脈拍 <b>' + v.pulse + '</b>', '<b>' + v.temp.toFixed(1) + '</b>℃'];
  if (v.spo2 != null) parts.push('SpO2 <b>' + v.spo2 + '</b>%');
  if (v.weight != null) parts.push('<b>' + v.weight.toFixed(1) + '</b>kg');
  return parts.join(' · ');
}

function renderUserDetail(app, userId, renderId) {
  var user = null;
  S.users.forEach(function (u) { if (u.id === userId) user = u; });
  if (!user) return go('users');
  showLoading(app, isRpcFresh('apiGetUserDetail', [userId]));

  rpc('apiGetUserDetail', userId).then(function (res) {
    if (!isCurrentRender(renderId)) return;
    var doneIds = {};
    res.todayExercises.forEach(function (e) { doneIds[e.exerciseId] = true; });
    var doneCount = Object.keys(doneIds).length;

    // ① 本日の状況
    var todayHtml;
    if (res.todayCheckin) {
      todayHtml =
        '<div class="today-status"><span class="status-dot"></span>' + esc(res.todayCheckin.time) + ' 来所済み</div>' +
        (res.todayVital
          ? '<div class="today-vitals">' + vitalLineText(res.todayVital) + '</div>' +
            (res.todayVital.conditionNote ? '<div class="history-note">体調: ' + esc(res.todayVital.conditionNote) + '</div>' : '')
          : '<div class="today-vitals">バイタル未測定</div>') +
        '<div class="today-vitals">機能訓練 本日 <b>' + doneCount + '種目</b> 実施</div>' +
        (res.todayVital && res.todayVital.flagged
          ? res.todayVital.alerts.map(function (msg) {
              return '<div class="alert-banner"><span class="alert-dot"></span><span class="alert-text">' + esc(msg) + '</span></div>';
            }).join('')
          : '');
    } else {
      todayHtml = '<div class="today-status absent">本日はまだ来所していません(' + esc(user.scheduleLabel) + ' 利用)</div>';
    }

    // ② 最新値グリッド
    var latest = res.vitalsAll.length ? res.vitalsAll[res.vitalsAll.length - 1] : null;
    var prev = res.vitalsAll.length > 1 ? res.vitalsAll[res.vitalsAll.length - 2] : null;
    function statCell(label, unit, val, prevVal) {
      return (
        '<div class="vital-cell stat"><span class="card-label">' + label + ' <span class="unit">' + unit + '</span></span>' +
        '<div class="stat-value">' + (val == null ? '—' : val) + '</div>' +
        (prevVal != null ? '<span class="vital-prev">前回 ' + prevVal + '</span>' : '') + '</div>'
      );
    }
    var statsHtml = latest
      ? '<div class="vitals-grid" style="margin-top:12px;">' +
        statCell('血圧', 'mmHg', latest.systolic + '/' + latest.diastolic, prev ? prev.systolic + '/' + prev.diastolic : null) +
        statCell('体温', '℃', latest.temp.toFixed(1), prev ? prev.temp.toFixed(1) : null) +
        statCell('SpO2', '%', latest.spo2, prev ? prev.spo2 : null) +
        statCell('体重', 'kg', latest.weight != null ? latest.weight.toFixed(1) : null,
          prev && prev.weight != null ? prev.weight.toFixed(1) : null) +
        '</div>'
      : '<div class="empty-note">バイタル記録はまだありません</div>';

    // ③ 直近の訓練記録
    var historyHtml = res.recentDays.length
      ? res.recentDays.map(function (d) {
          return (
            '<div class="card history-day">' +
            '<div class="history-date">' + dayLabel(d.date) + ' <span class="section-note">' + esc(d.time) + ' 来所</span></div>' +

            '</div>'

var adminNavSyncId = 0;

/**
 * 管理画面はスマートフォンで横スクロール式になる。
 * innerHTML の更新でスクロール位置が先頭へ戻っても、選択中タブを表示範囲へ戻す。
 */
function scheduleAdminNavSync() {
  var syncId = ++adminNavSyncId;
  requestAnimationFrame(function () {
    if (syncId !== adminNavSyncId) return;
    var nav = document.querySelector('.admin-sidebar');
    if (!nav || nav.scrollWidth <= nav.clientWidth) return;
    var active = nav.querySelector('.nav-item[aria-current="page"]');
    if (!active) return;

    var padding = 14;
    var activeLeft = active.offsetLeft;
    var activeRight = activeLeft + active.offsetWidth;
    var visibleLeft = nav.scrollLeft + padding;
    var visibleRight = nav.scrollLeft + nav.clientWidth - padding;
    if (activeLeft >= visibleLeft && activeRight <= visibleRight) return;

    var targetLeft = activeLeft - (nav.clientWidth - active.offsetWidth) / 2;
    var maxLeft = Math.max(0, nav.scrollWidth - nav.clientWidth);
    nav.scrollLeft = Math.max(0, Math.min(targetLeft, maxLeft));
  });
}

function adminShell(active, contentHtml) {

function vitalsChartSvg(recordsAll) {

    return 150 - ((c - 60) * 90) / 80;
  }
  function pts(pick) {
    return recent.map(function (r, i) { return x(i) + ',' + y(pick(r)); }).join(' ');
  }
  var body = '';
  if (n > 0) {
    body =

      '<polyline points="' + pts(function (r) { return r.pulse; }) + '" fill="none" stroke="#D5688E" stroke-width="3" stroke-dasharray="1 7" stroke-linecap="round"></polyline>' +
      '<text x="' + x(0) + '" y="170" font-size="11" fill="#7A8A7D">' + shortDate(recent[0].date) + '</text>' +

/**
 * HDS-R・MMSE の点数推移グラフ(0〜30点)。
 * 結果文字列("24/30点" など)の先頭の数値を点数として使う。
 */
function scoreChartSvg(scores) {
  var series = { 'HDS-R': [], 'MMSE': [] };
  scores.slice().reverse().forEach(function (r) { // 古い順に並べ直す
    var v = parseFloat(String(r.result));
    if (!isFinite(v)) return;
    if (series[r.type]) series[r.type].push({ date: r.date, value: Math.max(0, Math.min(30, v)) });
  });
  var hdsr = series['HDS-R'].slice(-8);
  var mmse = series['MMSE'].slice(-8);
  if (!hdsr.length && !mmse.length) return '';
  var n = Math.max(hdsr.length, mmse.length);
  function x(list, i) { return list.length <= 1 ? 270 : 60 + (i * 420) / (list.length - 1); }
  function y(v) { return 150 - (v * 120) / 30; }
  function line(list, color, dash) {
    if (!list.length) return '';
    var pts = list.map(function (p, i) { return x(list, i) + ',' + y(p.value); }).join(' ');
    var dots = list.map(function (p, i) {
      return '<circle cx="' + x(list, i) + '" cy="' + y(p.value) + '" r="3.5" fill="' + color + '"></circle>';
    }).join('');
    return '<polyline points="' + pts + '" fill="none" stroke="' + color + '" stroke-width="3"' +
      (dash ? ' stroke-dasharray="6 5"' : '') + ' stroke-linecap="round" stroke-linejoin="round"></polyline>' + dots;
  }
  var axis = hdsr.length >= mmse.length ? hdsr : mmse;
  var labels =
    '<text x="' + x(axis, 0) + '" y="170" font-size="11" fill="#7A8A7D">' + shortDate(axis[0].date) + '</text>' +
    (axis.length > 1 ? '<text x="' + x(axis, axis.length - 1) + '" y="170" font-size="11" fill="#7A8A7D" text-anchor="end">' + shortDate(axis[axis.length - 1].date) + '</text>' : '');
  return (
    '<svg viewBox="0 0 520 180" style="width:100%;height:auto;">' +
    '<line x1="40" y1="20" x2="40" y2="150" stroke="#DCE5DB" stroke-width="1"></line>' +
    '<line x1="40" y1="150" x2="510" y2="150" stroke="#DCE5DB" stroke-width="1"></line>' +
    '<line x1="40" y1="30" x2="510" y2="30" stroke="#EDF1EC" stroke-width="1"></line>' +
    '<line x1="40" y1="90" x2="510" y2="90" stroke="#EDF1EC" stroke-width="1"></line>' +
    '<text x="34" y="34" font-size="11" fill="#7A8A7D" text-anchor="end">30</text>' +
    '<text x="34" y="94" font-size="11" fill="#7A8A7D" text-anchor="end">15</text>' +
    '<text x="34" y="154" font-size="11" fill="#7A8A7D" text-anchor="end">0</text>' +
    line(hdsr, '#2E7D32', false) + line(mmse, '#5B5EA6', true) + labels + '</svg>' +
    '<div class="legend">' +
    (hdsr.length ? '<span><span class="chip" style="background:#2E7D32;"></span>HDS-R</span>' : '') +
    (mmse.length ? '<span><span class="chip" style="background:#5B5EA6;"></span>MMSE</span>' : '') + '</div>'
  );
}

/** 任意の数値記録を自動スケールで描く推移グラフ。 */
function numericTrendSvg(points, unit, color) {
  var list = points.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; }).slice(-10);
  if (!list.length) return '';
  var values = list.map(function (p) { return Number(p.value); });
  var min = Math.min.apply(null, values);
  var max = Math.max.apply(null, values);
  var pad = max === min ? Math.max(Math.abs(max) * 0.15, 1) : (max - min) * 0.18;
  min -= pad; max += pad;
  function x(i) { return list.length <= 1 ? 270 : 60 + (i * 420) / (list.length - 1); }
  function y(v) { return 145 - ((v - min) * 110) / (max - min); }
  var pts = list.map(function (p, i) { return x(i) + ',' + y(p.value); }).join(' ');
  var dots = list.map(function (p, i) {
    return '<circle cx="' + x(i) + '" cy="' + y(p.value) + '" r="4" fill="' + color + '"><title>' +
      esc(dayLabel(p.date) + ' ' + p.value + unit) + '</title></circle>';
  }).join('');
  var latest = list[list.length - 1];
  return '<svg class="numeric-trend-svg" viewBox="0 0 520 178" role="img" aria-label="数値の推移">' +
    '<line x1="42" y1="25" x2="42" y2="145" stroke="#DCE5DB"></line>' +
    '<line x1="42" y1="145" x2="505" y2="145" stroke="#DCE5DB"></line>' +
    '<line x1="42" y1="85" x2="505" y2="85" stroke="#EDF1EC"></line>' +
    '<text x="36" y="30" text-anchor="end">' + esc(Number(max.toFixed(1))) + '</text>' +
    '<text x="36" y="149" text-anchor="end">' + esc(Number(min.toFixed(1))) + '</text>' +
    '<polyline points="' + pts + '" fill="none" stroke="' + color + '" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></polyline>' + dots +
    '<text x="60" y="166">' + esc(shortDate(list[0].date)) + '</text>' +
    '<text x="505" y="166" text-anchor="end">' + esc(shortDate(latest.date)) + '</text>' +
    '<text x="500" y="22" text-anchor="end" class="trend-latest">最新 ' + esc(latest.value) + esc(unit) + '</text></svg>';
}

function fitnessTrendCards(records) {
  var groups = {};
  records.forEach(function (r) {
    var value = parseFloat(String(r.result || ''));
    if (!isFinite(value)) return;
    var key = r.item || '体力測定';
    if (!groups[key]) groups[key] = [];
    groups[key].push({ date: r.date, value: value, unit: String(r.result).replace(/^\s*[-+]?\d+(?:\.\d+)?\s*/, '') });
  });
  return Object.keys(groups).filter(function (key) { return groups[key].length >= 2; }).slice(0, 6).map(function (key, i) {
    var unit = groups[key][groups[key].length - 1].unit || '';
    return '<div class="trend-card"><div class="trend-title">' + esc(key) + '<span>直近' + groups[key].length + '回</span></div>' +
      numericTrendSvg(groups[key], unit, i % 2 ? '#5B5EA6' : '#2E7D32') + '</div>';
  }).join('');
}

function cognitiveTrendCards(records) {
  var groups = {};
  records.forEach(function (r) {
    if (r.durationMinutes !== '' && r.durationMinutes != null && isFinite(Number(r.durationMinutes))) {
      var durationKey = r.activity + '｜所要時間';
      if (!groups[durationKey]) groups[durationKey] = { unit: '分', points: [] };
      groups[durationKey].points.push({ date: r.date, value: Number(r.durationMinutes) });
    }
    if (r.metricValue !== '' && r.metricValue != null && isFinite(Number(r.metricValue))) {
      var metricKey = r.activity + '｜成果';
      if (!groups[metricKey]) groups[metricKey] = { unit: r.metricUnit || '', points: [] };
      groups[metricKey].points.push({ date: r.date, value: Number(r.metricValue) });
    }
  });
  return Object.keys(groups).filter(function (key) { return groups[key].points.length >= 2; }).slice(0, 6).map(function (key, i) {
    var g = groups[key];
    return '<div class="trend-card"><div class="trend-title">' + esc(key.replace('｜', ' · ')) + '<span>直近' + g.points.length + '回</span></div>' +
      numericTrendSvg(g.points, g.unit, i % 2 ? '#D5688E' : '#5B5EA6') + '</div>';
  }).join('');
}

function barColor(ratio) {
  if (ratio >= 0.85) return '#2E7D32';
  if (ratio >= 0.6) return '#5B9E58';
  if (ratio >= 0.4) return '#9CC29A';
  return '#C4DAC2';
}

function buildDays(res) {
  var dateSet = {};
  res.monthCheckins.forEach(function (c) { dateSet[c.date] = true; });
  var dates = Object.keys(dateSet).sort().reverse();
  return dates.map(function (date) {
    var checkin = null;
    res.monthCheckins.forEach(function (c) { if (c.date === date && !checkin) checkin = c; });
    var vital = null;
    res.monthVitals.forEach(function (v) { if (v.date === date) vital = v; });
    var exercises = res.monthExercises
      .filter(function (e) { return e.date === date; })
      .sort(function (a, b) { return timeKey(a.time) < timeKey(b.time) ? -1 : 1; });
    var note = exercises.map(function (e) { return e.note; }).filter(String).join(' ');
    return { date: date, checkin: checkin, vital: vital, exercises: exercises, note: note };
  });
}

/**
 * 連絡文の自動作成。variant を変えると言い回しが変わるため、
 * 「文章を自動作成し直す」を押すたびに違う下書きが得られる。
 */
var NOTEBOOK_OPENINGS = [
  '本日は{n}種目の運動に取り組まれました。',
  '本日も意欲的に{n}種目の運動を実施されました。',
  '本日は{n}種目のプログラムを最後まで頑張られました。',
];
var NOTEBOOK_OPENINGS_REST = [
  '本日も体調に配慮しながら、無理のない範囲で過ごしていただきました。',
  '本日は体調に合わせて、ゆったりとお過ごしいただきました。',
  '本日も無理のないペースで、穏やかに過ごされました。',
];
var NOTEBOOK_CLOSINGS = [
  '最後までしっかりと体を動かしていただきました。',
  '終始落ち着いて取り組まれ、良い運動になりました。',
  '次回も安全に気をつけながら進めてまいります。',
];
function defaultNotebookComment(data, variant) {
  var v = Math.abs(Number(variant) || 0);
  function pick(list) { return list[v % list.length]; }
  var notes = data.exercises.map(function (e) { return e.note; }).filter(String);
  var parts = [];
  if (data.exercises.length) {
    parts.push(pick(NOTEBOOK_OPENINGS).replace('{n}', data.exercises.length));
  } else {
    parts.push(pick(NOTEBOOK_OPENINGS_REST));
  }
  if (data.vital && data.vital.conditionNote) parts.push(data.vital.conditionNote);
  if (notes.length) parts.push(notes.join(' '));
  if (data.cognitiveRecords && data.cognitiveRecords.length) {
    parts.push('脳トレは「' + data.cognitiveRecords.map(function (r) { return r.activity; }).join('、') + '」を実施しました。');
  }
  if (parts.length === 1 && data.exercises.length) parts.push(pick(NOTEBOOK_CLOSINGS));
  return parts.join('');
}

/**
 * 大きな端末写真を非同期デコードして縮小する。createImageBitmap 対応端末では
 * メインUIを塞がずに読み込み、未対応端末は object URL で安全にフォールバックする。
 */
function resizeSelectedImage(file, options) {
  options = options || {};
  if (!file || !/^image\//.test(file.type || '')) return Promise.reject(new Error('画像ファイルを選択してください'));
  if (file.size > 25 * 1024 * 1024) return Promise.reject(new Error('25MB以下の写真を選択してください'));

  function draw(source, sourceWidth, sourceHeight, close) {
    return new Promise(function (resolve, reject) {
      setTimeout(function () {
        try {
          var sx = 0, sy = 0, sw = sourceWidth, sh = sourceHeight;
          var outW, outH;
          if (options.square) {
            sw = sh = Math.min(sourceWidth, sourceHeight);
            sx = (sourceWidth - sw) / 2;
            sy = (sourceHeight - sh) / 2;
            outW = outH = Math.min(options.maxDimension || 320, sw);
          } else {
            var ratio = Math.min(1, (options.maxDimension || 1280) / Math.max(sourceWidth, sourceHeight));
            outW = Math.max(1, Math.round(sourceWidth * ratio));
            outH = Math.max(1, Math.round(sourceHeight * ratio));
          }
          var canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(outW));
          canvas.height = Math.max(1, Math.round(outH));
          var ctx = canvas.getContext('2d', { alpha: false });
          if (!ctx) throw new Error('写真を処理できませんでした');
          ctx.drawImage(source, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
          var quality = options.quality || 0.8;
          var data = canvas.toDataURL('image/jpeg', quality);
          while (options.maxChars && data.length > options.maxChars && quality > 0.3) {
            quality -= 0.1;
            data = canvas.toDataURL('image/jpeg', quality);
          }
          canvas.width = canvas.height = 1;
          if (close) close();
          if (options.maxChars && data.length > options.maxChars) throw new Error('写真を十分に圧縮できませんでした。別の写真でお試しください');
          resolve(data);
        } catch (e) {
          if (close) close();
          reject(e);
        }
      }, 0);
    });
  }

  function imageFallback() {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.decoding = 'async';
      img.onload = function () {
        draw(img, img.naturalWidth, img.naturalHeight, function () { URL.revokeObjectURL(url); }).then(resolve, reject);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('写真を読み込めませんでした。JPEGまたはPNGをご利用ください')); };
      img.src = url;
    });
  }

  if (window.createImageBitmap) {
    return Promise.resolve().then(function () {
      return createImageBitmap(file, { imageOrientation: 'from-image' });
    }).then(function (bitmap) {
      return draw(bitmap, bitmap.width, bitmap.height, function () { bitmap.close(); });
    }).catch(function () { return imageFallback(); });
  }
  return imageFallback();
}

  // --- バイタル ---
  vInput: function (key, value) {
    var clean = value.replace(/[^0-9.]/g, '');
    var dot = clean.indexOf('.');
    S.vDraft[key] = dot < 0 ? clean : clean.slice(0, dot + 1) + clean.slice(dot + 1).replace(/\./g, '');
    S.vitalConfirmed = false;
    Actions.vRefresh();
  },
  vCondition: function (value) {
    S.vDraft.conditionNote = value.slice(0, 300);
  },
  /** 体調・特記事項の定型文チップ(複数選択可) */
  vTag: function (el) {
    var tag = el.getAttribute('data-cond');
    var tags = S.vDraft.conditionTags || (S.vDraft.conditionTags = []);
    var i = tags.indexOf(tag);
    if (i >= 0) tags.splice(i, 1); else tags.push(tag);
    var on = i < 0;
    el.classList.toggle('selected', on);
    el.setAttribute('aria-pressed', on ? 'true' : 'false');
  },
  precautionConfirm: function (checked) {
    S.precautionConfirmed = checked;
    Actions.vRefresh();
  },
  vRefresh: function () {
    var alerts = evaluateVitalAlerts(S.vDraft, S.prevVital);
    var errors = vitalValidationErrors(S.vDraft);
    var box = document.getElementById('v-alerts');
    if (box) {
      var errorHtml = errors.map(function (msg) {
        return '<div class="toast-error" role="alert"><span class="x-circle">!</span><span class="t-sub">' + esc(msg) + '</span></div>';
      }).join('');
      var alertHtml = alerts.map(function (msg) {
        return '<div class="alert-banner" role="alert"><span class="alert-dot"></span><span class="alert-text">' + esc(msg) + '</span></div>';
      }).join('');
      var confirmHtml = alerts.length
        ? '<label class="safety-confirm"><input type="checkbox" ' + (S.vitalConfirmed ? 'checked' : '') + ' onchange="Actions.vConfirm(this.checked)">' +
          '<span><strong>職員による確認済み</strong><small>運動を開始できる状態か確認しました</small></span></label>'
        : '';
      box.innerHTML = errorHtml + alertHtml + confirmHtml;
      box.style.display = (alerts.length || errors.length) ? 'flex' : 'none';
      box.style.flexDirection = 'column';
      box.style.gap = '12px';
    }
    // 必須は血圧・脈拍・体温のみ(SpO2・体重は任意)
    var requiredLabels = { systolic: '血圧(上)', diastolic: '血圧(下)', pulse: '脈拍', temp: '体温' };
    var missing = Object.keys(requiredLabels).filter(function (k) { return S.vDraft[k] === ''; });
    var hint = document.getElementById('v-hint');
    var user = currentUser();
    var precautionPending = !!(user && String(user.precautions || '').trim() && !S.precautionConfirmed);
    if (hint) {
      hint.textContent = missing.length
        ? 'あと入力: ' + missing.map(function (k) { return requiredLabels[k]; }).join('・')
        : (precautionPending
          ? '運動の禁止事項・注意点を確認してください'
          : (alerts.length && !S.vitalConfirmed ? '「職員による確認済み」にチェックすると保存できます' : ''));
    }
    var btn = document.getElementById('v-save');
    if (btn) btn.disabled = missing.length > 0 || errors.length > 0 || precautionPending || (alerts.length > 0 && !S.vitalConfirmed);
  },
  vConfirm: function (checked) {
    S.vitalConfirmed = checked;
    Actions.vRefresh();
  },
  vReset: function () {
    S.vDraft = { systolic: '', diastolic: '', pulse: '', temp: '', spo2: '', weight: '', conditionNote: '', conditionTags: [] };
    S.vitalConfirmed = false;
    S.precautionConfirmed = false;
    render();
  },
  vSave: function () {
    var alerts = evaluateVitalAlerts(S.vDraft, S.prevVital);
    if (vitalValidationErrors(S.vDraft).length || (alerts.length && !S.vitalConfirmed)) return;
    var btn = document.getElementById('v-save');
    if (btn) { btn.disabled = true; btn.textContent = '保存中…'; }
    var payload = { userId: S.currentUserId };
    ['systolic', 'diastolic', 'pulse', 'temp', 'spo2', 'weight'].forEach(function (k) {
      payload[k] = S.vDraft[k];
    });
    // 選んだ定型文と自由記載をひとつの文にまとめて保存する(記録の形式は従来どおり)
    var parts = (S.vDraft.conditionTags || []).slice();
    var free = (S.vDraft.conditionNote || '').trim();
    if (free) parts.push(free);
    payload.conditionNote = parts.join('。').slice(0, 300);
    rpc('apiSaveVitals', payload).then(function (rec) {
      S.vDraft = null;
      S.vitalConfirmed = false;
      S.lastSaved = { kind: 'vitals', id: rec.id, label: 'バイタルを記録しました' };
      S.todayStatusCache = null; // メニューの状況表示を最新化
      go('menu');
    }).catch(function (e) {
      showSaveError('保存できませんでした。電波状況をご確認のうえ、もう一度お試しください');
      if (btn) { btn.disabled = false; btn.textContent = 'バイタルを保存'; }
    });
  },

  // --- 訓練(15分×4コマ。準備運動+選択3種目) ---
  exSlot: function (index, exerciseId) {
    if (!S.exDraft) S.exDraft = { slots: ['', '', ''], note: '' };
    S.exDraft.slots[index] = exerciseId;
    S.exDraft.message = '';
    render();
  },
  exNote: function (value) {
    if (!S.exDraft) S.exDraft = { slots: ['', '', ''], note: '' };
    S.exDraft.note = value.slice(0, 300);
    S.exDraft.message = '';
  },
  exBatchSave: function () {
    var d = S.exDraft || { slots: [], note: '' };
    var ids = [];
    (d.slots || []).forEach(function (id) { if (id && ids.indexOf(id) < 0) ids.push(id); });
    var err = document.getElementById('ex-error');
    var hasPrep = false;
    var cached = S.exerciseCache[S.currentUserId];
    ((cached && cached.data) || []).forEach(function (r) { if (r.exerciseId === PREPARATION_EXERCISE_ID) hasPrep = true; });
    if (!ids.length && hasPrep) {
      if (err) err.textContent = '未記録の運動を1つ以上選択してください';
      return;
    }
    var btn = document.getElementById('ex-save');
    if (btn) { btn.disabled = true; btn.textContent = '保存中…'; }
    rpc('apiSaveExerciseBatch', { userId: S.currentUserId, exerciseIds: ids, note: (d.note || '').trim() })
      .then(function (res) {
        var next = cached && cached.data ? cached.data.slice() : [];
        (res.records || []).forEach(function (r) { next.push(r); });
        S.exerciseCache[S.currentUserId] = { data: next, expires: Date.now() + 45000 };
        S.todayStatusCache = null;
        S.exDraft = { slots: ['', '', ''], note: '', message: (res.records || []).length + '項目を記録しました' };
        render();
      })
      .catch(function (e) {
        if (err) err.textContent = (e && e.message) || '保存できませんでした';
        if (btn) { btn.disabled = false; btn.textContent = '選択した運動を記録する'; }
      });
  },
  // 旧キャッシュ端末との互換用。新UIでは使わない。
  exQuickSave: function (el, exerciseId) {
    if (el) {
      el.disabled = true;
      var summary = el.querySelector('.ex-summary');
      if (summary) summary.textContent = '記録中…';
    }
    rpc('apiSaveExercise', {
      userId: S.currentUserId, exerciseId: exerciseId,
      amount: '実施', load: '', note: '',
    }).then(function (res) {
      var ex = exerciseById(exerciseId);
      S.lastSaved = { kind: 'records', id: res.record.id, label: (ex ? ex.name : '種目') + 'を記録しました' };
      var cachedExercises = S.exerciseCache[S.currentUserId];
      var nextExercises = cachedExercises && cachedExercises.data ? cachedExercises.data.slice() : [];
      nextExercises.push(res.record);
      S.exerciseCache[S.currentUserId] = { data: nextExercises, expires: Date.now() + 45000 };
      S.todayStatusCache = null; // メニューの状況表示を最新化
      render();
    }).catch(function () {
      if (el) {
        el.disabled = false;
        var summary2 = el.querySelector('.ex-summary');
        if (summary2) summary2.textContent = 'タップで記録';
      }
      showSaveError('保存できませんでした。電波状況をご確認のうえ、もう一度お試しください');
    });
  },
  /** 直前に保存した記録の取り消し(論理削除) */
  undoLast: function () {
    var last = S.lastSaved;
    if (!last) return;
    S.lastSaved = null;
    rpc('apiVoidRecord', last.kind, last.id).then(function () {
      delete S.exerciseCache[S.currentUserId];
      S.todayStatusCache = null;
      render();
    }).catch(function () {
      S.lastSaved = last;
      showSaveError('取り消しできませんでした。もう一度お試しください');
    });
  },
  dismissSnackbar: function () {
    S.lastSaved = null;
    var bar = document.getElementById('snackbar');
    if (bar) bar.remove();
  },

  // --- 利用者一覧 ---
  filterUsers: function (query) {
    S.userQuery = (query || '').replace(/\s/g, '');
    Actions.applyUserFilters();
  },
  userFilter: function (mode) {
    S.userFilterMode = mode;
    document.querySelectorAll('.filter-chips .chip').forEach(function (el) {
      el.classList.toggle('selected', el.getAttribute('data-filter') === mode);
    });
    Actions.applyUserFilters();
  },
  applyUserFilters: function () {
    var q = S.userQuery || '';
    var mode = S.userFilterMode || 'all';
    var visible = 0;
    document.querySelectorAll('.person-row.tappable[data-state]').forEach(function (el) {
      var name = el.getAttribute('data-name') || '';
      var state = el.getAttribute('data-state');
      var hasAlert = el.getAttribute('data-alert') === '1';
      var show = (!q || name.indexOf(q) >= 0) &&
        (mode === 'all' || (mode === 'today' && state === 'checked') || (mode === 'alert' && hasAlert));
      el.hidden = !show;
      if (show) visible++;
    });
    // 空になったかなグループの見出しも隠す
    document.querySelectorAll('.kana-group').forEach(function (g) {
      var any = false;
      g.querySelectorAll('.person-row.tappable').forEach(function (el) { if (!el.hidden) any = true; });
      g.hidden = !any;
    });
    var empty = document.getElementById('user-empty');
    if (empty) empty.hidden = visible > 0;
  },

  // --- 体力測定・評価記録 ---
  assessType: function (type) {
    if (!S.assessDraft) S.assessDraft = { type: type, item: '', freeItem: '', result: '', detail: '' };
    S.assessDraft.type = type;
    render();
  },
  assessBatchItem: function (item) {
    if (!S.assessBatch) S.assessBatch = { item: item, entries: {}, message: '' };
    S.assessBatch.item = item;
    S.assessBatch.message = '';
    render();
  },
  assessBatchInput: function (userId, field, value) {
    if (!S.assessBatch.entries[userId]) S.assessBatch.entries[userId] = { result: '', detail: '' };
    S.assessBatch.entries[userId][field] = String(value || '').slice(0, field === 'detail' ? 500 : 120);
  },
  assessBatchSave: function () {
    var d = S.assessBatch;
    var entries = [];
    Object.keys(d.entries || {}).forEach(function (userId) {
      var entry = d.entries[userId];
      if ((entry.result || '').trim()) entries.push({ userId: userId, result: entry.result.trim(), detail: (entry.detail || '').trim() });
    });
    var err = document.getElementById('assess-error');
    if (!entries.length) { if (err) err.textContent = '実施した利用者の測定値を1件以上入力してください'; return; }
    var btn = document.getElementById('assess-save');
    if (btn) { btn.disabled = true; btn.textContent = '一括保存中…'; }
    rpc('apiSaveAssessmentBatch', { item: d.item, entries: entries }).then(function (res) {
      S.assessBatch = { item: d.item, entries: {}, message: (res.records || []).length + '名分を保存しました（' + res.date + '）' };
      S.todayStatusCache = null;
      clearRpcCache();
      render();
    }).catch(function (e) {
      if (err) err.textContent = (e && e.message) || '一括保存できませんでした';
      if (btn) { btn.disabled = false; btn.textContent = '入力した測定結果を一括保存'; }
    });
  },
  assessItem: function (el) {
    var item = el.getAttribute('data-item');
    S.assessDraft.item = S.assessDraft.item === item ? '' : item;
    document.querySelectorAll('[data-item]').forEach(function (c) {
      var on = c.getAttribute('data-item') === S.assessDraft.item;
      c.classList.toggle('selected', on);
      c.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  },
  assessFreeItem: function (value) { S.assessDraft.freeItem = value.slice(0, 40); },
  assessResult: function (value) { S.assessDraft.result = value.slice(0, 120); },
  assessDetail: function (value) { S.assessDraft.detail = value.slice(0, 500); },
  assessSave: function () {
    var d = S.assessDraft;
    var err = document.getElementById('assess-error');
    var item = d.type === '体力測定' ? (d.item || d.freeItem || '').trim() : '';
    if (d.type === '体力測定' && !item) { if (err) err.textContent = '測定種目を選ぶか入力してください'; return; }
    if (!(d.result || '').trim()) { if (err) err.textContent = (d.type === '体力測定' ? '結果' : '点数') + 'を入力してください'; return; }
    var btn = document.getElementById('assess-save');
    if (btn) { btn.disabled = true; btn.textContent = '保存中…'; }
    rpc('apiSaveAssessment', { userId: S.currentUserId, date: S.today, type: d.type, item: item, result: d.result.trim(), detail: (d.detail || '').trim() })
      .then(function (rec) {
        S.lastSaved = { kind: 'assessments', id: rec.id, label: (item || d.type) + ' の記録を保存しました' };
        S.assessDraft = { type: d.type, item: '', freeItem: '', result: '', detail: '' };
        clearRpcCache();
        render();
      })
      .catch(function (e) {
        if (err) err.textContent = (e && e.message) || '保存できませんでした';
        if (btn) { btn.disabled = false; btn.textContent = 'この内容で記録する'; }
      });
  },

  // --- 職員管理(管理者専用) ---
  staffNew: function () {
    S.editingStaff = { id: '', name: '', kana: '', jobTitle: '', role: 'staff', active: true };
    drawAdminStaff(document.getElementById('app'));
  },
  staffEdit: function (id) {
    var target = null;
    (S.staffAdminList || []).forEach(function (x) { if (x.id === id) target = x; });
    if (!target) return;
    S.editingStaff = {
      id: target.id, name: target.name, kana: target.kana,
      jobTitle: target.jobTitle, role: target.role, active: target.active,
    };
    drawAdminStaff(document.getElementById('app'));
  },
  staffCancelEdit: function () {
    S.editingStaff = null;
    drawAdminStaff(document.getElementById('app'));
  },
  staffSave: function () {
    var err = document.getElementById('staff-error');
    var roleEl = document.querySelector('input[name="s-role"]:checked');
    var payload = {
      id: S.editingStaff.id,
      name: document.getElementById('s-name').value.trim(),
      kana: document.getElementById('s-kana').value.trim(),
      jobTitle: document.getElementById('s-job').value.trim(),
      role: roleEl ? roleEl.value : 'staff',
      pin: document.getElementById('s-pin').value.trim(),
      active: document.getElementById('s-active').checked,
    };
    if (!payload.name) { if (err) err.textContent = '氏名を入力してください'; return; }
    if (!payload.id && !payload.pin) { if (err) err.textContent = '新規登録にはPINが必要です'; return; }
    if (payload.pin && !/^\d{4,8}$/.test(payload.pin)) {
      if (err) err.textContent = 'PINは4〜8桁の数字で入力してください';
      return;
    }
    var btn = document.getElementById('s-save');
    if (btn) { btn.disabled = true; btn.textContent = '保存中…'; }
    rpc('apiAdminSaveStaff', payload).then(function (res) {
      S.staffAdminList = res.staff;
      S.editingStaff = null;
      drawAdminStaff(document.getElementById('app'));

    if (url === '') {
      localStorage.removeItem('gasApiUrl');
      localStorage.removeItem('gasApiToken');
      location.reload();
      return;
    }
    if (url.indexOf('https://script.google.com/') !== 0 || url.indexOf('/exec') < 0) {
      errBox.textContent = 'URLの形式が違います。「https://script.google.com/macros/s/…/exec」を貼り付けてください';

      .then(function (res) {
        if (!res.ok) throw new Error(res.error || '');

        localStorage.setItem('gasApiToken', token);
        location.reload();

    var rows = days.map(function (d) {
      return [
        d.date,
        d.checkin ? d.checkin.time : '',
        d.checkin ? d.checkin.checkoutTime || '' : '',
        d.checkin ? d.checkin.transport || '' : '',
        d.vital ? d.vital.systolic : '', d.vital ? d.vital.diastolic : '',
        d.vital ? d.vital.pulse : '', d.vital ? d.vital.temp : '',
        d.vital && d.vital.spo2 != null ? d.vital.spo2 : '',
        d.vital && d.vital.weight != null ? d.vital.weight : '',
        d.vital ? d.vital.conditionNote || '' : '',

        d.note,
      ];
    });
    var csv = [header].concat(rows).map(function (r) {

        return '"' + value.replace(/"/g, '""') + '"';

    var a = document.createElement('a');

        cognitiveRecords: db.cognitive.filter(function (c) { return c.userId === userId; })
          .sort(function (a, b) { return (a.date + timeKey(a.time)) < (b.date + timeKey(b.time)) ? -1 : 1; }),
        assessments: db.assessments.filter(function (a) { return a.userId === userId; })
          .sort(function (a, b) { return a.date < b.date ? -1 : 1; }),
      };
    },
    apiGetTodayRecords: function () {
      var db = load();
      var t = todayStr();
      return {
        checkins: fns.apiGetTodayCheckins(),
        vitals: db.vitals.filter(function (v) { return v.date === t; }),
        records: db.records.filter(function (e) { return e.date === t; }),
        cognitiveRecords: db.cognitive.filter(function (e) { return e.date === t; }),
        assessments: db.assessments.filter(function (e) { return e.date === t; }),
      };
    },
    apiGetMonthly: function (month) {
      var db = load();
      var months = {};
      db.checkins.forEach(function (c) { months[c.date.slice(0, 7)] = true; });
      function inM(d) { return d.slice(0, 7) === month; }
      return {
        months: Object.keys(months).sort().reverse(),
        checkins: db.checkins.filter(function (c) { return inM(c.date); }),
        vitals: db.vitals.filter(function (v) { return inM(v.date); }),
        records: db.records.filter(function (e) { return inM(e.date); }),
      };
    },
  };

  return {
    call: function (name, args) {
      if (!fns[name]) return Promise.reject(new Error('unknown api: ' + name));
      try {
        return Promise.resolve(fns[name].apply(null, args));
      } catch (e) {
        return Promise.reject(e);
      }
    },
  };
})();

// ---------------------------------------------------------------- 起動

function showBootError(message) {
  if (isStandalone() && window.GAS_API_URL && message.indexOf('認証エラー') >= 0) {
    document.getElementById('app').innerHTML =
      '<div class="phone-wrap"><div class="phone"><header class="phone-header">' +
      '<img class="logo" src="' + LOGO + '" alt="銀松苑ロゴ"><div><div class="h-sub">デイサービス銀松苑</div><div class="h-title">端末の初回認証</div></div></header>' +
      '<div class="phone-body"><div class="screen-intro"><span class="eyebrow">SECURE SETUP</span><h1>この端末を接続</h1><p>管理者PINを一度入力すると、以後この端末で安全に記録できます。</p></div>' +
      '<div class="card" style="display:grid;gap:12px;"><input type="password" inputmode="numeric" class="note-area" id="pair-pin" placeholder="管理者PIN" aria-label="管理者PIN" autocomplete="current-password">' +
      '<div id="pair-error" class="section-note" role="alert"></div><button class="btn-primary" onclick="Actions.pairDevice()">この端末を接続する</button></div>' +
      '<div class="section-note">端末内には接続情報のみを保存します。PINは保存しません。</div></div></div></div>';
    return;
  }
  document.getElementById('app').innerHTML =
    '<div style="padding:48px;text-align:center;color:#8A4560;font-weight:700;">' +
    '起動エラー: ' + esc(message) +
    '<br><span style="font-weight:400;font-size:13px;">Apps Script エディタで setup() を実行済みか確認してください</span></div>';
}

/** ログイン画面に出す職員一覧を取得する */
function loadStaffListThenRender() {
  return rpc('apiGetStaffList').then(function (res) {
    S.staffList = (res && res.staff) || [];
    render();
  }).catch(function (e) {
    var message = String((e && e.message) || e || '');
    if (message.indexOf('施設コード') >= 0) return showFacilityCodeScreen();
    showBootError(message);
  });
}

/** 配布リンク以外から開かれたとき(施設コードが無い/違う) */
function showFacilityCodeScreen() {
  document.getElementById('app').innerHTML =
    '<div class="phone-wrap"><div class="phone">' +
    '<header class="phone-header">' +
    '<img class="logo" src="' + LOGO + '" alt="銀松苑ロゴ">' +
    '<div><div class="h-sub">デイサービス銀松苑</div><div class="h-title">機能訓練記録</div></div>' +
    '</header>' +
    '<div class="phone-body">' +
    '<div class="screen-intro"><span class="eyebrow">確認</span><h1>職員用リンクから開いてください</h1>' +
    '<p>このアプリは、施設から配布された専用リンクからのみ利用できます。' +
    'ホーム画面に追加する際も、そのリンクから開いた画面で追加してください。</p></div>' +
    '<div class="card" style="display:grid;gap:10px;">' +
    '<span class="card-label">施設コードを入力して開く</span>' +
    '<input class="note-area" id="facility-input" placeholder="施設コード" autocapitalize="none" ' +
    'autocorrect="off" style="min-height:48px;font-size:18px;">' +
    '<div class="section-note" id="facility-error" style="color:var(--alert-text);min-height:18px;"></div>' +
    '<button class="btn-primary" style="flex:none;width:100%;" onclick="Actions.applyFacilityCode()">開く</button>' +
    '</div>' +
    '<div class="section-note">分からない場合は施設の管理者にお問い合わせください。</div>' +
    '</div></div></div>';
  setTimeout(function () {
    var el = document.getElementById('facility-input');
    if (el) el.focus();
  }, 0);
}

/** ログイン後のマスタ読み込み */
function bootAfterLogin() {
  return rpc('apiGetBootstrap').then(function (boot) {
    if (!boot.apiVersion || boot.apiVersion < 6) {
      throw new Error('GASが旧バージョンです。Apps Scriptを最新版として再デプロイしてください');
    }
    S.users = sortUsersKana(boot.users);
    S.exercises = boot.exercises;
    S.cognitiveMenu = boot.cognitiveMenu || [];
    S.today = boot.today;
    S.staff = boot.staff;
    if (S.me && boot.role) S.me.role = boot.role; // 権限はサーバーの現在値を優先
    S.todayCheckins = boot.todayCheckins;
    S.ready = true;
    render();
    // 次に開かれやすい画面のデータを裏で温めておく(初回タップの待ちを消す)
    setTimeout(function () {
      rpc('apiGetTodayAlerts').catch(function () {});
      rpc('apiGetTodayRecords').catch(function () {});
      ensurePhotos(); // 顔写真は裏で読み込み、取得後に表示中の画面へ反映される
      checkForUpdate();
    }, 300);
  });
}

// ---- 起動: セッションがあれば復帰、無ければログイン画面 ----
if (S.session) {
  rpc('apiGetSession').then(function (res) {
    S.me = res.staff;
    return bootAfterLogin();
  }).catch(function (e) {
    var message = String((e && e.message) || e || '');
    if (message.indexOf('ログイン') >= 0 || message.indexOf('職員アカウント') >= 0) {
      saveSession('', null);
      return loadStaffListThenRender();
    }
    showBootError(message);
  });
} else {
  loadStaffListThenRender();
}
