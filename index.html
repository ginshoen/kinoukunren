<!DOCTYPE html>
<html lang="ja">
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
:root {
  /* Primary — 銀松苑グリーン */
  --green: #176b52;
  --green-dark: #0d4c3a;
  --green-l1: #82d9b8;
  --green-l2: #49ad86;
  --green-l3: #9fd8c1;
  --green-l4: #d4ebe1;
  /* 訓練モード */
  --purple: #5b5ea6;
  --purple-dark: #43468c;
  --purple-pale: #efeffa;
  /* アラート */
  --alert: #d5688e;
  --alert-bg: #fbeff3;
  --alert-border: #f0cbd8;
  --alert-text: #8a4560;
  /* 背景 */
  --page: #f1f4ef;
  --card-face: #fbfcfa;
  --input-bg: #f1f5f0;
  --subtle-bg: #fcfdfb;
  --sidebar: #142d24;
  --camera: #12231d;
  /* ボーダー */
  --border: #dce5db;
  --border-success: #bfdcbe;
  --border-undone: #c9d5c8;
  /* テキスト */
  --text: #14231d;
  --text-sub: #354b41;
  --text-aux: #52665c;
  --text-success: #4a6b4d;
  --text-disabled: #9aa89c;
  /* 成功背景 */
  --success-bg: #e3f1e1;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  background: radial-gradient(circle at 12% -10%, rgba(130,217,184,.2), transparent 32rem), var(--page);
  font-family: 'Zen Kaku Gothic New', sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

a {
  color: var(--green);
}
a:hover {
  color: var(--green-dark);
}

button {
  font-family: inherit;
  border: none;
  background: none;
  padding: 0;
  margin: 0;
  cursor: pointer;
  color: inherit;
}

input,
textarea,
select {
  font-family: inherit;
  color: inherit;
}

/* ---------- モバイル画面フレーム(390px カード) ---------- */
.phone-wrap {
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 24px 12px 48px;
}

.phone {
  width: 100%;
  max-width: 390px;
  background: var(--card-face);
  border-radius: 28px;
  overflow: hidden;
  box-shadow: 0 12px 40px rgba(31, 42, 34, 0.14);
  border: 1px solid var(--border);
}

@media (max-width: 430px) {
  .phone-wrap {
    padding: 0;
  }
  .phone {
    max-width: none;
    border-radius: 0;
    border: none;
    min-height: 100dvh;
  }
}

.phone-header {
  background: var(--green);
  color: #fff;
  padding: 18px 20px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.phone-header.training {
  background: var(--purple);
  padding: 16px 20px;
}

.phone-header.compact {
  padding: 16px 20px;
}

.phone-header .logo {
  height: 34px;
  width: 34px;
  background: #fff;
  border-radius: 99px;
  padding: 2px;
  object-fit: contain;
}

.phone-header .back-btn {
  font-size: 22px;
  color: #fff;
  line-height: 1;
  padding: 4px 6px;
  margin-left: -6px;
  min-width: 44px;
  min-height: 44px;
  display: flex;
  align-items: center;
}

.phone-header .h-sub {
  font-size: 12px;
  opacity: 0.85;
}
.phone-header .h-title {
  font-size: 19px;
  font-weight: 900;
}

.phone-header .h-right {
  margin-left: auto;
  text-align: right;
}

.pill-badge {
  background: rgba(255, 255, 255, 0.18);
  border-radius: 99px;
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 700;
}

.qr-read-badge {
  display: inline-block;
  background: rgba(255, 255, 255, 0.18);
  border-radius: 12px;
  padding: 6px 10px;
  font-size: 11px;
  font-weight: 700;
  text-align: center;
  line-height: 1.35;
}

.phone-body {
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* ---------- カメラビュー ---------- */
.camera-view {
  background: var(--camera);
  border-radius: 20px;
  height: 280px;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.camera-view video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.camera-dim {
  position: absolute;
  inset: 44px 64px;
  border-radius: 16px;
  box-shadow: 0 0 0 3000px rgba(0, 0, 0, 0.35);
}

.camera-corner {
  position: absolute;
  width: 28px;
  height: 28px;
}
.camera-corner.tl {
  top: 44px;
  left: 64px;
  border-top: 4px solid var(--green-l1);
  border-left: 4px solid var(--green-l1);
  border-radius: 6px 0 0 0;
}
.camera-corner.tr {
  top: 44px;
  right: 64px;
  border-top: 4px solid var(--green-l1);
  border-right: 4px solid var(--green-l1);
  border-radius: 0 6px 0 0;
}
.camera-corner.bl {
  bottom: 44px;
  left: 64px;
  border-bottom: 4px solid var(--green-l1);
  border-left: 4px solid var(--green-l1);
  border-radius: 0 0 0 6px;
}
.camera-corner.br {
  bottom: 44px;
  right: 64px;
  border-bottom: 4px solid var(--green-l1);
  border-right: 4px solid var(--green-l1);
  border-radius: 0 0 6px 0;
}

.camera-hint {
  color: #b7c9b8;
  font-size: 15px;
  font-weight: 700;
  position: relative;
  text-align: center;
  padding: 0 24px;
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
}

.capture-wrap {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 14px;
  display: flex;
  justify-content: center;
  z-index: 2;
}

.capture-btn {
  background: var(--green);
  color: #fff;
  border-radius: 99px;
  min-height: 48px;
  padding: 0 24px;
  font-size: 16px;
  font-weight: 900;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
}
.capture-btn:active {
  background: var(--green-dark);
}

/* ---------- トースト ---------- */
.toast-success {
  background: var(--success-bg);
  border: 1px solid var(--border-success);
  border-radius: 16px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  text-align: left;
}

.toast-success .check-circle {
  width: 44px;
  height: 44px;
  flex: none;
  border-radius: 99px;
  background: var(--green);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 900;
}

.toast-success .t-title {
  font-size: 17px;
  font-weight: 900;
}
.toast-success .t-sub {
  font-size: 13px;
  color: var(--text-success);
}

.toast-error {
  background: var(--alert-bg);
  border: 1px solid var(--alert-border);
  border-radius: 16px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.toast-error .x-circle {
  width: 44px;
  height: 44px;
  flex: none;
  border-radius: 99px;
  background: var(--alert);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: 900;
}

.toast-error .t-title {
  font-size: 15px;
  font-weight: 900;
  color: var(--alert-text);
}
.toast-error .t-sub {
  font-size: 13px;
  color: var(--alert-text);
}

/* ---------- リスト ---------- */
.section-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 8px;
}
.section-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-sub);
}
.section-note {
  font-size: 13px;
  color: var(--text-aux);
}

.row-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.person-row {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 44px;
}

.person-row.pending {
  border: 1px dashed var(--border-undone);
  opacity: 0.65;
}

.status-dot {
  width: 10px;
  height: 10px;
  flex: none;
  border-radius: 99px;
  background: var(--green);
}
.person-row.pending .status-dot {
  background: var(--border-undone);
}

.person-name {
  font-size: 15px;
  font-weight: 700;
}
.person-care {
  font-size: 12px;
  color: var(--text-aux);
}
.person-time {
  margin-left: auto;
  font-size: 13px;
  color: var(--text-success);
  font-weight: 700;
}
.person-row.pending .person-time {
  color: var(--text-disabled);
  font-weight: 400;
}

/* ---------- カード ---------- */
.card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 14px 16px;
}

.card-label {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-sub);
}
.card-label .unit {
  font-weight: 400;
  color: var(--text-aux);
}

/* ---------- バイタル入力 ---------- */
.bp-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.bp-title {
  font-size: 15px;
  font-weight: 900;
}
.bp-unit {
  font-size: 12px;
  color: var(--text-aux);
}
.bp-prev {
  margin-left: auto;
  font-size: 12px;
  color: var(--text-aux);
}

.bp-inputs {
  display: flex;
  gap: 10px;
  align-items: center;
}
.bp-slash {
  color: var(--text-disabled);
  font-size: 20px;
  font-weight: 700;
}

.num-box {
  flex: 1;
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 8px;
  text-align: center;
}
.num-box:focus-within {
  border: 2px solid var(--green);
  padding: 7px;
}
.num-box .nb-label {
  font-size: 11px;
  color: var(--text-aux);
}
.num-box input {
  width: 100%;
  border: none;
  background: transparent;
  outline: none;
  text-align: center;
  font-size: 30px;
  font-weight: 900;
  padding: 0;
  color: var(--text);
}
.num-box input::placeholder {
  color: var(--text-disabled);
  font-weight: 700;
}

.vitals-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.vital-cell {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 12px 14px;
}
.vital-cell:focus-within {
  border: 2px solid var(--green);
  padding: 11px 13px;
}
.vital-cell input {
  width: 100%;
  border: none;
  background: transparent;
  outline: none;
  font-size: 28px;
  font-weight: 900;
  padding: 0;
  color: var(--text);
}
.vital-cell input::placeholder {
  color: var(--text-disabled);
  font-weight: 700;
}
.vital-prev {
  font-size: 11px;
  color: var(--text-aux);
}

/* ---------- アラート ---------- */
.alert-banner {
  background: var(--alert-bg);
  border: 1px solid var(--alert-border);
  border-radius: 14px;
  padding: 10px 14px;
  display: flex;
  gap: 10px;
  align-items: center;
}
.alert-dot {
  width: 10px;
  height: 10px;
  flex: none;
  border-radius: 99px;
  background: var(--alert);
}
.alert-text {
  font-size: 13px;
  color: var(--alert-text);
  font-weight: 700;
}

/* ---------- ボタン ---------- */
.btn-row {
  display: flex;
  gap: 10px;
}

.btn-outline {
  flex: 1;
  background: #fff;
  border: 2px solid var(--green);
  color: var(--green);
  border-radius: 14px;
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 900;
}
.btn-outline:active {
  background: var(--input-bg);
}

.btn-primary {
  flex: 2;
  background: var(--green);
  color: #fff;
  border-radius: 14px;
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  font-weight: 900;
  box-shadow: 0 6px 16px rgba(46, 125, 50, 0.3);
}
.btn-primary:active {
  background: var(--green-dark);
}
.btn-primary:disabled {
  opacity: 0.5;
  box-shadow: none;
}

.btn-training {
  background: var(--purple);
  color: #fff;
  border-radius: 14px;
  min-height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 900;
  box-shadow: 0 6px 16px rgba(91, 94, 166, 0.3);
  width: 100%;
}
.btn-training:active {
  background: var(--purple-dark);
}
.btn-training:disabled {
  opacity: 0.5;
  box-shadow: none;
}

.link-plain {
  font-size: 13px;
  font-weight: 700;
  color: var(--green);
  text-align: center;
  padding: 8px;
  min-height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  width: 100%;
}

/* ---------- セグメント選択 ---------- */
.segment-row {
  display: flex;
  gap: 8px;
}

.segment {
  flex: 1;
  min-height: 48px;
  border: 1px solid var(--border);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 700;
  background: var(--input-bg);
  color: var(--text);
}
.segment.small {
  font-size: 15px;
}
.segment.selected {
  border: 2px solid var(--purple);
  background: var(--purple-pale);
  color: var(--purple-dark);
  font-weight: 900;
}

/* ---------- テキストエリア ---------- */
.note-area {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 12px;
  min-height: 64px;
  padding: 10px 12px;
  font-size: 14px;
  background: var(--subtle-bg);
  resize: vertical;
  outline: none;
}
.note-area:focus {
  border: 2px solid var(--purple);
  padding: 9px 11px;
}
.note-area::placeholder {
  color: var(--text-aux);
}

/* ---------- 実施状況リスト ---------- */
.exercise-row {
  background: var(--success-bg);
  border: 1px solid var(--border-success);
  border-radius: 12px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 44px;
}
.exercise-row .check {
  color: var(--green);
  font-weight: 900;
}
.exercise-row .ex-name {
  font-size: 14px;
  font-weight: 700;
}
.exercise-row .ex-summary {
  margin-left: auto;
  font-size: 12px;
  color: var(--text-success);
}

.exercise-row.undone {
  background: #fff;
  border: 1px dashed var(--border-undone);
  opacity: 0.7;
}
.exercise-row.undone .check {
  color: var(--text-disabled);
  font-weight: 400;
}
.exercise-row.undone .ex-summary {
  color: var(--text-disabled);
}

/* ---------- モーダル(手動選択フォールバック) ---------- */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(31, 42, 34, 0.5);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 50;
}
.modal-sheet {
  background: var(--card-face);
  border-radius: 20px 20px 0 0;
  width: 100%;
  max-width: 430px;
  max-height: 70dvh;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.modal-title {
  font-size: 16px;
  font-weight: 900;
}
.modal-row {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 48px;
  width: 100%;
  text-align: left;
  font-size: 15px;
  font-weight: 700;
}
.modal-row:active {
  background: var(--input-bg);
}

/* ---------- 管理者 PC 画面 ---------- */
.admin-wrap {
  min-height: 100dvh;
  padding: 24px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.admin-frame {
  width: 100%;
  max-width: 1180px;
  background: var(--card-face);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 12px 40px rgba(31, 42, 34, 0.14);
  border: 1px solid var(--border);
  display: flex;
  min-height: 720px;
}

.admin-sidebar {
  width: 220px;
  flex: none;
  background: var(--sidebar);
  color: var(--border);
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.admin-sidebar .brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 8px 16px;
}
.admin-sidebar .brand img {
  height: 30px;
  width: 30px;
  background: #fff;
  border-radius: 99px;
  padding: 2px;
  object-fit: contain;
}
.admin-sidebar .brand-name {
  font-size: 15px;
  font-weight: 900;
  color: #fff;
}

.nav-item {
  padding: 10px 12px;
  font-size: 14px;
  border-radius: 10px;
  color: var(--border);
  text-align: left;
  width: 100%;
}
.nav-item:hover {
  background: rgba(255, 255, 255, 0.08);
}
.nav-item.active {
  background: var(--green);
  color: #fff;
  font-weight: 700;
}

.admin-staff {
  margin-top: auto;
  padding: 10px 12px;
  font-size: 13px;
  color: #8fa491;
}

.admin-content {
  flex: 1;
  padding: 24px 28px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  min-width: 0;
}

.admin-page-head {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.breadcrumb {
  font-size: 13px;
  color: var(--text-aux);
}
.admin-h1 {
  font-size: 24px;
  font-weight: 900;
}
.admin-h1 .attrs {
  font-size: 14px;
  color: var(--text-aux);
  font-weight: 700;
}

.admin-actions {
  margin-left: auto;
  display: flex;
  gap: 8px;
  align-items: center;
}

.select-plain {
  border: 1px solid var(--border);
  background: #fff;
  border-radius: 10px;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 700;
  outline: none;
  cursor: pointer;
}

.btn-csv {
  background: var(--green);
  color: #fff;
  border-radius: 10px;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 700;
}
.btn-csv:hover {
  background: var(--green-dark);
}

.admin-grid {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 18px;
}
@media (max-width: 900px) {
  .admin-grid {
    grid-template-columns: 1fr;
  }
  .admin-frame {
    flex-direction: column;
  }
  .admin-sidebar {
    width: 100%;
    flex-direction: row;
    flex-wrap: wrap;
    align-items: center;
  }
  .admin-staff {
    margin-top: 0;
    margin-left: auto;
  }
}

.panel {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px 20px;
}

.panel-title {
  font-size: 15px;
  font-weight: 900;
  margin-bottom: 12px;
}
.panel-title .sub {
  font-size: 12px;
  color: var(--text-aux);
  font-weight: 400;
}

.legend {
  display: flex;
  gap: 16px;
  margin-top: 8px;
  font-size: 12px;
  color: var(--text-sub);
  flex-wrap: wrap;
}
.legend span {
  display: flex;
  align-items: center;
  gap: 6px;
}
.legend .chip {
  width: 14px;
  height: 3px;
  border-radius: 2px;
}

/* 横棒グラフ */
.bar-rows {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.bar-row {
  display: grid;
  grid-template-columns: 110px 1fr 30px;
  gap: 10px;
  align-items: center;
}
.bar-label {
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.bar-track {
  background: var(--page);
  border-radius: 6px;
  height: 18px;
}
.bar-fill {
  height: 100%;
  border-radius: 6px;
  transition: width 0.4s ease;
}
.bar-count {
  font-size: 13px;
  font-weight: 900;
  text-align: right;
}

/* 日別テーブル */
.day-table {
  display: grid;
  grid-template-columns: 90px 70px 110px 1fr 1fr;
  font-size: 13px;
}
.day-table .th {
  padding: 8px 10px;
  font-weight: 700;
  color: var(--text-aux);
  border-bottom: 2px solid var(--border);
}
.day-table .td {
  padding: 10px;
  border-bottom: 1px solid var(--page);
}
.day-table .td.date {
  font-weight: 700;
}
.day-table .td.note {
  color: var(--text-sub);
}
.day-table .td.last {
  border-bottom: none;
}

.flag-mark {
  color: var(--alert);
  font-weight: 900;
}

/* 汎用テーブル(本日の記録一覧など) */
.gen-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.gen-table th {
  text-align: left;
  padding: 8px 10px;
  font-weight: 700;
  color: var(--text-aux);
  border-bottom: 2px solid var(--border);
}
.gen-table td {
  padding: 10px;
  border-bottom: 1px solid var(--page);
}

/* QR発行カード */
.qr-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 14px;
}
.qr-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  text-align: center;
}
.qr-card img {
  width: 120px;
  height: 120px;
}
.qr-card .qr-name {
  font-size: 15px;
  font-weight: 900;
}
.qr-card .qr-sub {
  font-size: 12px;
  color: var(--text-aux);
}

.empty-note {
  font-size: 13px;
  color: var(--text-aux);
  padding: 8px 0;
}

@media print {
  .admin-sidebar,
  .admin-page-head .admin-actions,
  .no-print {
    display: none !important;
  }
  .admin-wrap {
    padding: 0;

/** GAS iframe 外で動作しているか(=ホスティング/プレビュー) */
function isStandalone() {
  return !(window.google && google.script && google.script.run);
}

// ---------------------------------------------------------------- RPC

function rpc(name) {
  var args = [].slice.call(arguments, 1);
  // ホスティング版: GAS の /exec を JSON API として呼ぶ(iOSライブカメラ対応構成)
  if (window.GAS_API_URL) {
    return fetch(window.GAS_API_URL, {
      method: 'POST',
      // Content-Type を text/plain のままにして CORS プリフライトを回避する
      body: JSON.stringify({ fn: name, args: args, token: window.GAS_API_TOKEN || '' }),
    }).then(function (r) {
      if (!r.ok) throw new Error('通信エラー(' + r.status + ')');
      return r.json();
    }).then(function (res) {
      if (!res.ok) throw new Error(res.error || 'サーバーエラー');
      return res.data;
    });
  }
  if (window.google && google.script && google.script.run) {
    return new Promise(function (resolve, reject) {
      var runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (e) { reject(e); });
      runner[name].apply(runner, args);
    });
  }
  return Mock.call(name, args); // ローカルプレビュー用モック
}

function currentUser() {
  for (var i = 0; i < S.users.length; i++) if (S.users[i].id === S.currentUserId) return S.users[i];
  return null;
}
function exerciseById(id) {
  for (var i = 0; i < S.exercises.length; i++) if (S.exercises[i].id === id) return S.exercises[i];
  return null;
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function timeKey(t) { return ('00000' + t).slice(-5); }
function shortDate(date) {
  var p = date.split('-');
  return Number(p[1]) + '/' + Number(p[2]);
}
function dayLabel(date) {
  var d = new Date(date + 'T00:00:00');
  return (d.getMonth() + 1) + '/' + d.getDate() + '(' + WEEKDAYS[d.getDay()] + ')';
}
function monthLabel(m) {
  var p = m.split('-');
  return p[0] + '年' + Number(p[1]) + '月';
}
function nowClock() {
  var d = new Date();
  return {
    date: (d.getMonth() + 1) + '月' + d.getDate() + '日(' + WEEKDAYS[d.getDay()] + ')',
    time: d.getHours() + ':' + ('0' + d.getMinutes()).slice(-2),
  };
}

// バイタル閾値判定(サーバーと同一ロジック。ライブ表示用)
function evaluateVitalAlerts(draft, prev) {
  var alerts = [];
  var sys = Number(draft.systolic);
  if (draft.systolic !== '' && !isNaN(sys)) {
    if (sys >= 160) alerts.push('収縮期血圧が高値です(160以上)。運動可否を看護師に確認してください');
    else if (prev && sys - prev.systolic >= 20) alerts.push('収縮期血圧が前回より高めです。運動前に再測定を推奨');
  }
  var spo2 = Number(draft.spo2);
  if (draft.spo2 !== '' && !isNaN(spo2) && spo2 <= 92) alerts.push('SpO2が低めです(92%以下)。安静にして再測定してください');
  var temp = Number(draft.temp);
  if (draft.temp !== '' && !isNaN(temp) && temp >= 37.5) alerts.push('体温が高めです(37.5℃以上)。本日の運動可否を確認してください');
  return alerts;
}

var VITAL_LIMITS = {
  systolic: [60, 250], diastolic: [30, 150], pulse: [30, 220],
  temp: [30, 45], spo2: [50, 100], weight: [20, 250],
};
function vitalValidationErrors(draft) {
  var labels = { systolic: '収縮期血圧', diastolic: '拡張期血圧', pulse: '脈拍', temp: '体温', spo2: 'SpO2', weight: '体重' };
  var errors = [];
  Object.keys(VITAL_LIMITS).forEach(function (key) {
    if (draft[key] === '') return;
    var value = Number(draft[key]);
    var range = VITAL_LIMITS[key];
    if (!isFinite(value) || value < range[0] || value > range[1]) {
      errors.push(labels[key] + 'は' + range[0] + '〜' + range[1] + 'の範囲で入力してください');
    }
  });
  if (draft.systolic && draft.diastolic && Number(draft.diastolic) >= Number(draft.systolic)) {
    errors.push('下の血圧は上の血圧より小さい値にしてください');
  }
  return errors;
}

var Scanner = {
  stream: null, timer: null, video: null, lastValue: '', lastAt: 0, paused: false,
  onDetect: null, generation: 0, scanning: false,
  /**
   * 画面表示時の準備のみ(カメラは起動しない)。

   * 「停止」タップ・15秒無検出・画面遷移で停止する(バッテリー配慮)。
   */
  prepare: function (onDetect) {
    var self = this;
    self.onDetect = onDetect;
    self.bindCapture();
    var toggle = document.getElementById('scan-toggle-btn');
    if (toggle && toggle.getAttribute('data-bound') !== 'true') {
      toggle.setAttribute('data-bound', 'true');
      toggle.addEventListener('click', function () {
        if (self.stream || self.timer) self.stopToIdle();
        else self.start(self.onDetect);
      });
    }
  },
  /** ライブスキャンを止めて「開始」待ちの状態に戻す */
  stopToIdle: function (message) {
    this.stop();
    if (this.video && this.video.parentNode) this.video.parentNode.removeChild(this.video);
    this.video = null;
    var toggle = document.getElementById('scan-toggle-btn');
    if (toggle) toggle.textContent = '📷 スキャンを開始';
    var resume = document.getElementById('camera-resume-btn');
    if (resume) resume.remove();
    var hint = document.getElementById('camera-hint');
    if (hint) hint.textContent = message || '「スキャンを開始」を押してください';
  },
  start: function (onDetect) {
    var self = this;
    // 再入時は既存リソースを必ず解放する。iOSはカメラ同時1キャプチャ制約が
    // あるため、前回の stream が生きていると2回目以降の getUserMedia が
    // NotReadableError で恒久的に失敗する(「ボタンを押しても無反応」の主因)。
    if (self.timer) { clearInterval(self.timer); self.timer = null; }
    if (self.stream) { self.stream.getTracks().forEach(function (t) { t.stop(); }); self.stream = null; }
    if (self.video && self.video.parentNode) self.video.parentNode.removeChild(self.video);
    self.video = null; self.paused = false; self.scanning = false;
    var generation = ++self.generation;
    self.onDetect = onDetect;
    var view = document.getElementById('camera-view');
    self.bindCapture();
    // まずライブカメラを試行し、起動できた端末は連続読取。
    // GAS iframe で拒否される端末は撮影ボタンに自動フォールバックする。
    if (!view || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      self.fail(); return;
    }
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false,
    })
      .then(function (stream) {
        if (generation !== self.generation) {
          stream.getTracks().forEach(function (t) { t.stop(); });
          return null;
        }
        self.stream = stream;
        var video = document.createElement('video');
        video.muted = true;
        video.setAttribute('muted', ''); // WKWebViewはコンテンツ属性も参照する
        video.setAttribute('playsinline', '');
        video.setAttribute('webkit-playsinline', '');
        video.setAttribute('autoplay', '');
        video.srcObject = stream;
        view.insertBefore(video, view.firstChild);
        self.video = video;
        // autoplay拒否(iOS Chromeで起きうる)は致命エラーにせず、タップ再生に格下げ
        return video.play().catch(function (err) {
          if (generation !== self.generation) return;
          if (err && (err.name === 'NotAllowedError' || err.name === 'AbortError')) {
            var hintEl = document.getElementById('camera-hint');
            if (hintEl) hintEl.textContent = 'タップしてカメラを開始';
            var retryPlay = function () {
              video.play().then(function () {
                view.removeEventListener('click', retryPlay);
                var h = document.getElementById('camera-hint');
                if (h) h.textContent = 'QRコードを枠内にかざしてください';
              }).catch(function () {});
            };
            view.addEventListener('click', retryPlay);
            return; // 許可は取得済みなので後続のスキャン準備は継続
          }
          throw err;
        });
      })
      .then(function () {
        if (generation !== self.generation || !self.video) return;
        var hintEl = document.getElementById('camera-hint');
        if (hintEl) hintEl.textContent = 'QRコードを枠内にかざしてください';
        var toggle = document.getElementById('scan-toggle-btn');
        if (toggle) toggle.textContent = '⏹ スキャンを停止';
        self.liveSince = Date.now();
        var canvas = document.createElement('canvas');
        var detector = window.BarcodeDetector ? new BarcodeDetector({ formats: ['qr_code'] }) : null;
        self.timer = setInterval(function () {
          var v = self.video;
          if (!v || self.paused || self.scanning) return;
          if (v.readyState < 2) {
            // 1フレームも来ないまま15秒経過 = 起動失敗(「読取なし」とは区別して案内)
            if (Date.now() - self.liveSince > 15000) {
              self.suspend('カメラ映像を取得できませんでした。タップして再試行してください');
            }
            return;
          }
          // 15秒間なにも読み取れなければ省電力のため自動停止(タップで再開)
          if (Date.now() - Math.max(self.lastAt || 0, self.liveSince) > 15000) {
            self.suspend();
            return;
          }
          self.scanning = true;
          var handle = function (value) {
            var now = Date.now();
            if (value === self.lastValue && now - self.lastAt < 2000) return;
            self.lastValue = value; self.lastAt = now;
            self.flash();
            onDetect(value);
          };
          var decodeWithJsQr = function () {
            var w = v.videoWidth, h = v.videoHeight;
            if (!w || !h || typeof jsQR !== 'function') return;
            canvas.width = w; canvas.height = h;
            var ctx = canvas.getContext('2d', { willReadFrequently: true });
            if (!ctx) return;
            ctx.drawImage(v, 0, 0, w, h);
            var code = jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'attemptBoth' });
            if (code && code.data) handle(code.data);
          };
          if (detector) {
            detector.detect(v).then(function (codes) {
              if (codes.length) handle(codes[0].rawValue);
              else decodeWithJsQr();
            }).catch(function () {
              detector = null;
              decodeWithJsQr();
            }).then(function () { self.scanning = false; });
            return;
          }
          try { decodeWithJsQr(); } finally { self.scanning = false; }
        }, 350);
      })
      .catch(function (err) {
        if (generation !== self.generation) return;
        // 原因を画面に表示する(これまでは握りつぶしていて切り分け不能だった)
        var name = (err && err.name) || 'UnknownError';
        var guide = {
          NotAllowedError: 'カメラが許可されていません。iPhoneの「設定 → Chrome(またはSafari)→ カメラ」を許可にして、ページを再読み込みしてください',
          NotReadableError: 'カメラが他のアプリ・タブで使用中です。他のカメラ利用を閉じてから「ライブカメラを起動」を押してください',
          NotFoundError: 'この端末で利用できるカメラが見つかりません',
          OverconstrainedError: '背面カメラを起動できません。もう一度お試しください',
          SecurityError: 'この画面ではライブカメラを使えません。公開URL(ginshoen.github.io)から開いてください',
        }[name] || 'カメラを起動できませんでした';
        var hint = document.getElementById('camera-hint');
        if (hint) hint.textContent = guide + '(' + name + ')';
        self.fail(true);
      });
  },
  /**
   * ライブカメラ不可時のフォールバック。
   * GAS のウェブアプリは sandbox 付き iframe で配信されるため getUserMedia が
   * ブロックされる(Safari/Chrome共通)。その場で「撮影→写真をjsQRで解読」する
   * file capture 方式は iframe 内でも動作する。
   */
  fail: function (keepHint) {
    var hint = document.getElementById('camera-hint');
    if (hint && !keepHint) hint.textContent = 'ライブカメラを使えません。「写真から読み取る」をご利用ください';
    var toggle = document.getElementById('scan-toggle-btn');
    if (toggle) toggle.textContent = '📷 スキャンを開始';
    this.bindCapture();
  },
  /** 15秒無検出での自動停止(バッテリー配慮)。「開始」待ちに戻す */
  suspend: function (message) {
    this.stopToIdle(message || '読み取りがないため自動停止しました。「スキャンを開始」で再開できます');
  },
  bindCapture: function () {
    var self = this;
    var input = document.getElementById('capture-input');
    var button = document.getElementById('capture-btn');
    var hint = document.getElementById('camera-hint');
    if (!input || !button || input.getAttribute('data-bound') === 'true') return;
    input.setAttribute('data-bound', 'true');
    button.addEventListener('click', function () { input.click(); });
    input.addEventListener('change', function () {
      var file = input.files && input.files[0];
      input.value = '';
      if (!file || !self.onDetect) return;
      if (hint) hint.textContent = '読み取り中…';
      decodeQrFromFile(file).then(function (value) {
        if (value) {
          self.flash();
          self.onDetect(value);
        } else if (hint) {
          hint.textContent = 'QRを読み取れませんでした。枠いっぱいに写るよう撮り直してください';
        }
      });
    });
  },
  /**
   * 読取成功の瞬間に映像を静止し、「✓ 読み取りました」を表示する。
   * 成功時は画面遷移で自動的に解除、エラー時は resume() で再開する。
   */
  flash: function () {
    if (this.video) { try { this.video.pause(); } catch (e) {} }
    this.paused = true;
    var view = document.getElementById('camera-view');
    if (view && !view.querySelector('.detected-badge')) {
      view.classList.add('detected');
      var badge = document.createElement('div');
      badge.className = 'detected-badge';
      badge.textContent = '✓ 読み取りました';
      view.appendChild(badge);
    }
    if (navigator.vibrate) navigator.vibrate(80);
  },
  resume: function () {
    var view = document.getElementById('camera-view');
    if (view) {
      view.classList.remove('detected');
      var badge = view.querySelector('.detected-badge');
      if (badge) badge.remove();
    }
    this.paused = false;
    if (this.video) { try { this.video.play(); } catch (e) {} }
  },
  stop: function () {
    this.generation += 1;
    if (this.timer) clearInterval(this.timer);
    if (this.stream) this.stream.getTracks().forEach(function (t) { t.stop(); });
    this.timer = null; this.stream = null; this.video = null; this.paused = false; this.scanning = false;
  },
};

/** 撮影した写真からQRを解読(複数スケールで試行) */
function decodeQrFromFile(file) {
  return new Promise(function (resolve) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var scales = [1000, 1600, 640];
      var result = null;
      for (var i = 0; i < scales.length && !result; i++) {
        var max = scales[i];
        var ratio = Math.min(1, max / Math.max(img.width, img.height));
        var w = Math.round(img.width * ratio);
        var h = Math.round(img.height * ratio);
        var canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        var ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0, w, h);
        try {
          var code = typeof jsQR === 'function' && jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'attemptBoth' });
          if (code && code.data) result = code.data;
        } catch (e) {}
      }
      URL.revokeObjectURL(url);
      resolve(result);
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      resolve(null);
    };
    img.src = url;
  });
}

// ---------------------------------------------------------------- ルーター

function go(hash) { location.hash = hash; }

window.addEventListener('hashchange', render);

function render() {
  Scanner.stop();
  if (S.toastTimer) { clearTimeout(S.toastTimer); S.toastTimer = null; }
  if (S.pollTimer) { clearInterval(S.pollTimer); S.pollTimer = null; }
  if (!S.ready) return;
  var h = location.hash.replace(/^#\/?/, '');
  var app = document.getElementById('app');
  if (h === 'users') return renderUserList(app);
  if (h.indexOf('users/') === 0) return renderUserDetail(app, h.slice(6));
  if (h === 'vitals') return renderVitals(app);
  if (h === 'exercise') return renderExerciseScan(app);
  if (h.indexOf('exercise/') === 0) return renderExerciseForm(app, h.slice(9));
  if (h === 'admin') return renderAdminResults(app);
  if (h === 'admin/users') return renderAdminUsers(app);
  if (h === 'admin/today') return renderAdminToday(app);
  if (h === 'admin/master') return renderAdminMaster(app);
  if (h === 'admin/monthly') return renderAdminMonthly(app);
  return renderCheckin(app);
}

function renderCheckin(app) {

  var scheduled = S.users.filter(function (u) { return String(u.scheduleLabel || '').indexOf(todayWeekday) >= 0; });
  var pending = scheduled.filter(function (u) { return !checkedIds[u.id]; });

  var toastHtml = '';
  if (S.toast && (S.toast.type === 'success' || S.toast.type === 'info')) {
    toastHtml =
      '<button class="toast-success' + (S.toast.type === 'info' ? ' toast-info' : '') + '"' +
      ' onclick="Actions.goVitals(\'' + S.toast.userId + '\')">' +
      '<span class="check-circle">' + (S.toast.type === 'info' ? 'ℹ' : '✓') + '</span><span>' +

  } else if (S.toast && S.toast.type === 'error') {
    toastHtml =
      '<div class="toast-error" role="alert"><span class="x-circle">✕</span><span>' +
      '<span class="t-title" style="display:block;">' + esc(S.toast.title) + '</span>' +
      '<span class="t-sub">' + esc(S.toast.sub) + '</span></span></div>';
  }

  var rows = S.todayCheckins.map(function (c) {
    var u = null;
    S.users.forEach(function (x) { if (x.id === c.userId) u = x; });
    if (!u) return '';
    return (
      '<div class="person-row"><span class="status-dot"></span>' +
      '<span class="person-name">' + esc(u.name) + '</span>' +
      '<span class="person-care">' + esc(u.careLevel) + '</span>' +
      '<span class="person-time">' + esc(c.time) + '</span></div>'

  }).join('') + pending.map(function (u) {
    return (
      '<div class="person-row pending"><span class="status-dot"></span>' +
      '<span class="person-name">' + esc(u.name) + '</span>' +
      '<span class="person-care">' + esc(u.careLevel) + '</span>' +
      '<span class="person-time">未着</span></div>'
    );
  }).join('');

  app.innerHTML =
    '<div class="phone-wrap"><div class="phone">' +
    '<header class="phone-header">' +
    '<img class="logo" src="' + LOGO + '" alt="銀松苑ロゴ">' +
    '<div><div class="h-sub">デイサービス銀松苑</div><div class="h-title">来所受付</div></div>' +
    '<div class="h-right"><div class="h-sub" id="clock-date">' + clock.date + '</div>' +
    '<div style="font-size:16px;font-weight:700;" id="clock-time">' + clock.time + '</div></div>' +
    '</header>' +
    '<div class="phone-body">' +
    '<nav class="workflow-steps" aria-label="記録の進み具合"><div class="workflow-step current" aria-current="step"><span class="workflow-number">1</span><span>受付</span></div><div class="workflow-step upcoming"><span class="workflow-number">2</span><span>バイタル</span></div><div class="workflow-step upcoming"><span class="workflow-number">3</span><span>機能訓練</span></div></nav>' +
    '<div class="screen-intro"><span class="eyebrow">STEP 1</span><h1>利用者カードを読み取る</h1><p>緑の枠にQRコードを合わせてください。</p></div>' +
    cameraHtml('利用者のQRカードをかざしてください') +
    toastHtml +
    '<div><div class="section-head"><span class="section-title">本日の来所状況</span>' +
    '<span class="section-note">' + S.todayCheckins.length + '名 / 予定' + scheduled.length + '名</span></div>' +
    '<div class="row-list">' + rows + '</div></div>' +
    '<button class="btn-outline" style="flex:none;width:100%;" onclick="go(\'users\')">👥 利用者の状況を確認(一覧)</button>' +
    '<button class="link-plain" onclick="Actions.openPicker()">QRを読み取れない場合は名前から選択 ›</button>' +
    (isStandalone() && !window.GAS_API_URL
      ? '<div class="toast-error" role="alert"><span class="x-circle">!</span><span>' +
        '<span class="t-title" style="display:block;">デモモードで動作中(記録は保存されません)</span>' +
        '<span class="t-sub">GASと接続するには下の「接続設定」からURLを貼り付けてください</span></span></div>'
      : '') +
    (isStandalone()
      ? '<button class="link-plain" onclick="Actions.openSettings()">⚙ 接続設定</button>'
      : '') +
    '</div></div></div>' +

  Scanner.prepare(function (value) {

    if (!user) {

      render();

    Actions.checkin(user.id);

}

function progressHtml(planned, records, pickable) {
  var doneCount = 0;
  var latest = {};
  records.forEach(function (r) { latest[r.exerciseId] = r; });
  planned.forEach(function (ex) { if (latest[ex.id]) doneCount++; });

  var rows = planned.map(function (ex) {
    var rec = latest[ex.id];
    if (rec) {
      return (
        '<div class="exercise-row"><span class="check">✓</span>' +
        '<span class="ex-name">' + esc(ex.name) + '</span>' +
        '<span class="ex-summary">' + esc(rec.time) + ' · ' + esc(rec.amount) + '</span></div>'
      );
    }
    var tag = pickable ? 'button' : 'div';
    var attr = pickable ? ' style="width:100%;text-align:left;" onclick="Actions.pickExercise(\'' + ex.id + '\')"' : '';
    return (
      '<' + tag + ' class="exercise-row undone"' + attr + '><span class="check">○</span>' +
      '<span class="ex-name">' + esc(ex.name) + '</span>' +
      '<span class="ex-summary">未実施</span></' + tag + '>'
    );
  }).join('');

  return (
    '<div><div class="section-head" style="margin-bottom:8px;"><span class="section-title">' +
    '本日の実施状況(' + planned.length + '種目中' + doneCount + '種目完了)</span></div>' +
    '<div class="row-list">' + rows + '</div></div>'
  );
}

/** ふりがなから五十音の行(あ/か/さ…)を判定 */
function kanaGyo(kana) {
  var c = (kana || '').replace(/\s/g, '').charAt(0);
  if (!c) return 'その他'; // indexOf('')は0を返すため空文字を先に弾く
  var rows = [
    ['あ', 'あいうえおぁぃぅぇぉ'], ['か', 'かきくけこがぎぐげご'],
    ['さ', 'さしすせそざじずぜぞ'], ['た', 'たちつてとだぢづでどっ'],
    ['な', 'なにぬねの'], ['は', 'はひふへほばびぶべぼぱぴぷぺぽ'],
    ['ま', 'まみむめも'], ['や', 'やゆよゃゅょ'], ['ら', 'らりるれろ'],
    ['わ', 'わをん'],
  ];
  for (var i = 0; i < rows.length; i++) {
    if (rows[i][1].indexOf(c) >= 0) return rows[i][0];
  }
  return 'その他';
}

/** 一覧行のHTML(状態: checked=来所済 / pending=本日予定・未着 / offday=予定なし) */
function userRowHtml(u, state, time, hasAlert) {
  var cls = 'person-row tappable' + (state === 'pending' ? ' pending' : state === 'offday' ? ' offday' : '');
  var right = state === 'checked' ? esc(time) : state === 'pending' ? '未着' : esc(u.scheduleLabel);
  return (
    '<button class="' + cls + '" data-name="' + esc((u.name + (u.kana || '')).replace(/\s/g, '')) + '"' +
    ' onclick="go(\'users/' + u.id + '\')">' +
    '<span class="status-dot"></span>' +
    '<span class="person-main"><span class="person-name">' + esc(u.name) + '</span>' +
    '<span class="person-care">' + esc(u.careLevel) + ' · ' + u.age + '歳</span></span>' +
    (hasAlert ? '<span class="badge-alert" title="本日アラートあり">⚑</span>' : '') +
    '<span class="person-time">' + right + '</span>' +
    '<span class="chev" aria-hidden="true">›</span></button>'
  );
}

function vitalsChartSvg(recordsAll) {
  var recent = recordsAll.slice(-8);
  var n = recent.length;
  function x(i) { return n <= 1 ? 270 : 60 + (i * 420) / (n - 1); }
  function y(v) {
    var c = Math.max(55, Math.min(145, v));
    return 150 - ((c - 60) * 90) / 80;
  }
  function pts(pick) {
    return recent.map(function (r, i) { return x(i) + ',' + y(pick(r)); }).join(' ');
  }
  var body = '';
  if (n > 0) {
    body =
      '<polyline points="' + pts(function (r) { return r.systolic; }) + '" fill="none" stroke="#2E7D32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></polyline>' +
      '<polyline points="' + pts(function (r) { return r.diastolic; }) + '" fill="none" stroke="#5B5EA6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></polyline>' +
      '<polyline points="' + pts(function (r) { return r.pulse; }) + '" fill="none" stroke="#D5688E" stroke-width="3" stroke-dasharray="1 7" stroke-linecap="round"></polyline>' +
      '<text x="' + x(0) + '" y="170" font-size="11" fill="#7A8A7D">' + shortDate(recent[0].date) + '</text>' +
      (n > 2 ? '<text x="' + x(Math.floor((n - 1) / 2)) + '" y="170" font-size="11" fill="#7A8A7D">' + shortDate(recent[Math.floor((n - 1) / 2)].date) + '</text>' : '') +
      (n > 1 ? '<text x="' + x(n - 1) + '" y="170" font-size="11" fill="#7A8A7D" text-anchor="end">' + shortDate(recent[n - 1].date) + '</text>' : '');
  } else {
    body = '<text x="270" y="90" font-size="13" fill="#7A8A7D" text-anchor="middle">記録がありません</text>';
  }
  return (
    '<svg viewBox="0 0 520 180" style="width:100%;height:auto;">' +
    '<line x1="40" y1="20" x2="40" y2="150" stroke="#DCE5DB" stroke-width="1"></line>' +
    '<line x1="40" y1="150" x2="510" y2="150" stroke="#DCE5DB" stroke-width="1"></line>' +

function barColor(ratio) {
  if (ratio >= 0.85) return '#2E7D32';
  if (ratio >= 0.6) return '#5B9E58';
  if (ratio >= 0.4) return '#9CC29A';
  return '#C4DAC2';
}

var lastResults = null; // CSV出力用キャッシュ

function renderAdminResults(app) {
  if (!S.admin.userId) S.admin.userId = S.users.length ? S.users[0].id : '';
  if (!S.admin.month) S.admin.month = S.today.slice(0, 7);
  app.innerHTML = adminShell('admin', loadingHtml());

  rpc('apiGetUserResults', S.admin.userId, S.admin.month).then(function (res) {
    lastResults = res;
    var user = null;
    S.users.forEach(function (u) { if (u.id === S.admin.userId) user = u; });
    var months = res.months.length ? res.months : [S.admin.month];

    // 種目別実施回数
    var counts = {};
    res.monthExercises.forEach(function (e) { counts[e.exerciseId] = (counts[e.exerciseId] || 0) + 1; });
    var countRows = S.exercises
      .map(function (ex) { return { ex: ex, count: counts[ex.id] || 0 }; })
      .filter(function (x) { return x.count > 0; })
      .sort(function (a, b) { return b.count - a.count; });
    var maxCount = 1;
    countRows.forEach(function (x) { if (x.count > maxCount) maxCount = x.count; });

    var barsHtml = countRows.length
      ? countRows.map(function (x) {
          return (
            '<div class="bar-row"><span class="bar-label">' + esc(x.ex.name) + '</span>' +
            '<div class="bar-track"><div class="bar-fill" style="width:' + (x.count / maxCount) * 100 + '%;background:' + barColor(x.count / maxCount) + ';"></div></div>' +
            '<span class="bar-count">' + x.count + '</span></div>'
          );
        }).join('')
      : '<div class="empty-note">この月の実施記録はありません</div>';

    // 日別実施記録(日付降順)
    var days = buildDays(res);
    var tableRows = days.map(function (d, i) {
      var last = i === days.length - 1 ? ' last' : '';
      var vitalTxt = d.vital
        ? d.vital.systolic + '/' + d.vital.diastolic + ' · P' + d.vital.pulse + ' · ' + d.vital.temp.toFixed(1) + '℃'
        : '—';
      var flag = d.vital && d.vital.flagged
        ? ' <span class="flag-mark" title="' + esc(d.vital.alerts.join(' / ')) + '">⚑</span>' : '';
      return (
        '<div class="td date' + last + '">' + dayLabel(d.date) + '</div>' +
        '<div class="td' + last + '">' + (d.checkin ? esc(d.checkin.time) : '') + '</div>' +
        '<div class="td' + last + '">' + vitalTxt + flag + '</div>' +
        '<div class="td' + last + '">' + (d.exercises.map(exerciseLabel).join(' → ') || '—') + '</div>' +
        '<div class="td note' + last + '">' + esc(d.note) + '</div>'
      );
    }).join('');

    var userSel = S.users.map(function (u) {
      return '<option value="' + u.id + '"' + (u.id === S.admin.userId ? ' selected' : '') + '>' + esc(u.name) + '</option>';
    }).join('');
    var monthSel = months.map(function (m) {
      return '<option value="' + m + '"' + (m === S.admin.month ? ' selected' : '') + '>' + monthLabel(m) + '</option>';
    }).join('');

    var content =
      '<div class="admin-page-head"><div><div class="breadcrumb">利用者別 実績</div>' +
      '<div class="admin-h1">' +
      (user
        ? esc(user.name) + ' さま <span class="attrs">' + user.age + '歳 · ' + esc(user.careLevel) + ' · ' + esc(user.scheduleLabel) + ' 利用</span>'
        : '利用者がいません') +
      '</div></div>' +
      '<div class="admin-actions">' +
      '<select class="select-plain" onchange="Actions.adminUser(this.value)" aria-label="利用者選択">' + userSel + '</select>' +
      '<select class="select-plain" onchange="Actions.adminMonth(this.value)" aria-label="対象月選択">' + monthSel + '</select>' +
      '<button class="btn-csv" onclick="Actions.exportCsv()">CSV出力</button>' +
      '</div></div>' +
      '<div class="admin-grid">' +
      '<div class="panel"><div class="panel-title">血圧・脈拍の推移 <span class="sub">直近8回</span></div>' +
      vitalsChartSvg(res.vitalsAll) + '</div>' +
      '<div class="panel"><div class="panel-title">種目別 実施回数 <span class="sub">' + monthLabel(S.admin.month) + '</span></div>' +
      '<div class="bar-rows">' + barsHtml + '</div></div></div>' +
      '<div class="panel"><div class="panel-title">日別 実施記録</div>' +
      '<div class="day-table">' +
      '<div class="th">日付</div><div class="th">来所</div><div class="th">バイタル</div><div class="th">実施種目</div><div class="th">所見</div>' +
      tableRows + '</div>' +
      (days.length === 0 ? '<div class="empty-note">この月の来所記録はありません</div>' : '') +
      '</div>';

    app.innerHTML = adminShell('admin', content);
  });
}

function buildDays(res) {
  var dateSet = {};
  res.monthCheckins.forEach(function (c) { dateSet[c.date] = true; });
  var dates = Object.keys(dateSet).sort().reverse();
  return dates.map(function (date) {
    var checkin = null;
    res.monthCheckins.forEach(function (c) { if (c.date === date && !checkin) checkin = c; });
    var vital = null;
    res.monthVitals.forEach(function (v) { if (v.date === date) vital = v; });
    var exercises = res.monthExercises
      .filter(function (e) { return e.date === date; })
      .sort(function (a, b) { return timeKey(a.time) < timeKey(b.time) ? -1 : 1; });
    var note = exercises.map(function (e) { return e.note; }).filter(String).join(' ');
    return { date: date, checkin: checkin, vital: vital, exercises: exercises, note: note };
  });
}

  // --- バイタル ---
  vInput: function (key, value) {
    var clean = value.replace(/[^0-9.]/g, '');
    var dot = clean.indexOf('.');
    S.vDraft[key] = dot < 0 ? clean : clean.slice(0, dot + 1) + clean.slice(dot + 1).replace(/\./g, '');
    S.vitalConfirmed = false;
    Actions.vRefresh();
  },
  vRefresh: function () {
    var alerts = evaluateVitalAlerts(S.vDraft, S.prevVital);
    var errors = vitalValidationErrors(S.vDraft);
    var box = document.getElementById('v-alerts');
    if (box) {
      var errorHtml = errors.map(function (msg) {
        return '<div class="toast-error" role="alert"><span class="x-circle">!</span><span class="t-sub">' + esc(msg) + '</span></div>';
      }).join('');
      var alertHtml = alerts.map(function (msg) {
        return '<div class="alert-banner" role="alert"><span class="alert-dot"></span><span class="alert-text">' + esc(msg) + '</span></div>';
      }).join('');
      var confirmHtml = alerts.length
        ? '<label class="safety-confirm"><input type="checkbox" ' + (S.vitalConfirmed ? 'checked' : '') + ' onchange="Actions.vConfirm(this.checked)">' +
          '<span><strong>職員による確認済み</strong><small>運動を開始できる状態か確認しました</small></span></label>'
        : '';
      box.innerHTML = errorHtml + alertHtml + confirmHtml;
      box.style.display = (alerts.length || errors.length) ? 'flex' : 'none';
      box.style.flexDirection = 'column';
      box.style.gap = '12px';
    }
    // 必須は血圧・脈拍・体温のみ(SpO2・体重は任意)
    var requiredLabels = { systolic: '血圧(上)', diastolic: '血圧(下)', pulse: '脈拍', temp: '体温' };
    var missing = Object.keys(requiredLabels).filter(function (k) { return S.vDraft[k] === ''; });
    var hint = document.getElementById('v-hint');
    if (hint) {
      hint.textContent = missing.length
        ? 'あと入力: ' + missing.map(function (k) { return requiredLabels[k]; }).join('・')
        : (alerts.length && !S.vitalConfirmed ? '「職員による確認済み」にチェックすると保存できます' : '');
    }
    var btn = document.getElementById('v-save');
    if (btn) btn.disabled = missing.length > 0 || errors.length > 0 || (alerts.length > 0 && !S.vitalConfirmed);

  vConfirm: function (checked) {
    S.vitalConfirmed = checked;
    Actions.vRefresh();

  vReset: function () {
    S.vDraft = { systolic: '', diastolic: '', pulse: '', temp: '', spo2: '', weight: '' };
    S.vitalConfirmed = false;
    render();
  },
  vSave: function () {
    var alerts = evaluateVitalAlerts(S.vDraft, S.prevVital);
    if (vitalValidationErrors(S.vDraft).length || (alerts.length && !S.vitalConfirmed)) return;
    var btn = document.getElementById('v-save');
    if (btn) { btn.disabled = true; btn.textContent = '保存中…'; }
    var payload = { userId: S.currentUserId };
    ['systolic', 'diastolic', 'pulse', 'temp', 'spo2', 'weight'].forEach(function (k) {
      payload[k] = S.vDraft[k];
    });
    rpc('apiSaveVitals', payload).then(function (rec) {
      S.vDraft = null;
      S.vitalConfirmed = false;
      S.lastSaved = { kind: 'vitals', id: rec.id, label: 'バイタルを記録しました' };
      go('exercise');

      showSaveError('保存できませんでした。電波状況をご確認のうえ、もう一度お試しください');

    });

    var q = S.userQuery || '';
    var mode = S.userFilterMode || 'all';
    var visible = 0;
    document.querySelectorAll('.person-row.tappable[data-state]').forEach(function (el) {
      var name = el.getAttribute('data-name') || '';
      var state = el.getAttribute('data-state');
      var hasAlert = el.getAttribute('data-alert') === '1';
      var show = (!q || name.indexOf(q) >= 0) &&
        (mode === 'all' || (mode === 'today' && state === 'checked') || (mode === 'alert' && hasAlert));

      if (show) visible++;
    });

    render();

  adminSaveUser: function () {
    var err = document.getElementById('form-error');
    var wds = [];
    document.querySelectorAll('input[name="wd"]:checked').forEach(function (el) { wds.push(el.value); });
    var plan = [];
    document.querySelectorAll('input[name="plan"]:checked').forEach(function (el) { plan.push(el.value); });
    var payload = {
      id: S.editingUser.id,
      name: document.getElementById('f-name').value.trim(),
      kana: document.getElementById('f-kana').value.trim(),
      age: document.getElementById('f-age').value.trim(),

    var btn = document.getElementById('f-save');

    if (btn.getAttribute('data-confirm') !== '1') {

      ' value="' + esc(window.GAS_API_URL) + '" style="min-height:44px;">' +
      '<input class="note-area" id="set-token" placeholder="共有トークン(API_TOKEN未設定なら空のまま)"' +
      ' value="' + esc(window.GAS_API_TOKEN) + '" style="min-height:44px;">' +
      '<div id="set-error" class="section-note" style="color:var(--alert-text);"></div>' +
      '<button class="btn-primary" style="flex:none;width:100%;" onclick="Actions.saveSettings()">接続を確認して保存</button>' +
      '<button class="link-plain" onclick="Actions.closePicker()">閉じる</button>' +
      '</div></div>';
  },
  saveSettings: function () {
    var url = document.getElementById('set-url').value.trim();
    var token = document.getElementById('set-token').value.trim();
    var errBox = document.getElementById('set-error');
    if (url === '') {
      localStorage.removeItem('gasApiUrl');
      localStorage.removeItem('gasApiToken');
      location.reload();
      return;
    }
    if (url.indexOf('https://script.google.com/') !== 0 || url.indexOf('/exec') < 0) {
      errBox.textContent = 'URLの形式が違います。「https://script.google.com/macros/s/…/exec」を貼り付けてください';
      return;
    }
    errBox.textContent = '接続を確認しています…';
    fetch(url, { method: 'POST', body: JSON.stringify({ fn: 'apiRefreshToday', args: [], token: token }) })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.error || '');
        localStorage.setItem('gasApiUrl', url);
        localStorage.setItem('gasApiToken', token);
        location.reload();
      })
      .catch(function (e) {
        errBox.textContent = '接続できませんでした: ' + (e && e.message ? e.message : e) +
          ' — GASのデプロイが「全員」公開になっているか、URLが正しいかご確認ください';
      });
  },

  // --- 管理 ---
  adminUser: function (id) { S.admin.userId = id; render(); },
  adminMonth: function (m) { S.admin.month = m; render(); },
  monthlyMonth: function (m) { S.admin.month = m; render(); },
  exportCsv: function () {
    if (!lastResults) return;
    var user = null;
    S.users.forEach(function (u) { if (u.id === S.admin.userId) user = u; });
    var days = buildDays(lastResults).slice().reverse();
    var header = ['日付', '来所時刻', '収縮期血圧', '拡張期血圧', '脈拍', '体温', 'SpO2', '体重', 'アラート', '実施種目', '所見'];
    var rows = days.map(function (d) {
      return [
        d.date,
        d.checkin ? d.checkin.time : '',
        d.vital ? d.vital.systolic : '', d.vital ? d.vital.diastolic : '',
        d.vital ? d.vital.pulse : '', d.vital ? d.vital.temp : '',
        d.vital && d.vital.spo2 != null ? d.vital.spo2 : '',
        d.vital && d.vital.weight != null ? d.vital.weight : '',
        d.vital ? d.vital.alerts.join(' / ') : '',
        d.exercises.map(function (e) { return exerciseLabel(e) + '(' + e.load + ')'; }).join(' → '),
        d.note,
      ];
    });
    var csv = [header].concat(rows).map(function (r) {
      return r.map(function (c) {
        var value = String(c);
        if (/^[=+\-@]/.test(value)) value = "'" + value;
        return '"' + value.replace(/"/g, '""') + '"';
      }).join(',');
    }).join('\r\n');
    var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '実績_' + (user ? user.name.replace(/\s/g, '') : '') + '_' + S.admin.month + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  },
};

      db.checkins.push({ id: nid(), date: date, time: h[6], userId: 'u01' });
      db.vitals.push({ id: nid(), date: date, time: h[6], userId: 'u01', systolic: h[0], diastolic: h[1], pulse: h[2], temp: h[3], spo2: h[4], weight: h[5], flagged: false, alerts: [] });
      var hour = 9, min = 40;
      h[7].forEach(function (m) {
        db.records.push({ id: nid(), date: date, time: hour + ':' + ('0' + min).slice(-2), userId: 'u01', exerciseId: m[0], amount: m[1], load: 'ふつう', note: m[2] });
        min += 25;
        if (min >= 60) { min -= 60; hour += 1; }
      });
    });
    return db;
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    var db = seed();
    localStorage.setItem(KEY, JSON.stringify(db));
    return db;
  }
  function save(db) { localStorage.setItem(KEY, JSON.stringify(db)); }

  var fns = {
    apiGetBootstrap: function () {
      var db = load();
      return { users: db.users, exercises: db.exercises, today: todayStr(), staff: 'プレビュー', todayCheckins: fns.apiGetTodayCheckins() };
    },
    apiGetTodayCheckins: function () {
      var db = load();
      var t = todayStr();
      return db.checkins.filter(function (c) { return c.date === t; })
        .sort(function (a, b) { return timeKey(b.time) < timeKey(a.time) ? -1 : 1; });
    },
    apiCheckin: function (userId) {
      var db = load();
      var t = todayStr();
      var ex = db.checkins.filter(function (c) { return c.date === t && c.userId === userId; });
      if (ex.length) return { record: ex[0], already: true, todayCheckins: fns.apiGetTodayCheckins() };
      db.seq += 1;
      var rec = { id: 'm' + db.seq, date: t, time: nowTime(), userId: userId };
      db.checkins.push(rec);
      save(db);
      return { record: rec, already: false, todayCheckins: fns.apiGetTodayCheckins() };
    },
    apiGetVitalContext: function (userId) {
      var db = load();
      var t = todayStr();
      var list = db.vitals.filter(function (v) { return v.userId === userId && v.date < t; })
        .sort(function (a, b) { return (a.date + timeKey(a.time)) < (b.date + timeKey(b.time)) ? -1 : 1; });
      return { prev: list.length ? list[list.length - 1] : null };
    },
    apiSaveVitals: function (p) {
      var db = load();
      var prev = fns.apiGetVitalContext(p.userId).prev;
      var alerts = evaluateVitalAlerts(p, prev);
      db.seq += 1;
      var rec = {
        id: 'm' + db.seq, date: todayStr(), time: nowTime(), userId: p.userId,
        systolic: Number(p.systolic) || 0, diastolic: Number(p.diastolic) || 0, pulse: Number(p.pulse) || 0,
        temp: Number(p.temp) || 0,
        spo2: String(p.spo2) === '' ? null : Number(p.spo2),
        weight: String(p.weight) === '' ? null : Number(p.weight),
        flagged: alerts.length > 0, alerts: alerts,
      };
      db.vitals.push(rec);
      save(db);
      return rec;
    },
    apiVoidRecord: function (kind, id) {
      var db = load();
      var list = db[kind === 'records' ? 'records' : kind === 'vitals' ? 'vitals' : 'checkins'];
      var idx = -1;
      list.forEach(function (r, i) { if (r.id === id) idx = i; });
      if (idx >= 0) list.splice(idx, 1);
      save(db);
      return { ok: true };
    },
    apiRefreshToday: function () {
      return { today: todayStr(), todayCheckins: fns.apiGetTodayCheckins() };
    },
    apiVerifyAdmin: function () {
      return { ok: true, pinConfigured: false };
    },
    apiAdminSaveUser: function (pin, u) {
      var db = load();
      var plan = String(u.plan || '').split(',').filter(String);
      if (u.id) {
        db.users.forEach(function (x) {
          if (x.id === u.id) {
            x.name = u.name; x.kana = u.kana; x.age = Number(u.age);
            x.careLevel = u.careLevel; x.scheduleLabel = u.scheduleLabel; x.plan = plan;
          }
        });
      } else {
        var id = 'u' + Date.now().toString(36);
        db.users.push({ id: id, name: u.name, kana: u.kana, age: Number(u.age), careLevel: u.careLevel, scheduleLabel: u.scheduleLabel, plan: plan, qrCode: 'GSU:' + id });
      }
      save(db);
      return { users: db.users };
    },
    apiAdminDeleteUser: function (pin, id) {
      var db = load();
      db.users = db.users.filter(function (x) { return x.id !== id; });
      save(db);
      return { users: db.users };
    },
    apiGetTodayAlerts: function () {
      var db = load();
      var t = todayStr();
      var map = {};
      db.vitals.forEach(function (v) { if (v.date === t && v.flagged) map[v.userId] = true; });
      return map;
    },
    apiGetUserDetail: function (userId) {
      var db = load();
      var t = todayStr();
      var checkins = db.checkins.filter(function (c) { return c.userId === userId; });
      var vitals = db.vitals.filter(function (v) { return v.userId === userId; })
        .sort(function (a, b) { return (a.date + timeKey(a.time)) < (b.date + timeKey(b.time)) ? -1 : 1; });
      var records = db.records.filter(function (e) { return e.userId === userId; });
      var todayCheckin = null;
      checkins.forEach(function (c) { if (c.date === t && !todayCheckin) todayCheckin = c; });
      var todayVitals = vitals.filter(function (v) { return v.date === t; });
      var dates = {};
      checkins.forEach(function (c) { dates[c.date] = c.time; });
      var recentDays = Object.keys(dates).sort().reverse().slice(0, 5).map(function (date) {
        var dayEx = records.filter(function (e) { return e.date === date; })
          .sort(function (a, b) { return timeKey(a.time) < timeKey(b.time) ? -1 : 1; });
        return {
          date: date, time: dates[date], exercises: dayEx,
          note: dayEx.map(function (e) { return e.note; }).filter(String).join(' '),
        };
      });
      return {
        todayCheckin: todayCheckin,
        todayVital: todayVitals.length ? todayVitals[todayVitals.length - 1] : null,
        todayExercises: records.filter(function (e) { return e.date === t; })
          .sort(function (a, b) { return timeKey(a.time) < timeKey(b.time) ? -1 : 1; }),
        vitalsAll: vitals,
        recentDays: recentDays,
        alertHistory: vitals.filter(function (v) { return v.flagged; }).reverse().slice(0, 10),
      };
    },
    apiSaveExercise: function (p) {
      var db = load();
      db.seq += 1;
      var rec = { id: 'm' + db.seq, date: todayStr(), time: nowTime(), userId: p.userId, exerciseId: p.exerciseId, amount: p.amount, load: p.load, note: p.note || '' };
      db.records.push(rec);
      save(db);
      return { record: rec, todayExercises: fns.apiGetTodayExercises(p.userId) };
    },
    apiGetTodayExercises: function (userId) {
      var db = load();
      var t = todayStr();
      return db.records.filter(function (e) { return e.userId === userId && e.date === t; })
        .sort(function (a, b) { return timeKey(a.time) < timeKey(b.time) ? -1 : 1; });
    },
    apiGetUserResults: function (userId, month) {
      var db = load();
      var months = {};
      db.checkins.forEach(function (c) { months[c.date.slice(0, 7)] = true; });
      var vitalsAll = db.vitals.filter(function (v) { return v.userId === userId; })
        .sort(function (a, b) { return (a.date + timeKey(a.time)) < (b.date + timeKey(b.time)) ? -1 : 1; });
      function inM(d) { return d.slice(0, 7) === month; }
      return {
        months: Object.keys(months).sort().reverse(),
        vitalsAll: vitalsAll,
        monthCheckins: db.checkins.filter(function (c) { return c.userId === userId && inM(c.date); }),
        monthVitals: vitalsAll.filter(function (v) { return inM(v.date); }),
        monthExercises: db.records.filter(function (e) { return e.userId === userId && inM(e.date); }),
      };
    },
    apiGetTodayRecords: function () {
      var db = load();
      var t = todayStr();
      return {
        checkins: fns.apiGetTodayCheckins(),
        vitals: db.vitals.filter(function (v) { return v.date === t; }),
        records: db.records.filter(function (e) { return e.date === t; }),
      };
    },
    apiGetMonthly: function (month) {
      var db = load();
      var months = {};
      db.checkins.forEach(function (c) { months[c.date.slice(0, 7)] = true; });
      function inM(d) { return d.slice(0, 7) === month; }
      return {
        months: Object.keys(months).sort().reverse(),
        checkins: db.checkins.filter(function (c) { return inM(c.date); }),
        vitals: db.vitals.filter(function (v) { return inM(v.date); }),
        records: db.records.filter(function (e) { return inM(e.date); }),
      };
    },
  };

  return {
    call: function (name, args) {
      if (!fns[name]) return Promise.reject(new Error('unknown api: ' + name));
      try {
        return Promise.resolve(fns[name].apply(null, args));
      } catch (e) {
        return Promise.reject(e);
      }
    },
  };
})();

// ---------------------------------------------------------------- 起動

rpc('apiGetBootstrap').then(function (boot) {
  S.users = boot.users;
  S.exercises = boot.exercises;
  S.today = boot.today;
  S.staff = boot.staff;
  S.todayCheckins = boot.todayCheckins;
  S.ready = true;
  render();
}).catch(function (e) {
  document.getElementById('app').innerHTML =
    '<div style="padding:48px;text-align:center;color:#8A4560;font-weight:700;">' +
    '起動エラー: ' + esc(e && e.message ? e.message : e) +
    '<br><span style="font-weight:400;font-size:13px;">Apps Script エディタで setup() を実行済みか確認してください</span></div>';
});
</script>
