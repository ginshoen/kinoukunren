<!DOCTYPE html>
<html lang="ja">
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="format-detection" content="telephone=no" />
    <style>
:root {
  /* Primary — 銀松苑グリーン */
  --green: #176b52;
  --green-dark: #0d4c3a;
  --green-l1: #82d9b8;
  --green-l2: #49ad86;
  --green-l3: #9fd8c1;
  --green-l4: #d4ebe1;
  /* 訓練モード */
  --purple: #5b5ea6;
  --purple-dark: #43468c;
  --purple-pale: #efeffa;
  /* アラート */
  --alert: #d5688e;
  --alert-bg: #fbeff3;
  --alert-border: #f0cbd8;
  --alert-text: #8a4560;
  /* 背景 */
  --page: #f1f4ef;
  --card-face: #fbfcfa;
  --input-bg: #f1f5f0;
  --subtle-bg: #fcfdfb;
  --sidebar: #142d24;
  --camera: #12231d;
  /* ボーダー */
  --border: #dce5db;
  --border-success: #bfdcbe;
  --border-undone: #c9d5c8;
  /* テキスト */
  --text: #14231d;
  --text-sub: #354b41;
  --text-aux: #52665c;
  --text-success: #4a6b4d;
  --text-disabled: #9aa89c;
  /* 成功背景 */
  --success-bg: #e3f1e1;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  background: radial-gradient(circle at 12% -10%, rgba(130,217,184,.2), transparent 32rem), var(--page);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

a {
  color: var(--green);
}
a:hover {
  color: var(--green-dark);
}

button {
  font-family: inherit;
  border: none;
  background: none;
  padding: 0;
  margin: 0;
  cursor: pointer;
  color: inherit;
}

input,
textarea,
select {
  font-family: inherit;
  color: inherit;
}

/* ---------- モバイル画面フレーム(390px カード) ---------- */
.phone-wrap {
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 24px 12px 48px;
}

.phone {
  width: 100%;
  max-width: 390px;
  background: var(--card-face);
  border-radius: 28px;
  overflow: hidden;
  box-shadow: 0 12px 40px rgba(31, 42, 34, 0.14);
  border: 1px solid var(--border);
}

@media (max-width: 430px) {
  .phone-wrap {
    padding: 0;
  }
  .phone {
    max-width: none;
    border-radius: 0;
    border: none;
    min-height: 100dvh;
  }
}

.phone-header {
  background: var(--green);
  color: #fff;
  padding: 18px 20px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.phone-header.training {
  background: var(--purple);
  padding: 16px 20px;
}

.phone-header.compact {
  padding: 16px 20px;
}

.phone-header .logo {
  height: 34px;
  width: 34px;
  background: #fff;
  border-radius: 99px;
  padding: 2px;
  object-fit: contain;
}

.phone-header .back-btn {
  font-size: 22px;
  color: #fff;
  line-height: 1;
  padding: 4px 6px;
  margin-left: -6px;
  min-width: 44px;
  min-height: 44px;
  display: flex;
  align-items: center;
}

.phone-header .h-sub {
  font-size: 12px;
  opacity: 0.85;
}
.phone-header .h-title {
  font-size: 19px;
  font-weight: 900;
}

.phone-header .h-right {
  margin-left: auto;
  text-align: right;
}

.pill-badge {
  background: rgba(255, 255, 255, 0.18);
  border-radius: 99px;
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 700;
}

.qr-read-badge {
  display: inline-block;
  background: rgba(255, 255, 255, 0.18);
  border-radius: 12px;
  padding: 6px 10px;
  font-size: 11px;
  font-weight: 700;
  text-align: center;
  line-height: 1.35;
}

.phone-body {
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* ---------- カメラビュー ---------- */
.camera-view {
  background: var(--camera);
  border-radius: 20px;
  height: 280px;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.camera-view video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.camera-dim {
  position: absolute;
  inset: 44px 64px;
  border-radius: 16px;
  box-shadow: 0 0 0 3000px rgba(0, 0, 0, 0.35);
}

.camera-corner {
  position: absolute;
  width: 28px;
  height: 28px;
}
.camera-corner.tl {
  top: 44px;
  left: 64px;
  border-top: 4px solid var(--green-l1);
  border-left: 4px solid var(--green-l1);
  border-radius: 6px 0 0 0;
}
.camera-corner.tr {
  top: 44px;
  right: 64px;
  border-top: 4px solid var(--green-l1);
  border-right: 4px solid var(--green-l1);
  border-radius: 0 6px 0 0;
}
.camera-corner.bl {
  bottom: 44px;
  left: 64px;
  border-bottom: 4px solid var(--green-l1);
  border-left: 4px solid var(--green-l1);
  border-radius: 0 0 0 6px;
}
.camera-corner.br {
  bottom: 44px;
  right: 64px;
  border-bottom: 4px solid var(--green-l1);
  border-right: 4px solid var(--green-l1);
  border-radius: 0 0 6px 0;
}

.camera-hint {
  color: #b7c9b8;
  font-size: 15px;
  font-weight: 700;
  position: relative;
  text-align: center;
  padding: 0 24px;
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
}

.capture-wrap {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 14px;
  display: flex;
  justify-content: center;
  z-index: 2;
}

.capture-btn {
  background: var(--green);
  color: #fff;
  border-radius: 99px;
  min-height: 48px;
  padding: 0 24px;
  font-size: 16px;
  font-weight: 900;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
}
.capture-btn:active {
  background: var(--green-dark);
}

/* ---------- トースト ---------- */
.toast-success {
  background: var(--success-bg);
  border: 1px solid var(--border-success);
  border-radius: 16px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  text-align: left;
}

.toast-success .check-circle {
  width: 44px;
  height: 44px;
  flex: none;
  border-radius: 99px;
  background: var(--green);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 900;
}

.toast-success .t-title {
  font-size: 17px;
  font-weight: 900;
}
.toast-success .t-sub {
  font-size: 13px;
  color: var(--text-success);
}

.toast-error {
  background: var(--alert-bg);
  border: 1px solid var(--alert-border);
  border-radius: 16px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.toast-error .x-circle {
  width: 44px;
  height: 44px;
  flex: none;
  border-radius: 99px;
  background: var(--alert);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: 900;
}

.toast-error .t-title {
  font-size: 15px;
  font-weight: 900;
  color: var(--alert-text);
}
.toast-error .t-sub {
  font-size: 13px;
  color: var(--alert-text);
}

/* ---------- リスト ---------- */
.section-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 8px;
}
.section-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-sub);
}
.section-note {
  font-size: 13px;
  color: var(--text-aux);
}

.row-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.person-row {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 44px;
}

.person-row.pending {
  border: 1px dashed var(--border-undone);
  opacity: 0.65;
}

.status-dot {
  width: 10px;
  height: 10px;
  flex: none;
  border-radius: 99px;
  background: var(--green);
}
.person-row.pending .status-dot {
  background: var(--border-undone);
}

.person-name {
  font-size: 15px;
  font-weight: 700;
}
.person-care {
  font-size: 12px;
  color: var(--text-aux);
}
.person-time {
  margin-left: auto;
  font-size: 13px;
  color: var(--text-success);
  font-weight: 700;
}
.person-row.pending .person-time {
  color: var(--text-disabled);
  font-weight: 400;
}

/* ---------- カード ---------- */
.card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 14px 16px;
}

.card-label {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-sub);
}
.card-label .unit {
  font-weight: 400;
  color: var(--text-aux);
}

/* ---------- バイタル入力 ---------- */
.bp-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.bp-title {
  font-size: 15px;
  font-weight: 900;
}
.bp-unit {
  font-size: 12px;
  color: var(--text-aux);
}
.bp-prev {
  margin-left: auto;
  font-size: 12px;
  color: var(--text-aux);
}

.bp-inputs {
  display: flex;
  gap: 10px;
  align-items: center;
}
.bp-slash {
  color: var(--text-disabled);
  font-size: 20px;
  font-weight: 700;
}

.num-box {
  flex: 1;
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 8px;
  text-align: center;
}
.num-box:focus-within {
  border: 2px solid var(--green);
  padding: 7px;
}
.num-box .nb-label {
  font-size: 11px;
  color: var(--text-aux);
}
.num-box input {
  width: 100%;
  border: none;
  background: transparent;
  outline: none;
  text-align: center;
  font-size: 30px;
  font-weight: 900;
  padding: 0;
  color: var(--text);
}
.num-box input::placeholder {
  color: var(--text-disabled);
  font-weight: 700;
}

.vitals-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.vital-cell {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 12px 14px;
}
.vital-cell:focus-within {
  border: 2px solid var(--green);
  padding: 11px 13px;
}
.vital-cell input {
  width: 100%;
  border: none;
  background: transparent;
  outline: none;
  font-size: 28px;
  font-weight: 900;
  padding: 0;
  color: var(--text);
}
.vital-cell input::placeholder {
  color: var(--text-disabled);
  font-weight: 700;
}
.vital-prev {
  font-size: 11px;
  color: var(--text-aux);
}

/* ---------- アラート ---------- */
.alert-banner {
  background: var(--alert-bg);
  border: 1px solid var(--alert-border);
  border-radius: 14px;
  padding: 10px 14px;
  display: flex;
  gap: 10px;
  align-items: center;
}
.alert-dot {
  width: 10px;
  height: 10px;
  flex: none;
  border-radius: 99px;
  background: var(--alert);
}
.alert-text {
  font-size: 13px;
  color: var(--alert-text);
  font-weight: 700;
}

/* ---------- ボタン ---------- */
.btn-row {
  display: flex;
  gap: 10px;
}

.btn-outline {
  flex: 1;
  background: #fff;
  border: 2px solid var(--green);
  color: var(--green);
  border-radius: 14px;
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 900;
}
.btn-outline:active {
  background: var(--input-bg);
}

.btn-primary {
  flex: 2;
  background: var(--green);
  color: #fff;
  border-radius: 14px;
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  font-weight: 900;
  box-shadow: 0 6px 16px rgba(46, 125, 50, 0.3);
}
.btn-primary:active {
  background: var(--green-dark);
}
.btn-primary:disabled {
  opacity: 0.5;
  box-shadow: none;
}

.btn-training {
  background: var(--purple);
  color: #fff;
  border-radius: 14px;
  min-height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 900;
  box-shadow: 0 6px 16px rgba(91, 94, 166, 0.3);
  width: 100%;
}
.btn-training:active {
  background: var(--purple-dark);
}
.btn-training:disabled {
  opacity: 0.5;
  box-shadow: none;
}

.link-plain {
  font-size: 13px;
  font-weight: 700;
  color: var(--green);
  text-align: center;
  padding: 8px;
  min-height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  width: 100%;
}

/* ---------- セグメント選択 ---------- */
.segment-row {
  display: flex;
  gap: 8px;
}

.segment {
  flex: 1;
  min-height: 48px;
  border: 1px solid var(--border);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 700;
  background: var(--input-bg);
  color: var(--text);
}
.segment.small {
  font-size: 15px;
}
.segment.selected {
  border: 2px solid var(--purple);
  background: var(--purple-pale);
  color: var(--purple-dark);
  font-weight: 900;
}

/* ---------- テキストエリア ---------- */
.note-area {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 12px;
  min-height: 64px;
  padding: 10px 12px;
  font-size: 14px;
  background: var(--subtle-bg);
  resize: vertical;
  outline: none;
}
.note-area:focus {
  border: 2px solid var(--purple);
  padding: 9px 11px;
}
.note-area::placeholder {
  color: var(--text-aux);
}

/* ---------- 実施状況リスト ---------- */
.exercise-row {
  background: var(--success-bg);
  border: 1px solid var(--border-success);
  border-radius: 12px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 44px;
}
.exercise-row .check {
  color: var(--green);
  font-weight: 900;
}
.exercise-row .ex-name {
  font-size: 14px;
  font-weight: 700;
}
.exercise-row .ex-summary {
  margin-left: auto;
  font-size: 12px;
  color: var(--text-success);
}

.exercise-row.undone {
  background: #fff;
  border: 1px dashed var(--border-undone);
  opacity: 0.7;
}
.exercise-row.undone .check {
  color: var(--text-disabled);
  font-weight: 400;
}
.exercise-row.undone .ex-summary {
  color: var(--text-disabled);
}

/* ---------- モーダル(手動選択フォールバック) ---------- */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(31, 42, 34, 0.5);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 50;
}
.modal-sheet {
  background: var(--card-face);
  border-radius: 20px 20px 0 0;
  width: 100%;
  max-width: 430px;
  max-height: 70dvh;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.modal-title {
  font-size: 16px;
  font-weight: 900;
}
.modal-row {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 48px;
  width: 100%;
  text-align: left;
  font-size: 15px;
  font-weight: 700;
}
.modal-row:active {
  background: var(--input-bg);
}

/* ---------- 管理者 PC 画面 ---------- */
.admin-wrap {
  min-height: 100dvh;
  padding: 24px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.admin-frame {
  width: 100%;
  max-width: 1180px;
  background: var(--card-face);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 12px 40px rgba(31, 42, 34, 0.14);
  border: 1px solid var(--border);
  display: flex;
  min-height: 720px;
}

.admin-sidebar {
  width: 220px;
  flex: none;
  background: var(--sidebar);
  color: var(--border);
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.admin-sidebar .brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 8px 16px;
}
.admin-sidebar .brand img {
  height: 30px;
  width: 30px;
  background: #fff;
  border-radius: 99px;
  padding: 2px;
  object-fit: contain;
}
.admin-sidebar .brand-name {
  font-size: 15px;
  font-weight: 900;
  color: #fff;
}

.nav-item {
  padding: 10px 12px;
  font-size: 14px;
  border-radius: 10px;
  color: var(--border);
  text-align: left;
  width: 100%;
  cursor: pointer;
  touch-action: manipulation;
}
@media (hover: hover) and (pointer: fine) {
  .nav-item:hover {
    background: rgba(255, 255, 255, 0.08);
  }
}
.nav-item:active {
  transform: translateY(1px);
}
.nav-item.active {
  background: var(--green);
  color: #fff;
  font-weight: 700;
}

.admin-staff {
  margin-top: auto;
  padding: 10px 12px;
  font-size: 13px;
  color: #8fa491;
}

.admin-content {
  flex: 1;
  padding: 24px 28px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  min-width: 0;
}

.admin-page-head {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.breadcrumb {
  font-size: 13px;
  color: var(--text-aux);
}
.admin-h1 {
  font-size: 24px;
  font-weight: 900;
}
.admin-h1 .attrs {
  font-size: 14px;
  color: var(--text-aux);
  font-weight: 700;
}

.admin-actions {
  margin-left: auto;
  display: flex;
  gap: 8px;
  align-items: center;
}

.select-plain {
  border: 1px solid var(--border);
  background: #fff;
  border-radius: 10px;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 700;
  outline: none;
  cursor: pointer;
}

.btn-csv {
  background: var(--green);
  color: #fff;
  border-radius: 10px;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 700;
}
.btn-csv:hover {
  background: var(--green-dark);
}

.admin-grid {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 18px;
}
@media (max-width: 900px) {
  .admin-grid {
    grid-template-columns: 1fr;
  }
  .admin-frame {
    flex-direction: column;
  }
  .admin-sidebar {
    width: 100%;
    flex-direction: row;
    flex-wrap: wrap;
    align-items: center;
  }
  .admin-staff {
    margin-top: 0;
    margin-left: auto;
  }
}

.panel {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px 20px;
}

.panel-title {
  font-size: 15px;
  font-weight: 900;
  margin-bottom: 12px;
}
.panel-title .sub {
  font-size: 12px;
  color: var(--text-aux);
  font-weight: 400;
}

.legend {
  display: flex;
  gap: 16px;
  margin-top: 8px;
  font-size: 12px;
  color: var(--text-sub);
  flex-wrap: wrap;
}
.legend span {
  display: flex;
  align-items: center;
  gap: 6px;
}
.legend .chip {
  width: 14px;
  height: 3px;
  border-radius: 2px;
}

/* 横棒グラフ */
.bar-rows {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.bar-row {
  display: grid;
  grid-template-columns: 110px 1fr 30px;
  gap: 10px;
  align-items: center;
}
.bar-label {
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.bar-track {
  background: var(--page);
  border-radius: 6px;
  height: 18px;
}
.bar-fill {

/* ========================================================================== */
/* Responsive hardening                                                       */

html {
  width: 100%;
  min-width: 0;
  overflow-x: hidden;
  overflow-x: clip;

  text-size-adjust: 100%;
}

body,
#app {
  width: 100%;
  max-width: 100%;
  min-width: 0;
  min-height: 100%;
}

body {
  overflow-x: hidden;
  overflow-x: clip;
}

img,
svg,
canvas,
video {
  max-width: 100%;
}

button,
input,
select,
textarea {
  min-width: 0;
  max-width: 100%;
}

.phone-body,
.phone-body > *,

.admin-content,
.admin-grid,

.phone-header .h-sub,

.camera-hint,

  padding: 12px 14px;
  display: grid;
  gap: 4px;
}
.profile-item.goal { border-left-color: var(--green); background: #f4faf7; }
.profile-item.caution { border-left-color: #d79532; background: #fff9ec; }
.profile-item span { color: var(--text-aux); font-size: 12px; font-weight: 700; }
.profile-item strong { font-size: 14px; line-height: 1.65; white-space: pre-wrap; }
.record-form { display: grid; gap: 10px; margin-bottom: 10px; }
.record-form .btn-outline { width: 100%; flex: none; }
.record-list { display: grid; gap: 7px; }
.record-line {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 2px 10px;
  align-items: baseline;
  padding: 10px 12px;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 12px;
}
.record-line b { font-size: 12px; color: var(--green-dark); }
.record-line span { font-size: 14px; font-weight: 700; }
.record-line small { grid-column: 1 / -1; color: var(--text-aux); line-height: 1.5; }
.record-line.assessment b { color: var(--purple-dark); }
.form-wide { grid-column: 1 / -1; }
.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.checkout-controls { display: flex; gap: 6px; min-width: 230px; }
.checkout-controls .select-plain { padding: 6px 8px; }
.checkout-controls .btn-csv { white-space: nowrap; }

/* ---------- 連絡帳 作成・A4横印刷 ---------- */
.notebook-tools {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 14px;
  color: var(--text-aux);
  font-size: 12px;
}
.notebook-tools .btn-outline { flex: none; min-height: 42px; padding: 0 16px; }
.notebook-count { margin-left: auto; font-weight: 800; color: var(--green-dark); }
.notebook-count.warn { color: var(--alert-text); }
.communication-sheet {
  width: 100%;
  max-width: 1120px;
  margin: 0 auto;
  padding: 28px 32px 18px;
  background: #fff;
  border: 1px solid #d8ded8;
  border-radius: 18px;
  box-shadow: 0 16px 42px rgba(20,45,36,.12);
  color: #17231d;
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
}
.notebook-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 24px;
  padding-bottom: 12px;
  border-bottom: 2px solid #2d5c4b;
}
.notebook-brand { display: flex; align-items: center; gap: 12px; }
.notebook-brand img { width: 54px; height: 54px; object-fit: contain; }
.notebook-brand small { color: var(--green); font-weight: 900; letter-spacing: .08em; }
.notebook-brand h1 { margin: 0; font-size: 30px; line-height: 1.1; letter-spacing: .04em; }
.notebook-meta { display: flex; gap: 22px; }
.notebook-meta div { min-width: 210px; padding: 6px 10px; border-bottom: 1px solid #8fa49b; }
.notebook-meta small { display: block; color: #5f7068; font-weight: 700; }
.notebook-meta strong { display: block; font-size: 17px; margin-top: 2px; }
.notebook-thanks { margin: 12px 0; font-size: 17px; font-weight: 900; }
.notebook-layout { display: grid; grid-template-columns: 1.1fr .9fr; gap: 14px; }
.notebook-left { display: grid; grid-template-rows: auto 1fr auto; gap: 12px; min-width: 0; }
.notebook-box { position: relative; border: 2px solid #d8ded8; border-radius: 13px; padding: 22px 18px 14px; min-width: 0; }
.notebook-box h2 {
  position: absolute;
  top: -15px;
  left: 22px;
  margin: 0;
  padding: 5px 16px;
  border-radius: 8px;
  font-size: 16px;
  line-height: 1.2;
}
.notebook-box.program { border-color: #ef927c; }
.notebook-box.program h2 { background: #f6b3a3; }
.notebook-box.facility { border-color: #e7bb48; min-height: 118px; }
.notebook-box.facility h2 { background: #ffd75c; }
.notebook-box.family { border-color: #86a94b; min-height: 96px; }
.notebook-box.family h2 { background: #8eae4f; color: #122111; }
.notebook-box.photo { border-color: #31a8c2; min-height: 470px; padding: 24px 16px 14px; }
.notebook-box.photo h2 { background: #27a8c8; color: #042c35; }
.notebook-box.program ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.notebook-box.program li { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: center; min-height: 28px; }
.notebook-box.program li > span { width: 24px; height: 24px; border-radius: 99px; display: grid; place-items: center; background: #fff1ee; color: #a44836; font-weight: 900; }
.notebook-box.program li b { font-size: 15px; }
.notebook-box.program li small { color: #59675f; }
.notebook-box.program li.planned { opacity: .68; }
.notebook-vitals { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #d5dcd7; display: grid; gap: 2px; font-size: 11px; color: #4f6258; }
.notebook-comment { min-height: 76px; line-height: 1.75; font-size: 14px; outline: none; white-space: pre-wrap; }
.notebook-comment:focus { background: #fff9e8; box-shadow: 0 0 0 3px rgba(231,187,72,.25); border-radius: 6px; }
.family-lines { display: grid; gap: 22px; padding-top: 12px; }
.family-lines span { display: block; border-bottom: 1px solid #b9c7bc; }
#notebook-photo { width: 100%; height: 100%; min-height: 420px; display: grid; place-items: center; overflow: hidden; border-radius: 8px; background: #eef6f7; }
#notebook-photo img { width: 100%; height: 100%; max-height: 450px; object-fit: cover; border-radius: 8px; }
.notebook-photo-empty { display: grid; place-items: center; gap: 5px; color: #55808a; text-align: center; }
.notebook-photo-empty span { font-size: 44px; font-weight: 900; opacity: .25; }
.notebook-photo-empty small { max-width: 180px; }
.notebook-footer { margin-top: 8px; text-align: right; color: #607069; font-size: 10px; }

@media (max-width: 900px) {
  .communication-sheet { padding: 20px; border-radius: 14px; overflow-x: auto; }
  .notebook-head { align-items: flex-start; flex-direction: column; }
  .notebook-meta { width: 100%; flex-direction: column; gap: 4px; }
  .notebook-meta div { min-width: 0; }
  .notebook-layout { grid-template-columns: 1fr; }
  .notebook-box.photo { min-height: 360px; }
  #notebook-photo { min-height: 310px; }
}

@page { size: A4 landscape; margin: 8mm; }
@media print {
  html, body { width: auto; height: auto; background: #fff !important; }
  .admin-wrap, .admin-frame, .admin-content { display: block !important; width: 100% !important; max-width: none !important; min-height: 0 !important; margin: 0 !important; padding: 0 !important; border: 0 !important; box-shadow: none !important; }
  .admin-sidebar, .no-print { display: none !important; }
  .communication-sheet {
    display: block !important;

    border-radius: 0 !important;
    box-shadow: none !important;
    overflow: hidden;
    page-break-inside: avoid;
  }
  .notebook-brand h1 { font-size: 25px; }
  .notebook-brand img { width: 44px; height: 44px; }
  .notebook-head { padding-bottom: 7px; flex-direction: row !important; align-items: flex-end !important; }
  .notebook-meta { width: auto !important; flex-direction: row !important; gap: 10px !important; }
  .notebook-meta div { min-width: 50mm; }
  .notebook-thanks { margin: 8px 0 10px; font-size: 15px; }
  .notebook-layout { grid-template-columns: 1.08fr .92fr; gap: 10px; height: 139mm; }
  .notebook-left { gap: 9px; }
  .notebook-box { padding: 18px 12px 9px; border-radius: 8px; }
  .notebook-box h2 { top: -12px; font-size: 13px; padding: 4px 12px; }
  .notebook-box.program li { min-height: 21px; }
  .notebook-box.program li b { font-size: 12px; }
  .notebook-box.facility { min-height: 31mm; }
  .notebook-box.family { min-height: 25mm; }
  .notebook-box.photo { min-height: 0; height: 139mm; }
  #notebook-photo { min-height: 0; height: 100%; }
  #notebook-photo img { max-height: none; }
  .notebook-comment { min-height: 20mm; font-size: 11px; line-height: 1.55; }
  .communication-sheet.compact-print .notebook-comment { font-size: 9.5px; line-height: 1.35; }
  .communication-sheet.compact-print .notebook-box.program li { min-height: 18px; }
  .communication-sheet.compact-print .notebook-box.program li b,
  .communication-sheet.compact-print .notebook-box.program li small { font-size: 10px; }
  .family-lines { gap: 13px; }
  .notebook-footer { margin-top: 4px; }
}

/* ---------- 安全情報・管理者ゲート ---------- */
.precaution-banner {
  display: grid;
  grid-template-columns: 36px minmax(0, 1fr);
  gap: 10px;
  align-items: start;
  padding: 13px 14px;
  border: 2px solid #d46a46;
  border-radius: 14px;
  background: #fff2eb;
  color: #692915;
}
.precaution-icon {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: #c8512e;
  color: #fff;
  font-size: 22px;
  font-weight: 900;
}
.precaution-label { display: block; margin-bottom: 3px; font-size: 12px; font-weight: 900; letter-spacing: .04em; }
.precaution-banner strong { display: block; font-size: 15px; line-height: 1.6; }
.precaution-check { display: flex; align-items: center; gap: 8px; margin-top: 9px; font-size: 14px; font-weight: 900; }
.precaution-check input { width: 24px; height: 24px; accent-color: #a63f20; }
.admin-gate { width: 100%; max-width: 440px; display: grid; gap: 14px; }
.admin-gate .note-area { min-height: 50px; font-size: 20px; letter-spacing: 4px; }
.admin-gate .btn-primary { width: 100%; }

@media (max-width: 600px) {
  .notebook-count { width: 100%; margin-left: 0; }
  .day-table { display: block; min-width: 0; }
  .day-table .th { display: none; }
  .day-table .td {
    display: grid;
    grid-template-columns: 74px minmax(0, 1fr);
    gap: 8px;
    padding: 7px 10px;
    border-inline: 1px solid var(--border);
    border-bottom: 0;
  }
  .day-table .td::before { color: var(--text-aux); font-size: 11px; font-weight: 800; }
  .day-table .td:nth-child(5n + 1) { margin-top: 12px; border-top: 1px solid var(--border); border-radius: 12px 12px 0 0; }
  .day-table .td:nth-child(5n + 1)::before { content: '日付'; }
  .day-table .td:nth-child(5n + 2)::before { content: '来所'; }
  .day-table .td:nth-child(5n + 3)::before { content: 'バイタル'; }
  .day-table .td:nth-child(5n + 4)::before { content: '実施種目'; }
  .day-table .td:nth-child(5n + 5) { border-bottom: 1px solid var(--border); border-radius: 0 0 12px 12px; }
  .day-table .td:nth-child(5n + 5)::before { content: '所見'; }
  .gen-table { min-width: 0; }
  .gen-table thead { display: none; }
  .gen-table, .gen-table tbody, .gen-table tr, .gen-table td { display: block; width: 100%; }
  .gen-table tr { margin: 12px 0; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; background: #fff; }
  .gen-table td { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 8px; padding: 6px 0; border: 0; white-space: normal !important; }
  .gen-table td::before { color: var(--text-aux); font-size: 11px; font-weight: 800; }
  .gen-table td:nth-child(1)::before { content: '利用者'; }
  .gen-table td:nth-child(2)::before { content: '年齢'; }
  .gen-table td:nth-child(3)::before { content: '介護度'; }
  .gen-table td:nth-child(4)::before { content: '曜日'; }
  .gen-table td:nth-child(5)::before { content: '予定種目'; }
  .gen-table td:nth-child(6)::before { content: '操作'; }
}

// QR関連ライブラリは初期表示を止めないよう、必要になった時点で非同期読込する。
var OPTIONAL_SCRIPTS = {};
function loadScriptOnce(src, globalName) {
  if (window[globalName]) return Promise.resolve(window[globalName]);
  if (OPTIONAL_SCRIPTS[globalName]) return OPTIONAL_SCRIPTS[globalName];
  OPTIONAL_SCRIPTS[globalName] = new Promise(function (resolve, reject) {
    var script = document.createElement('script');
    script.src = src;
    script.async = true;
    script.onload = function () {
      if (window[globalName]) resolve(window[globalName]);
      else reject(new Error(globalName + 'を読み込めませんでした'));
    };
    script.onerror = function () { reject(new Error(globalName + 'を読み込めませんでした')); };
    document.head.appendChild(script);
  }).catch(function (err) {
    delete OPTIONAL_SCRIPTS[globalName];
    throw err;
  });
  return OPTIONAL_SCRIPTS[globalName];
}
function ensureQrDecoder() {
  return loadScriptOnce('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js', 'jsQR')
    .catch(function () {
      return loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js', 'jsQR');
    });
}
function ensureQrGenerator() {
  return loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js', 'QRCode')
    .catch(function () {
      return loadScriptOnce('https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js', 'QRCode');
    });
}

// ---------------------------------------------------------------- RPC

var RPC_CACHE = {};
var RPC_INFLIGHT = {};
var RPC_CACHE_EPOCH = 0;
var RPC_READ_TTL = {
  apiGetBootstrap: 300000,
  apiRefreshToday: 5000,
  apiGetVitalContext: 60000,
  apiGetTodayExercises: 8000,
  apiGetTodayAlerts: 30000,
  apiGetUserDetail: 15000,
  apiGetUserResults: 30000,
  apiGetTodayRecords: 10000,
  apiGetMonthly: 60000,
  apiGetCommunicationBook: 15000,
};
function rpcCacheKey(name, args) {
  return name + ':' + JSON.stringify(args || []);
}
function clearRpcCache() {
  RPC_CACHE = {};
  RPC_CACHE_EPOCH += 1;
}
function delay(ms) {
  return new Promise(function (resolve) { setTimeout(resolve, ms); });
}
function fetchRpc(name, args) {
  var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
  var timeoutMs = RPC_READ_TTL[name] ? 12000 : 25000;
  var timeout = setTimeout(function () { if (controller) controller.abort(); }, timeoutMs);
  return fetch(window.GAS_API_URL, {
    method: 'POST',
    // Content-Type を text/plain のままにして CORS プリフライトを回避する
    body: JSON.stringify({ fn: name, args: args, token: window.GAS_API_TOKEN || '' }),
    signal: controller ? controller.signal : undefined,
  }).then(function (r) {
    if (!r.ok) throw new Error('通信エラー(' + r.status + ')');
    return r.json();
  }).then(function (res) {
    if (!res.ok) throw new Error(res.error || 'サーバーエラー');
    return res.data;
  }).catch(function (err) {
    if (err && err.name === 'AbortError') throw new Error('通信がタイムアウトしました');
    throw err;
  }).finally(function () { clearTimeout(timeout); });
}

function rpc(name) {
  var args = [].slice.call(arguments, 1);
  var ttl = RPC_READ_TTL[name] || 0;
  var key = rpcCacheKey(name, args);
  var requestEpoch = RPC_CACHE_EPOCH;
  var cached = RPC_CACHE[key];
  if (ttl && cached && cached.expires > Date.now()) return Promise.resolve(cached.data);
  if (ttl && RPC_INFLIGHT[key]) return RPC_INFLIGHT[key];

  var request;
  // ホスティング版: GAS の /exec を JSON API として呼ぶ(iOSライブカメラ対応構成)
  if (window.GAS_API_URL) {
    request = fetchRpc(name, args).catch(function (err) {
      // 読み取りだけを1回再試行。保存系は二重登録を避けるため自動再試行しない。
      if (!ttl || String(err && err.message || err).indexOf('認証') >= 0) throw err;
      return delay(350).then(function () { return fetchRpc(name, args); });
    });
  } else if (window.google && google.script && google.script.run) {
    request = new Promise(function (resolve, reject) {
      var runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (e) { reject(e); });
      runner[name].apply(runner, args);
    });
  } else {
    request = Mock.call(name, args); // ローカルプレビュー用モック
  }

  request = Promise.resolve(request).then(function (data) {
    if (ttl && requestEpoch === RPC_CACHE_EPOCH) RPC_CACHE[key] = { data: data, expires: Date.now() + ttl };
    else clearRpcCache();
    return data;
  }).finally(function () { delete RPC_INFLIGHT[key]; });
  if (ttl) RPC_INFLIGHT[key] = request;
  return request;
}

/** 未登録端末を管理者PINでGASへペアリングする。 */
function pairDeviceRpc(pin) {
  if (!window.GAS_API_URL) return Promise.reject(new Error('GAS URLが未設定です'));
  return fetch(window.GAS_API_URL, {
    method: 'POST',
    body: JSON.stringify({ fn: 'apiPairDevice', args: [String(pin || '')], token: '' }),
  }).then(function (r) {
    if (!r.ok) throw new Error('通信エラー(' + r.status + ')');
    return r.json();
  }).then(function (res) {
    if (!res.ok) throw new Error(res.error || '端末を認証できませんでした');
    return res.data;
  });
}

function currentUser() {
  for (var i = 0; i < S.users.length; i++) if (S.users[i].id === S.currentUserId) return S.users[i];
  return null;
}
function exerciseById(id) {
  for (var i = 0; i < S.exercises.length; i++) if (S.exercises[i].id === id) return S.exercises[i];
  return null;
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function timeKey(t) { return ('00000' + t).slice(-5); }
function shortDate(date) {
  var p = date.split('-');
  return Number(p[1]) + '/' + Number(p[2]);
}
function dayLabel(date) {
  var d = new Date(date + 'T00:00:00');
  return (d.getMonth() + 1) + '/' + d.getDate() + '(' + WEEKDAYS[d.getDay()] + ')';
}
function monthLabel(m) {
  var p = m.split('-');
  return p[0] + '年' + Number(p[1]) + '月';
}
function nowClock() {
  var d = new Date();
  return {
    date: (d.getMonth() + 1) + '月' + d.getDate() + '日(' + WEEKDAYS[d.getDay()] + ')',
    time: d.getHours() + ':' + ('0' + d.getMinutes()).slice(-2),
  };
}

// バイタル閾値判定(サーバーと同一ロジック。ライブ表示用)
function evaluateVitalAlerts(draft, prev) {
  var alerts = [];
  var sys = Number(draft.systolic);
  if (draft.systolic !== '' && !isNaN(sys)) {
    if (sys >= 160) alerts.push('収縮期血圧が高値です(160以上)。運動可否を看護師に確認してください');
    else if (prev && sys - prev.systolic >= 20) alerts.push('収縮期血圧が前回より高めです。運動前に再測定を推奨');
  }
  var spo2 = Number(draft.spo2);
  if (draft.spo2 !== '' && !isNaN(spo2) && spo2 <= 92) alerts.push('SpO2が低めです(92%以下)。安静にして再測定してください');
  var temp = Number(draft.temp);
  if (draft.temp !== '' && !isNaN(temp) && temp >= 37.5) alerts.push('体温が高めです(37.5℃以上)。本日の運動可否を確認してください');
  return alerts;
}

var VITAL_LIMITS = {
  systolic: [60, 250], diastolic: [30, 150], pulse: [30, 220],
  temp: [30, 45], spo2: [50, 100], weight: [20, 250],
};
function vitalValidationErrors(draft) {
  var labels = { systolic: '収縮期血圧', diastolic: '拡張期血圧', pulse: '脈拍', temp: '体温', spo2: 'SpO2', weight: '体重' };
  var errors = [];
  Object.keys(VITAL_LIMITS).forEach(function (key) {
    if (draft[key] === '') return;
    var value = Number(draft[key]);
    var range = VITAL_LIMITS[key];
    if (!isFinite(value) || value < range[0] || value > range[1]) {
      errors.push(labels[key] + 'は' + range[0] + '〜' + range[1] + 'の範囲で入力してください');
    }
  });
  if (draft.systolic && draft.diastolic && Number(draft.diastolic) >= Number(draft.systolic)) {
    errors.push('下の血圧は上の血圧より小さい値にしてください');
  }
  return errors;
}

// ---------------------------------------------------------------- QRスキャナー

var Scanner = {
  stream: null, timer: null, video: null, lastValue: '', lastAt: 0, paused: false,
  onDetect: null, generation: 0, scanning: false, detectionTimer: null,
  mode: '', autoMode: '',
  /**
   * 画面表示時の準備のみ(カメラは起動しない)。
   * ライブスキャンは「スキャンを開始」ボタンのタップで起動し、
   * 一度開始した後は、読み取り→短時間静止→保存→次の読み取りを自動で繰り返す。
   */
  prepare: function (onDetect, mode) {
    var self = this;
    self.mode = mode || 'scan';
    self.onDetect = onDetect;
    // 画面表示直後からデコーダーを先読みし、開始ボタン後の待ち時間をなくす。
    if (typeof jsQR !== 'function') ensureQrDecoder().catch(function () {});
    self.bindCapture();
    var toggle = document.getElementById('scan-toggle-btn');
    if (toggle && toggle.getAttribute('data-bound') !== 'true') {
      toggle.setAttribute('data-bound', 'true');
      toggle.addEventListener('click', function () {
        if (self.stream || self.timer) self.stopToIdle();
        else {
          self.autoMode = self.mode;
          self.start(self.onDetect);
        }
      });
    }
    // 保存後の再描画では追加タップなしでライブ読取へ復帰する。
    if (self.autoMode === self.mode && !self.stream && !self.timer) {
      setTimeout(function () {
        if (self.autoMode === self.mode && document.getElementById('camera-view')) self.start(self.onDetect);
      }, 120);
    }
  },
  /** ライブスキャンを止めて「開始」待ちの状態に戻す */
  stopToIdle: function (message) {
    var video = this.video;
    this.stop();
    this.autoMode = '';
    if (video && video.parentNode) video.parentNode.removeChild(video);
    this.video = null;
    var toggle = document.getElementById('scan-toggle-btn');
    if (toggle) toggle.textContent = '📷 スキャンを開始';
    var resume = document.getElementById('camera-resume-btn');
    if (resume) resume.remove();
    var hint = document.getElementById('camera-hint');
    if (hint) hint.textContent = message || '「スキャンを開始」を押してください';
  },
  start: function (onDetect) {
    var self = this;
    // カメラ起動と並行してデコーダーを読み込む。初期画面の表示は待たせない。
    if (typeof jsQR !== 'function') ensureQrDecoder().catch(function () {});
    // 再入時は既存リソースを必ず解放する。iOSはカメラ同時1キャプチャ制約が
    // あるため、前回の stream が生きていると2回目以降の getUserMedia が
    // NotReadableError で恒久的に失敗する(「ボタンを押しても無反応」の主因)。
    if (self.timer) { clearInterval(self.timer); self.timer = null; }
    if (self.detectionTimer) { clearTimeout(self.detectionTimer); self.detectionTimer = null; }
    if (self.stream) { self.stream.getTracks().forEach(function (t) { t.stop(); }); self.stream = null; }
    if (self.video && self.video.parentNode) self.video.parentNode.removeChild(self.video);
    self.video = null; self.paused = false; self.scanning = false;
    var generation = ++self.generation;
    self.onDetect = onDetect;
    var view = document.getElementById('camera-view');
    self.bindCapture();
    // まずライブカメラを試行し、起動できた端末は連続読取。
    // GAS iframe で拒否される端末は撮影ボタンに自動フォールバックする。
    if (!view || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      self.fail(); return;
    }
    navigator.mediaDevices.getUserMedia({
      // QR読取には十分な解像度へ抑え、iPhoneでの発熱・フレーム落ちを防ぐ。
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 960 }, height: { ideal: 540 } },
      audio: false,
    })
      .then(function (stream) {
        if (generation !== self.generation) {
          stream.getTracks().forEach(function (t) { t.stop(); });
          return null;
        }
        self.stream = stream;
        var video = document.createElement('video');
        video.muted = true;
        video.setAttribute('muted', ''); // WKWebViewはコンテンツ属性も参照する
        video.setAttribute('playsinline', '');
        video.setAttribute('webkit-playsinline', '');
        video.setAttribute('autoplay', '');
        video.srcObject = stream;
        view.insertBefore(video, view.firstChild);
        self.video = video;
        // autoplay拒否(iOS Chromeで起きうる)は致命エラーにせず、タップ再生に格下げ
        return video.play().catch(function (err) {
          if (generation !== self.generation) return;
          if (err && (err.name === 'NotAllowedError' || err.name === 'AbortError')) {
            var hintEl = document.getElementById('camera-hint');
            if (hintEl) hintEl.textContent = 'タップしてカメラを開始';
            var retryPlay = function () {
              video.play().then(function () {
                view.removeEventListener('click', retryPlay);
                var h = document.getElementById('camera-hint');
                if (h) h.textContent = 'QRコードを枠内にかざしてください';
              }).catch(function () {});
            };
            view.addEventListener('click', retryPlay);
            return; // 許可は取得済みなので後続のスキャン準備は継続
          }
          throw err;
        });
      })
      .then(function () {
        if (generation !== self.generation || !self.video) return;
        var hintEl = document.getElementById('camera-hint');
        if (hintEl) hintEl.textContent = 'QRコードを枠内にかざしてください';
        var toggle = document.getElementById('scan-toggle-btn');
        if (toggle) toggle.textContent = '⏹ スキャンを停止';
        self.liveSince = Date.now();
        var canvas = document.createElement('canvas');
        var canvasCtx = canvas.getContext('2d', { willReadFrequently: true });
        var detector = window.BarcodeDetector ? new BarcodeDetector({ formats: ['qr_code'] }) : null;
        self.timer = setInterval(function () {
          var v = self.video;
          if (!v || self.paused || self.scanning) return;
          if (v.readyState < 2) {
            // 1フレームも来ないまま15秒経過 = 起動失敗(「読取なし」とは区別して案内)
            if (Date.now() - self.liveSince > 15000) {
              self.suspend('カメラ映像を取得できませんでした。タップして再試行してください');
            }
            return;
          }
          self.scanning = true;
          var handle = function (value) {
            if (generation !== self.generation || self.paused) return;
            var now = Date.now();
            if (value === self.lastValue && now - self.lastAt < 2000) return;
            self.lastValue = value; self.lastAt = now;
            self.flash();
            self.detectionTimer = setTimeout(function () {
              self.detectionTimer = null;
              if (generation === self.generation) onDetect(value);
            }, 550);
          };
          var decodeWithJsQr = function () {
            var vw = v.videoWidth, vh = v.videoHeight;
            if (!vw || !vh || !canvasCtx || typeof jsQR !== 'function') return;
            // 正方形の読取枠周辺だけを512pxで解析。通常の黒QRを高速優先し、
            // 4回に1回だけ反転QRも試すことで速度と互換性を両立する。
            var source = Math.min(vw, vh);
            var size = Math.min(512, source);
            var sx = Math.round((vw - source) / 2);
            var sy = Math.round((vh - source) / 2);
            if (canvas.width !== size || canvas.height !== size) {
              canvas.width = size; canvas.height = size;
              canvasCtx = canvas.getContext('2d', { willReadFrequently: true });
            }
            canvasCtx.drawImage(v, sx, sy, source, source, 0, 0, size, size);
            self.decodeTick = (self.decodeTick || 0) + 1;
            var inversion = self.decodeTick % 4 === 0 ? 'attemptBoth' : 'dontInvert';
            var code = jsQR(canvasCtx.getImageData(0, 0, size, size).data, size, size, { inversionAttempts: inversion });
            if (code && code.data) handle(code.data);
          };
          if (detector) {
            detector.detect(v).then(function (codes) {
              if (generation !== self.generation || v !== self.video) return;
              if (codes.length) handle(codes[0].rawValue);
            }).catch(function () {
              if (generation !== self.generation) return;
              detector = null;
              decodeWithJsQr();
            }).then(function () { if (generation === self.generation) self.scanning = false; });
            return;
          }
          try { decodeWithJsQr(); } finally { self.scanning = false; }
        }, 250);
      })
      .catch(function (err) {
        if (generation !== self.generation) return;
        // 原因を画面に表示する(これまでは握りつぶしていて切り分け不能だった)
        var name = (err && err.name) || 'UnknownError';
        var guide = {
          NotAllowedError: 'カメラが許可されていません。iPhoneの「設定 → Chrome(またはSafari)→ カメラ」を許可にして、ページを再読み込みしてください',
          NotReadableError: 'カメラが他のアプリ・タブで使用中です。他のカメラ利用を閉じてから「ライブカメラを起動」を押してください',
          NotFoundError: 'この端末で利用できるカメラが見つかりません',
          OverconstrainedError: '背面カメラを起動できません。もう一度お試しください',
          SecurityError: 'この画面ではライブカメラを使えません。公開URL(ginshoen.github.io)から開いてください',
        }[name] || 'カメラを起動できませんでした';
        var hint = document.getElementById('camera-hint');
        if (hint) hint.textContent = guide + '(' + name + ')';
        self.fail(true);
      });
  },
  /**
   * ライブカメラ不可時のフォールバック。
   * GAS のウェブアプリは sandbox 付き iframe で配信されるため getUserMedia が
   * ブロックされる(Safari/Chrome共通)。その場で「撮影→写真をjsQRで解読」する
   * file capture 方式は iframe 内でも動作する。
   */
  fail: function (keepHint) {
    var hint = document.getElementById('camera-hint');
    if (hint && !keepHint) hint.textContent = 'ライブカメラを使えません。「写真から読み取る」をご利用ください';
    var toggle = document.getElementById('scan-toggle-btn');
    if (toggle) toggle.textContent = '📷 スキャンを開始';
    this.bindCapture();
  },
  /** 15秒無検出での自動停止(バッテリー配慮)。「開始」待ちに戻す */
  suspend: function (message) {
    this.stopToIdle(message || '読み取りがないため自動停止しました。「スキャンを開始」で再開できます');
  },
  bindCapture: function () {
    var self = this;
    var input = document.getElementById('capture-input');
    var button = document.getElementById('capture-btn');
    var hint = document.getElementById('camera-hint');
    if (!input || !button || input.getAttribute('data-bound') === 'true') return;
    input.setAttribute('data-bound', 'true');
    button.addEventListener('click', function () { input.click(); });
    input.addEventListener('change', function () {
      var file = input.files && input.files[0];
      input.value = '';
      if (!file || !self.onDetect) return;
      if (hint) hint.textContent = '読み取り中…';
      decodeQrFromFile(file).then(function (value) {
        if (value) {
          self.flash();
          self.onDetect(value);
        } else if (hint) {
          hint.textContent = 'QRを読み取れませんでした。枠いっぱいに写るよう撮り直してください';
        }
      });
    });
  },
  /**
   * 読取成功の瞬間に映像を静止し、「✓ 読み取りました」を表示する。
   * 成功時は画面遷移で自動的に解除、エラー時は resume() で再開する。
   */
  flash: function () {
    if (this.video) { try { this.video.pause(); } catch (e) {} }
    this.paused = true;
    var view = document.getElementById('camera-view');
    if (view && !view.querySelector('.detected-badge')) {
      view.classList.add('detected');
      var badge = document.createElement('div');
      badge.className = 'detected-badge';
      badge.setAttribute('role', 'status');
      badge.setAttribute('aria-live', 'assertive');
      badge.textContent = '✓ 読み取りました';
      view.appendChild(badge);
    }
    if (navigator.vibrate) navigator.vibrate(80);
  },
  resume: function () {
    var view = document.getElementById('camera-view');
    if (view) {
      view.classList.remove('detected');
      var badge = view.querySelector('.detected-badge');
      if (badge) badge.remove();
    }
    this.paused = false;
    if (this.video) { try { this.video.play(); } catch (e) {} }
  },
  stop: function () {
    this.generation += 1;
    if (this.timer) clearInterval(this.timer);
    if (this.detectionTimer) clearTimeout(this.detectionTimer);
    if (this.stream) this.stream.getTracks().forEach(function (t) { t.stop(); });
    this.timer = null; this.detectionTimer = null; this.stream = null; this.video = null; this.paused = false; this.scanning = false;
  },
};

/** 撮影した写真からQRを解読(複数スケールで試行) */
function decodeQrFromFile(file) {
  return new Promise(function (resolve) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var scales = [1000, 1600, 640];
      var result = null;
      for (var i = 0; i < scales.length && !result; i++) {
        var max = scales[i];
        var ratio = Math.min(1, max / Math.max(img.width, img.height));
        var w = Math.round(img.width * ratio);
        var h = Math.round(img.height * ratio);
        var canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        var ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0, w, h);
        try {
          var code = typeof jsQR === 'function' && jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'attemptBoth' });
          if (code && code.data) result = code.data;
        } catch (e) {}
      }
      URL.revokeObjectURL(url);
      resolve(result);
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      resolve(null);
    };
    img.src = url;
  });
}

function go(hash) {
  if (hash !== '' && hash !== 'exercise' && hash.indexOf('exercise/') !== 0) Scanner.autoMode = '';
  var current = location.hash.replace(/^#\/?/, '');
  // 同じメニューをもう一度押した場合も再読み込みし、無反応に見えないようにする。
  if (current === hash) {
    render();
    return false;
  }
  location.hash = hash;
  return false;
}

window.addEventListener('hashchange', render);

function render() {
  var renderId = (S.renderId || 0) + 1;
  S.renderId = renderId;
  Scanner.stop();
  if (S.toastTimer) { clearTimeout(S.toastTimer); S.toastTimer = null; }
  if (S.pollTimer) { clearInterval(S.pollTimer); S.pollTimer = null; }
  if (!S.ready) return;
  var h = location.hash.replace(/^#\/?/, '');
  var app = document.getElementById('app');
  if (h === 'users') return renderUserList(app, renderId);
  if (h.indexOf('users/') === 0) return renderUserDetail(app, h.slice(6), renderId);
  if (h === 'menu') return renderUserMenu(app, renderId);
  if (h === 'vitals') return renderVitals(app, renderId);
  if (h === 'exercise') return renderExerciseScan(app, renderId);
  if (h.indexOf('exercise/') === 0) return renderExerciseForm(app, h.slice(9), renderId);
  if (h.indexOf('admin') === 0 && !S.adminVerified) return renderAdminGate(app, h, renderId);
  if (h === 'admin') return renderAdminResults(app, renderId);
  if (h === 'admin/users') return renderAdminUsers(app, renderId);
  if (h === 'admin/today') return renderAdminToday(app, renderId);
  if (h === 'admin/master') return renderAdminMaster(app, renderId);
  if (h === 'admin/monthly') return renderAdminMonthly(app, renderId);
  if (h === 'admin/notebook') return renderCommunicationBook(app, renderId);
  return renderCheckin(app);
}

    '<div class="screen-intro"><span class="eyebrow">来所受付</span><h1>利用者カードを読み取る</h1>' +
    '<p>受付後は、下の一覧から利用者を選べばいつでも記録できます。</p></div>' +
    cameraHtml('利用者のQRカードをかざしてください') +
    toastHtml +
    '<div><div class="section-head"><span class="section-title">本日の来所状況</span>' +
    '<span class="section-note" id="checkin-count">' + S.todayCheckins.length + '名 / 予定' + statusView.scheduledCount + '名</span></div>' +
    '<div class="row-list" id="checkin-list">' + statusView.rows + '</div></div>' +
    '<button class="btn-outline" style="flex:none;width:100%;" onclick="go(\'users\')">👥 利用者の状況を確認(一覧)</button>' +
    '<button class="link-plain" onclick="Actions.openPicker()">QRを読み取れない場合は名前から選択 ›</button>' +
    (isStandalone() && !window.GAS_API_URL
      ? '<div class="toast-error" role="alert"><span class="x-circle">!</span><span>' +
        '<span class="t-title" style="display:block;">デモモードで動作中(記録は保存されません)</span>' +
        '<span class="t-sub">GASと接続するには下の「接続設定」からURLを貼り付けてください</span></span></div>'
      : '') +
    '<div class="footer-links">' +
    '<button class="link-plain" onclick="go(\'admin\')">📊 管理画面</button>' +
    (isStandalone()
      ? '<button class="link-plain" onclick="Actions.openSettings()">⚙ 接続設定</button>'
      : '') +
    '</div>' +
    '</div></div></div>' +
    '<div id="picker"></div>';

  Scanner.prepare(function (value) {
    var user = null;
    S.users.forEach(function (u) { if (u.qrCode === value.trim()) user = u; });
    if (!user) {
      S.toast = { type: 'error', title: '読み取りエラー', sub: '未登録のQRコードです。カードをご確認のうえ再度お試しください' };

  S.pollTimer = setInterval(function () {
    rpc('apiRefreshToday').then(function (res) {

  }, 60000);
}

// ---------------------------------------------------------------- 1c 機能訓練

function progressHtml(planned, records, pickable) {
  var doneCount = 0;
  var latest = {};
  records.forEach(function (r) { latest[r.exerciseId] = r; });
  planned.forEach(function (ex) { if (latest[ex.id]) doneCount++; });

  var rows = planned.map(function (ex) {
    var rec = latest[ex.id];
    if (rec) {
      return (
        '<div class="exercise-row"><span class="check">✓</span>' +
        '<span class="ex-name">' + esc(ex.name) + '</span>' +
        '<span class="ex-summary">' + esc(rec.time) + ' · ' + esc(rec.amount) + '</span></div>'
      );
    }
    var tag = pickable ? 'button' : 'div';
    var attr = pickable ? ' style="width:100%;text-align:left;" onclick="Actions.pickExercise(\'' + ex.id + '\')"' : '';
    return (
      '<' + tag + ' class="exercise-row undone"' + attr + '><span class="check">○</span>' +
      '<span class="ex-name">' + esc(ex.name) + '</span>' +
      '<span class="ex-summary">未実施</span></' + tag + '>'
    );
  }).join('');

  return (
    '<div><div class="section-head" style="margin-bottom:8px;"><span class="section-title">' +
    '本日の実施状況(' + planned.length + '種目中' + doneCount + '種目完了)</span></div>' +
    '<div class="row-list">' + rows + '</div></div>'
  );
}

function plannedExercises(user) {
  return user.plan.map(exerciseById).filter(Boolean);

function getTodayExerciseRecords(userId) {

/** ふりがなから五十音の行(あ/か/さ…)を判定 */
function kanaGyo(kana) {
  var c = (kana || '').replace(/\s/g, '').charAt(0);
  if (!c) return 'その他'; // indexOf('')は0を返すため空文字を先に弾く
  var rows = [
    ['あ', 'あいうえおぁぃぅぇぉ'], ['か', 'かきくけこがぎぐげご'],
    ['さ', 'さしすせそざじずぜぞ'], ['た', 'たちつてとだぢづでどっ'],
    ['な', 'なにぬねの'], ['は', 'はひふへほばびぶべぼぱぴぷぺぽ'],
    ['ま', 'まみむめも'], ['や', 'やゆよゃゅょ'], ['ら', 'らりるれろ'],
    ['わ', 'わをん'],
  ];
  for (var i = 0; i < rows.length; i++) {
    if (rows[i][1].indexOf(c) >= 0) return rows[i][0];
  }
  return 'その他';
}

/** 一覧行のHTML(状態: checked=来所済 / pending=本日予定・未着 / offday=予定なし) */
function userRowHtml(u, state, time, hasAlert) {
  var cls = 'person-row tappable' + (state === 'pending' ? ' pending' : state === 'offday' ? ' offday' : '');
  var right = state === 'checked' ? esc(time) : state === 'pending' ? '未着' : esc(u.scheduleLabel);
  return (
    '<button class="' + cls + '" data-name="' + esc((u.name + (u.kana || '')).replace(/\s/g, '')) + '"' +
    ' onclick="go(\'users/' + u.id + '\')">' +
    '<span class="status-dot"></span>' +
    '<span class="person-main"><span class="person-name">' + esc(u.name) + '</span>' +
    '<span class="person-care">' + esc(u.careLevel) + ' · ' + u.age + '歳</span></span>' +
    (hasAlert ? '<span class="badge-alert" title="本日アラートあり">⚑</span>' : '') +
    '<span class="person-time">' + right + '</span>' +
    '<span class="chev" aria-hidden="true">›</span></button>'
  );
}

function applyUserAlerts(alerts) {
  var rows = document.querySelectorAll('.person-row[data-user-id]');
  for (var i = 0; i < rows.length; i++) {
    var row = rows[i];
    var hasAlert = !!alerts[row.getAttribute('data-user-id')];
    row.setAttribute('data-alert', hasAlert ? '1' : '0');
    var badge = row.querySelector('.badge-alert');
    if (hasAlert && !badge) {
      badge = document.createElement('span');
      badge.className = 'badge-alert';
      badge.title = '本日アラートあり';
      badge.textContent = '⚑';
      row.insertBefore(badge, row.querySelector('.person-time'));
    } else if (!hasAlert && badge) {
      badge.remove();
    }
  }
  Actions.applyUserFilters();
}

function vitalLineText(v) {
  if (!v) return null;
  var parts = ['血圧 <b>' + v.systolic + '/' + v.diastolic + '</b>', '脈拍 <b>' + v.pulse + '</b>', '<b>' + v.temp.toFixed(1) + '</b>℃'];
  if (v.spo2 != null) parts.push('SpO2 <b>' + v.spo2 + '</b>%');
  if (v.weight != null) parts.push('<b>' + v.weight.toFixed(1) + '</b>kg');
  return parts.join(' · ');
}

var NAV_ITEMS = [
  ['admin', '利用者別 実績'],
  ['admin/today', '本日の記録一覧'],
  ['admin/notebook', '連絡帳 作成・印刷'],

  ['admin/monthly', '月次レポート'],
];

var adminNavSyncId = 0;

/**
 * 管理画面はスマートフォンで横スクロール式になる。
 * innerHTML の更新でスクロール位置が先頭へ戻っても、選択中タブを表示範囲へ戻す。
 */
function scheduleAdminNavSync() {
  var syncId = ++adminNavSyncId;
  requestAnimationFrame(function () {
    if (syncId !== adminNavSyncId) return;
    var nav = document.querySelector('.admin-sidebar');
    if (!nav || nav.scrollWidth <= nav.clientWidth) return;
    var active = nav.querySelector('.nav-item[aria-current="page"]');
    if (!active) return;

    var padding = 14;
    var activeLeft = active.offsetLeft;
    var activeRight = activeLeft + active.offsetWidth;
    var visibleLeft = nav.scrollLeft + padding;
    var visibleRight = nav.scrollLeft + nav.clientWidth - padding;
    if (activeLeft >= visibleLeft && activeRight <= visibleRight) return;

    var targetLeft = activeLeft - (nav.clientWidth - active.offsetWidth) / 2;
    var maxLeft = Math.max(0, nav.scrollWidth - nav.clientWidth);
    nav.scrollLeft = Math.max(0, Math.min(targetLeft, maxLeft));
  });
}

function adminShell(active, contentHtml) {
  scheduleAdminNavSync();
  var nav = NAV_ITEMS.map(function (item) {
    var cls = 'nav-item' + (item[0] === active ? ' active' : '');
    return '<button type="button" class="' + cls + '" data-admin-route="' + item[0] + '"' +
      (item[0] === active ? ' aria-current="page"' : '') +
      ' onclick="return go(\'' + item[0] + '\')">' + item[1] + '</button>';
  }).join('');
  return (
    '<div class="admin-wrap"><div class="admin-frame">' +
    '<nav class="admin-sidebar" aria-label="管理画面メニュー">' +
    '<div class="brand"><img src="' + LOGO + '" alt="銀松苑ロゴ"><span class="brand-name">銀松苑 管理</span></div>' +
    nav +
    '<button type="button" class="nav-item" style="font-size:13px;color:#8FA491;" onclick="return go(\'\')">‹ 受付画面へ</button>' +
    '<div class="admin-staff">スタッフ:' + esc(S.staff) + '</div>' +
    '</nav><main class="admin-content">' + contentHtml + '</main></div></div>'

/** 保存済みPINの再検証を全メニューで共有し、連続タップ時の競合を防ぐ。 */
function verifySavedAdminPin(savedPin) {
  if (S.adminVerifyPromise) return S.adminVerifyPromise;
  S.adminVerifying = true;
  S.adminVerifyPromise = rpc('apiVerifyAdmin', savedPin).then(function (res) {
    S.adminVerified = true;
    S.adminPin = savedPin;
    S.pinConfigured = res.pinConfigured;
    return res;
  }).catch(function (err) {
    S.adminVerified = false;
    S.adminPin = '';
    sessionStorage.removeItem('adminPin');
    throw err;
  }).finally(function () {
    S.adminVerifying = false;
    S.adminVerifyPromise = null;
  });
  return S.adminVerifyPromise;
}

  var savedPin = sessionStorage.getItem('adminPin');

function vitalsChartSvg(recordsAll) {
  var recent = recordsAll.slice(-8);
  var n = recent.length;
  function x(i) { return n <= 1 ? 270 : 60 + (i * 420) / (n - 1); }
  function y(v) {
    var c = Math.max(55, Math.min(145, v));
    return 150 - ((c - 60) * 90) / 80;
  }
  function pts(pick) {
    return recent.map(function (r, i) { return x(i) + ',' + y(pick(r)); }).join(' ');
  }
  var body = '';
  if (n > 0) {
    body =
      '<polyline points="' + pts(function (r) { return r.systolic; }) + '" fill="none" stroke="#2E7D32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></polyline>' +
      '<polyline points="' + pts(function (r) { return r.diastolic; }) + '" fill="none" stroke="#5B5EA6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></polyline>' +
      '<polyline points="' + pts(function (r) { return r.pulse; }) + '" fill="none" stroke="#D5688E" stroke-width="3" stroke-dasharray="1 7" stroke-linecap="round"></polyline>' +
      '<text x="' + x(0) + '" y="170" font-size="11" fill="#7A8A7D">' + shortDate(recent[0].date) + '</text>' +
      (n > 2 ? '<text x="' + x(Math.floor((n - 1) / 2)) + '" y="170" font-size="11" fill="#7A8A7D">' + shortDate(recent[Math.floor((n - 1) / 2)].date) + '</text>' : '') +
      (n > 1 ? '<text x="' + x(n - 1) + '" y="170" font-size="11" fill="#7A8A7D" text-anchor="end">' + shortDate(recent[n - 1].date) + '</text>' : '');
  } else {
    body = '<text x="270" y="90" font-size="13" fill="#7A8A7D" text-anchor="middle">記録がありません</text>';
  }
  return (
    '<svg viewBox="0 0 520 180" style="width:100%;height:auto;">' +
    '<line x1="40" y1="20" x2="40" y2="150" stroke="#DCE5DB" stroke-width="1"></line>' +

function barColor(ratio) {
  if (ratio >= 0.85) return '#2E7D32';
  if (ratio >= 0.6) return '#5B9E58';
  if (ratio >= 0.4) return '#9CC29A';
  return '#C4DAC2';
}

var lastResults = null; // CSV出力用キャッシュ

function renderAdminResults(app, renderId) {
  if (!S.admin.userId) S.admin.userId = S.users.length ? S.users[0].id : '';

  rpc('apiGetUserResults', S.admin.userId, S.admin.month).then(function (res) {
    if (!isCurrentRender(renderId)) return;
    lastResults = res;
    var user = null;
    S.users.forEach(function (u) { if (u.id === S.admin.userId) user = u; });
    var months = res.months.length ? res.months : [S.admin.month];

    // 種目別実施回数
    var counts = {};
    res.monthExercises.forEach(function (e) { counts[e.exerciseId] = (counts[e.exerciseId] || 0) + 1; });
    var countRows = S.exercises
      .map(function (ex) { return { ex: ex, count: counts[ex.id] || 0 }; })
      .filter(function (x) { return x.count > 0; })
      .sort(function (a, b) { return b.count - a.count; });
    var maxCount = 1;
    countRows.forEach(function (x) { if (x.count > maxCount) maxCount = x.count; });

    var barsHtml = countRows.length
      ? countRows.map(function (x) {
          return (
            '<div class="bar-row"><span class="bar-label">' + esc(x.ex.name) + '</span>' +
            '<div class="bar-track"><div class="bar-fill" style="width:' + (x.count / maxCount) * 100 + '%;background:' + barColor(x.count / maxCount) + ';"></div></div>' +
            '<span class="bar-count">' + x.count + '</span></div>'
          );
        }).join('')
      : '<div class="empty-note">この月の実施記録はありません</div>';

    // 日別実施記録(日付降順)
    var days = buildDays(res);
    var tableRows = days.map(function (d, i) {
      var last = i === days.length - 1 ? ' last' : '';
      var vitalTxt = d.vital
        ? d.vital.systolic + '/' + d.vital.diastolic + ' · P' + d.vital.pulse + ' · ' + d.vital.temp.toFixed(1) + '℃'
        : '—';
      var flag = d.vital && d.vital.flagged
        ? ' <span class="flag-mark" title="' + esc(d.vital.alerts.join(' / ')) + '">⚑</span>' : '';
      return (
        '<div class="td date' + last + '">' + dayLabel(d.date) + '</div>' +
        '<div class="td' + last + '">' + (d.checkin ? esc(d.checkin.time) : '') + '</div>' +
        '<div class="td' + last + '">' + vitalTxt + flag + '</div>' +
        '<div class="td' + last + '">' + (d.exercises.map(exerciseLabel).join(' → ') || '—') + '</div>' +
        '<div class="td note' + last + '">' + esc(d.note) + '</div>'
      );
    }).join('');

    var userSel = S.users.map(function (u) {
      return '<option value="' + u.id + '"' + (u.id === S.admin.userId ? ' selected' : '') + '>' + esc(u.name) + '</option>';
    }).join('');
    var monthSel = months.map(function (m) {
      return '<option value="' + m + '"' + (m === S.admin.month ? ' selected' : '') + '>' + monthLabel(m) + '</option>';
    }).join('');

    var content =
      '<div class="admin-page-head"><div><div class="breadcrumb">利用者別 実績</div>' +
      '<div class="admin-h1">' +
      (user
        ? esc(user.name) + ' さま <span class="attrs">' + user.age + '歳 · ' + esc(user.careLevel) + ' · ' + esc(user.scheduleLabel) + ' 利用</span>'
        : '利用者がいません') +
      '</div></div>' +
      '<div class="admin-actions">' +
      '<select class="select-plain" onchange="Actions.adminUser(this.value)" aria-label="利用者選択">' + userSel + '</select>' +
      '<select class="select-plain" onchange="Actions.adminMonth(this.value)" aria-label="対象月選択">' + monthSel + '</select>' +
      '<button class="btn-csv" onclick="Actions.exportCsv()">CSV出力</button>' +
      '</div></div>' +
      '<div class="admin-grid">' +
      '<div class="panel"><div class="panel-title">血圧・脈拍の推移 <span class="sub">直近8回</span></div>' +
      vitalsChartSvg(res.vitalsAll) + '</div>' +
      '<div class="panel"><div class="panel-title">種目別 実施回数 <span class="sub">' + monthLabel(S.admin.month) + '</span></div>' +
      '<div class="bar-rows">' + barsHtml + '</div></div></div>' +
      '<div class="panel"><div class="panel-title">日別 実施記録</div>' +
      '<div class="day-table">' +

      tableRows + '</div>' +
      (days.length === 0 ? '<div class="empty-note">この月の来所記録はありません</div>' : '') +
      '</div>';

    app.innerHTML = adminShell('admin', content);
  }).catch(function () {
    if (!isCurrentRender(renderId)) return;
    app.innerHTML = adminShell('admin', renderErrorHtml('利用者実績を読み込めませんでした', 'admin'));
  });
}

function buildDays(res) {
  var dateSet = {};
  res.monthCheckins.forEach(function (c) { dateSet[c.date] = true; });
  var dates = Object.keys(dateSet).sort().reverse();
  return dates.map(function (date) {
    var checkin = null;
    res.monthCheckins.forEach(function (c) { if (c.date === date && !checkin) checkin = c; });
    var vital = null;
    res.monthVitals.forEach(function (v) { if (v.date === date) vital = v; });
    var exercises = res.monthExercises
      .filter(function (e) { return e.date === date; })
      .sort(function (a, b) { return timeKey(a.time) < timeKey(b.time) ? -1 : 1; });
    var note = exercises.map(function (e) { return e.note; }).filter(String).join(' ');
    return { date: date, checkin: checkin, vital: vital, exercises: exercises, note: note };
  });
}

function defaultNotebookComment(data) {
  var notes = data.exercises.map(function (e) { return e.note; }).filter(String);
  var parts = [];
  if (data.exercises.length) {
    parts.push('本日は' + data.exercises.length + '種目の運動に取り組まれました。');
  } else {
    parts.push('本日も体調に配慮しながら、無理のない範囲で過ごしていただきました。');
  }
  if (data.vital && data.vital.conditionNote) parts.push(data.vital.conditionNote);
  if (notes.length) parts.push(notes.join(' '));
  if (data.cognitiveRecords && data.cognitiveRecords.length) {
    parts.push('脳トレは「' + data.cognitiveRecords.map(function (r) { return r.activity; }).join('、') + '」を実施しました。');
  }
  if (parts.length === 1 && data.exercises.length) parts.push('最後までしっかりと体を動かしていただきました。');
  return parts.join('');
}

function renderCommunicationBook(app, renderId) {
  if (!S.admin.notebookUserId) S.admin.notebookUserId = S.users.length ? S.users[0].id : '';
  if (!S.admin.notebookDate) S.admin.notebookDate = S.today;
  app.innerHTML = adminShell('admin/notebook', loadingHtml());
  rpc('apiGetCommunicationBook', S.admin.notebookUserId, S.admin.notebookDate).then(function (data) {
    if (!isCurrentRender(renderId)) return;
    S.notebook.data = data;
    if (!S.notebook.comment) S.notebook.comment = defaultNotebookComment(data);
    var userSel = S.users.map(function (u) {
      return '<option value="' + u.id + '"' + (u.id === S.admin.notebookUserId ? ' selected' : '') + '>' + esc(u.name) + '</option>';
    }).join('');

      ? data.exercises.map(function (r, i) {

      '<button class="btn-csv" onclick="Actions.printNotebook()">🖨 印刷</button></div></div>' +
      '<div class="notebook-tools no-print"><label class="btn-outline">📷 写真を選ぶ<input type="file" accept="image/*" capture="environment" onchange="Actions.notebookPhoto(this.files[0])" hidden></label>' +
      '<button class="select-plain" onclick="Actions.resetNotebookComment()">文章を自動作成し直す</button>' +

      '<section class="communication-sheet' + (densePrint ? ' compact-print' : '') + '" aria-label="弐番館デイサービス連絡帳">' +
      '<header class="notebook-head"><div class="notebook-brand"><img src="' + LOGO + '" alt=""><div><small>機能訓練デイサービス</small><h1>弐番館 連絡帳</h1></div></div>' +
      '<div class="notebook-meta"><div><small>お名前</small><strong>' + esc(data.user.name) + ' 様</strong></div><div><small>ご利用日</small><strong>' + esc(notebookDateLabel(data.date)) + '</strong></div></div></header>' +
      '<p class="notebook-thanks">本日もご利用いただきありがとうございます。</p>' +
      '<div class="notebook-layout"><div class="notebook-left">' +
      '<section class="notebook-box program"><h2>本日のプログラム</h2><ol>' + programs + '</ol>' +
      '<div class="notebook-vitals"><b>' + attendance + '</b><span>' + vital + '</span></div></section>' +

      '<section class="notebook-box family"><h2>ご家族より</h2><div class="family-lines"><span></span><span></span><span></span></div></section>' +
      '</div><section class="notebook-box photo"><h2>本日のご様子</h2><div id="notebook-photo">' + photoHtml + '</div></section></div>' +

var Actions = {

          type: 'info', userId: userId,

  // --- バイタル ---
  vInput: function (key, value) {
    var clean = value.replace(/[^0-9.]/g, '');
    var dot = clean.indexOf('.');
    S.vDraft[key] = dot < 0 ? clean : clean.slice(0, dot + 1) + clean.slice(dot + 1).replace(/\./g, '');
    S.vitalConfirmed = false;
    Actions.vRefresh();
  },
  vCondition: function (value) {
    S.vDraft.conditionNote = value.slice(0, 300);
  },
  precautionConfirm: function (checked) {
    S.precautionConfirmed = checked;
    Actions.vRefresh();
  },
  vRefresh: function () {
    var alerts = evaluateVitalAlerts(S.vDraft, S.prevVital);
    var errors = vitalValidationErrors(S.vDraft);
    var box = document.getElementById('v-alerts');
    if (box) {
      var errorHtml = errors.map(function (msg) {
        return '<div class="toast-error" role="alert"><span class="x-circle">!</span><span class="t-sub">' + esc(msg) + '</span></div>';
      }).join('');
      var alertHtml = alerts.map(function (msg) {
        return '<div class="alert-banner" role="alert"><span class="alert-dot"></span><span class="alert-text">' + esc(msg) + '</span></div>';
      }).join('');
      var confirmHtml = alerts.length
        ? '<label class="safety-confirm"><input type="checkbox" ' + (S.vitalConfirmed ? 'checked' : '') + ' onchange="Actions.vConfirm(this.checked)">' +
          '<span><strong>職員による確認済み</strong><small>運動を開始できる状態か確認しました</small></span></label>'
        : '';
      box.innerHTML = errorHtml + alertHtml + confirmHtml;
      box.style.display = (alerts.length || errors.length) ? 'flex' : 'none';
      box.style.flexDirection = 'column';
      box.style.gap = '12px';
    }
    // 必須は血圧・脈拍・体温のみ(SpO2・体重は任意)
    var requiredLabels = { systolic: '血圧(上)', diastolic: '血圧(下)', pulse: '脈拍', temp: '体温' };
    var missing = Object.keys(requiredLabels).filter(function (k) { return S.vDraft[k] === ''; });
    var hint = document.getElementById('v-hint');
    var user = currentUser();
    var precautionPending = !!(user && String(user.precautions || '').trim() && !S.precautionConfirmed);
    if (hint) {
      hint.textContent = missing.length
        ? 'あと入力: ' + missing.map(function (k) { return requiredLabels[k]; }).join('・')
        : (precautionPending
          ? '運動の禁止事項・注意点を確認してください'
          : (alerts.length && !S.vitalConfirmed ? '「職員による確認済み」にチェックすると保存できます' : ''));
    }
    var btn = document.getElementById('v-save');
    if (btn) btn.disabled = missing.length > 0 || errors.length > 0 || precautionPending || (alerts.length > 0 && !S.vitalConfirmed);
  },
  vConfirm: function (checked) {
    S.vitalConfirmed = checked;
    Actions.vRefresh();
  },
  vReset: function () {
    S.vDraft = { systolic: '', diastolic: '', pulse: '', temp: '', spo2: '', weight: '', conditionNote: '' };
    S.vitalConfirmed = false;
    S.precautionConfirmed = false;
    render();
  },
  vSave: function () {
    var alerts = evaluateVitalAlerts(S.vDraft, S.prevVital);
    if (vitalValidationErrors(S.vDraft).length || (alerts.length && !S.vitalConfirmed)) return;
    var btn = document.getElementById('v-save');
    if (btn) { btn.disabled = true; btn.textContent = '保存中…'; }
    var payload = { userId: S.currentUserId };
    ['systolic', 'diastolic', 'pulse', 'temp', 'spo2', 'weight'].forEach(function (k) {
      payload[k] = S.vDraft[k];
    });
    payload.conditionNote = (S.vDraft.conditionNote || '').trim();
    rpc('apiSaveVitals', payload).then(function (rec) {
      S.vDraft = null;
      S.vitalConfirmed = false;
      S.lastSaved = { kind: 'vitals', id: rec.id, label: 'バイタルを記録しました' };
      S.todayStatusCache = null; // メニューの状況表示を最新化
      go('menu');
    }).catch(function (e) {
      showSaveError('保存できませんでした。電波状況をご確認のうえ、もう一度お試しください');
      if (btn) { btn.disabled = false; btn.textContent = 'バイタルを保存'; }
    });
  },

  pickExercise: function (exerciseId) {
    S.toast = null;
    go('exercise/' + exerciseId);
  },
  backToScan: function () {
    S.exDraft = null;
    go('exercise');
  },
  exSeg: function (key, value) {
    S.exDraft[key] = value;
    document.querySelectorAll('[data-seg="' + key + '"]').forEach(function (el) {
      var selected = el.getAttribute('data-val') === value;
      el.classList.toggle('selected', selected);
      el.setAttribute('aria-pressed', selected ? 'true' : 'false');
    });

  },

    S.exDraft.note = value;
  },
  exRefresh: function () {
    var btn = document.getElementById('ex-save');
    if (btn) btn.disabled = !(S.exDraft.amount && S.exDraft.load);
  },
  exSave: function () {
    var btn = document.getElementById('ex-save');
    if (btn) { btn.disabled = true; btn.textContent = '保存中…'; }
    rpc('apiSaveExercise', {
      userId: S.currentUserId,
      exerciseId: S.exDraft.exerciseId,
      amount: S.exDraft.amount,
      load: S.exDraft.load,

    }).then(function (res) {

      S.lastSaved = { kind: 'records', id: res.record.id, label: (ex ? ex.name : '種目') + 'を記録しました' };
      if (res.todayExercises) {
        S.exerciseCache[S.currentUserId] = { data: res.todayExercises, expires: Date.now() + 15000 };
      } else {
        var cachedExercises = S.exerciseCache[S.currentUserId];
        var nextExercises = cachedExercises && cachedExercises.data ? cachedExercises.data.slice() : [];
        nextExercises.push(res.record);
        S.exerciseCache[S.currentUserId] = { data: nextExercises, expires: Date.now() + 15000 };
      }
      S.exDraft = null;
      S.todayStatusCache = null; // メニューの状況表示を最新化
      go('exercise');
    }).catch(function (e) {
      showSaveError('保存できませんでした。電波状況をご確認のうえ、もう一度お試しください');
      if (btn) { btn.disabled = false; btn.textContent = 'この内容で記録する'; }
    });
  },

  undoLast: function () {
    var last = S.lastSaved;

    rpc('apiVoidRecord', last.kind, last.id).then(function () {
      delete S.exerciseCache[S.currentUserId];
      S.todayStatusCache = null;
      render();

      S.lastSaved = last;
      showSaveError('取り消しできませんでした。もう一度お試しください');

  dismissSnackbar: function () {

    var bar = document.getElementById('snackbar');
    if (bar) bar.remove();
  },

  // --- 利用者一覧 ---
  filterUsers: function (query) {
    S.userQuery = (query || '').replace(/\s/g, '');
    Actions.applyUserFilters();
  },
  userFilter: function (mode) {
    S.userFilterMode = mode;
    document.querySelectorAll('.filter-chips .chip').forEach(function (el) {
      el.classList.toggle('selected', el.getAttribute('data-filter') === mode);
    });
    Actions.applyUserFilters();
  },
  applyUserFilters: function () {
    var q = S.userQuery || '';
    var mode = S.userFilterMode || 'all';
    var visible = 0;
    document.querySelectorAll('.person-row.tappable[data-state]').forEach(function (el) {
      var name = el.getAttribute('data-name') || '';
      var state = el.getAttribute('data-state');
      var hasAlert = el.getAttribute('data-alert') === '1';
      var show = (!q || name.indexOf(q) >= 0) &&
        (mode === 'all' || (mode === 'today' && state === 'checked') || (mode === 'alert' && hasAlert));
      el.hidden = !show;
      if (show) visible++;
    });
    // 空になったかなグループの見出しも隠す

  saveCognitive: function (userId) {

      .catch(function (e) { if (err) err.textContent = (e && e.message) || '保存できませんでした'; });

      .catch(function (e) { if (err) err.textContent = (e && e.message) || '保存できませんでした'; });

    if (!file) return;
    if (!/^image\//.test(file.type)) { alert('画像ファイルを選択してください'); return; }
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var max = 1600;
      var ratio = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      var canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(img.naturalWidth * ratio));
      canvas.height = Math.max(1, Math.round(img.naturalHeight * ratio));
      var ctx = canvas.getContext('2d');
      if (!ctx) { URL.revokeObjectURL(url); alert('写真を処理できませんでした'); return; }
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      S.notebook.photo = canvas.toDataURL('image/jpeg', 0.82);
      URL.revokeObjectURL(url);
      var box = document.getElementById('notebook-photo');
      if (box) box.innerHTML = '<img src="' + S.notebook.photo + '" alt="本日のご様子">';
    };
    img.onerror = function () { URL.revokeObjectURL(url); alert('写真を読み込めませんでした。JPEGまたはPNGをご利用ください'); };

    var user = null;
    S.users.forEach(function (u) { if (u.id === S.admin.userId) user = u; });
    var days = buildDays(lastResults).slice().reverse();
    var header = ['日付', '来苑時刻', '帰苑時刻', '送迎区分', '収縮期血圧', '拡張期血圧', '脈拍', '体温', 'SpO2', '体重', '体調・特記事項', 'アラート', '実施種目', '所見'];
    var rows = days.map(function (d) {
      return [
        d.date,
        d.checkin ? d.checkin.time : '',
        d.checkin ? d.checkin.checkoutTime || '' : '',
        d.checkin ? d.checkin.transport || '' : '',
        d.vital ? d.vital.systolic : '', d.vital ? d.vital.diastolic : '',
        d.vital ? d.vital.pulse : '', d.vital ? d.vital.temp : '',
        d.vital && d.vital.spo2 != null ? d.vital.spo2 : '',
        d.vital && d.vital.weight != null ? d.vital.weight : '',
        d.vital ? d.vital.conditionNote || '' : '',
        d.vital ? d.vital.alerts.join(' / ') : '',
        d.exercises.map(function (e) { return exerciseLabel(e) + '(' + e.load + ')'; }).join(' → '),
        d.note,
      ];
    });
    var csv = [header].concat(rows).map(function (r) {
      return r.map(function (c) {
        var value = String(c);
        if (/^[=+\-@]/.test(value)) value = "'" + value;
        return '"' + value.replace(/"/g, '""') + '"';
      }).join(',');
    }).join('\r\n');
    var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '実績_' + (user ? user.name.replace(/\s/g, '') : '') + '_' + S.admin.month + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  },
};
