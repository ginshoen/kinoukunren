<!DOCTYPE html>
<html lang="ja">
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="format-detection" content="telephone=no" />
    <style>
:root {
  /* Primary — 銀松苑グリーン */
  --green: #176b52;
  --green-dark: #0d4c3a;
  --green-l1: #82d9b8;
  --green-l2: #49ad86;
  --green-l3: #9fd8c1;
  --green-l4: #d4ebe1;
  /* 訓練モード */
  --purple: #5b5ea6;
  --purple-dark: #43468c;
  --purple-pale: #efeffa;
  /* アラート */
  --alert: #d5688e;
  --alert-bg: #fbeff3;
  --alert-border: #f0cbd8;
  --alert-text: #8a4560;
  /* 背景 */
  --page: #f1f4ef;
  --card-face: #fbfcfa;
  --input-bg: #f1f5f0;
  --subtle-bg: #fcfdfb;
  --sidebar: #142d24;
  --camera: #12231d;
  /* ボーダー */
  --border: #dce5db;
  --border-success: #bfdcbe;
  --border-undone: #c9d5c8;
  /* テキスト */
  --text: #14231d;
  --text-sub: #354b41;
  --text-aux: #52665c;
  --text-success: #4a6b4d;
  --text-disabled: #9aa89c;
  /* 成功背景 */
  --success-bg: #e3f1e1;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  background: radial-gradient(circle at 12% -10%, rgba(130,217,184,.2), transparent 32rem), var(--page);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

a {
  color: var(--green);
}
a:hover {
  color: var(--green-dark);
}

button {
  font-family: inherit;
  border: none;
  background: none;
  padding: 0;
  margin: 0;
  cursor: pointer;
  color: inherit;
}

input,
textarea,
select {
  font-family: inherit;
  color: inherit;
}

/* ---------- モバイル画面フレーム(390px カード) ---------- */
.phone-wrap {
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 24px 12px 48px;
}

.phone {
  width: 100%;
  max-width: 390px;
  background: var(--card-face);
  border-radius: 28px;
  /* overflow:hidden だと下部タブバーの sticky が効かないため、
     角丸はヘッダー/タブバー側に持たせる */
  overflow: visible;
  box-shadow: 0 12px 40px rgba(31, 42, 34, 0.14);
  border: 1px solid var(--border);
  /* タブバーを最下部へ寄せるための縦フレックス */
  display: flex;
  flex-direction: column;
}
.phone-body { flex: 1 1 auto; }
.phone > .phone-header:first-child { border-radius: 27px 27px 0 0; }
.phone > :last-child { border-radius: 0 0 27px 27px; }
.phone > .phone-body:last-child { border-radius: 0 0 27px 27px; }

/* ---------- 下部タブバー(受付/利用者/管理) ---------- */
.tab-bar {
  position: sticky;
  bottom: 0;
  z-index: 40;
  display: flex;
  gap: 4px;
  background: var(--card-face);
  border-top: 1px solid var(--border);
  padding: 6px 10px calc(6px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -4px 16px rgba(31, 42, 34, 0.06);
}
.tab-item {
  flex: 1 1 0;
  min-height: 56px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  border: 0;
  border-radius: 14px;
  background: transparent;
  cursor: pointer;
  font-family: inherit;
  font-size: 11.5px;
  font-weight: 800;
  letter-spacing: 0.04em;
  color: var(--text-aux);
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s, color 0.15s;
}
.tab-item svg { width: 24px; height: 24px; }
.tab-item.active {
  color: var(--green);
  background: var(--green-l4);
}
.tab-item:active { transform: scale(0.96); }
@media print { .tab-bar { display: none !important; } }
/* 管理画面: PC幅ではサイドバーがあるためタブバーは出さない。
   admin-wrap 直下のタブバーは画面下に固定する */
.admin-wrap > .tab-bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  border-radius: 0;
}
.admin-wrap { padding-bottom: 76px; }
@media (min-width: 901px) {
  .admin-wrap > .tab-bar { display: none; }
  .admin-wrap { padding-bottom: 0; }
}

/* ---------- 管理画面: スマホ用ヘッダー ---------- */
/* PCではサイドバーを使うため非表示。スマホでは横スクロールタブの代わりに
   「‹ 管理メニュー」+ 現在の機能名を固定表示する */
.admin-mobile-head { display: none; }
@media (max-width: 900px) {
  .admin-sidebar { display: none !important; }
  .admin-mobile-head {
    position: sticky;
    top: 0;
    z-index: 35;
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--green);
    color: #fff;
    padding: 12px 16px;
    padding-top: calc(12px + env(safe-area-inset-top, 0px));
  }
  .admin-mobile-head .back-btn {
    flex: none;
    width: 42px;
    height: 42px;
    border: 0;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.16);
    color: #fff;
    font-size: 24px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
  }
  .admin-mobile-head .h-sub {
    font-size: 11px;
    opacity: 0.85;
    letter-spacing: 0.06em;
  }
  .admin-mobile-head .h-title {
    font-size: 18px;
    font-weight: 800;
  }
}

@media (max-width: 430px) {
  .phone-wrap {
    padding: 0;
  }
  .phone {
    max-width: none;
    border-radius: 0;
    border: none;
    min-height: 100dvh;
  }
  .phone > .phone-header:first-child,
  .phone > :last-child,
  .phone > .phone-body:last-child { border-radius: 0; }
}

.phone-header {
  background: var(--green);
  color: #fff;
  padding: 18px 20px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.phone-header.training {
  background: var(--purple);
  padding: 16px 20px;
}

.phone-header.compact {
  padding: 16px 20px;
}

.phone-header .logo {
  height: 34px;
  width: 34px;
  background: #fff;
  border-radius: 99px;
  padding: 2px;
  object-fit: contain;
}

.phone-header .back-btn {
  font-size: 22px;
  color: #fff;
  line-height: 1;
  padding: 4px 6px;
  margin-left: -6px;
  min-width: 44px;
  min-height: 44px;
  display: flex;
  align-items: center;
}

.phone-header .h-sub {
  font-size: 12px;
  opacity: 0.85;
}
.phone-header .h-title {
  font-size: 19px;
  font-weight: 900;
}

.phone-header .h-right {
  margin-left: auto;
  text-align: right;
}

.pill-badge {
  background: rgba(255, 255, 255, 0.18);
  border-radius: 99px;
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 700;
}

.qr-read-badge {
  display: inline-block;
  background: rgba(255, 255, 255, 0.18);
  border-radius: 12px;
  padding: 6px 10px;
  font-size: 11px;
  font-weight: 700;
  text-align: center;
  line-height: 1.35;
}

.phone-body {
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* ---------- カメラビュー ---------- */
.camera-view {
  background: var(--camera);
  border-radius: 20px;
  height: 280px;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.camera-view video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.camera-dim {
  position: absolute;
  inset: 44px 64px;
  border-radius: 16px;
  box-shadow: 0 0 0 3000px rgba(0, 0, 0, 0.35);
}

.camera-corner {
  position: absolute;
  width: 28px;
  height: 28px;
}
.camera-corner.tl {
  top: 44px;
  left: 64px;
  border-top: 4px solid var(--green-l1);
  border-left: 4px solid var(--green-l1);
  border-radius: 6px 0 0 0;
}
.camera-corner.tr {
  top: 44px;
  right: 64px;
  border-top: 4px solid var(--green-l1);
  border-right: 4px solid var(--green-l1);
  border-radius: 0 6px 0 0;
}
.camera-corner.bl {
  bottom: 44px;
  left: 64px;
  border-bottom: 4px solid var(--green-l1);
  border-left: 4px solid var(--green-l1);
  border-radius: 0 0 0 6px;
}
.camera-corner.br {
  bottom: 44px;
  right: 64px;
  border-bottom: 4px solid var(--green-l1);
  border-right: 4px solid var(--green-l1);
  border-radius: 0 0 6px 0;
}

.camera-hint {
  color: #b7c9b8;
  font-size: 15px;
  font-weight: 700;
  position: relative;
  text-align: center;
  padding: 0 24px;
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
}

.capture-wrap {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 14px;
  display: flex;
  justify-content: center;
  z-index: 2;
}

.capture-btn {
  background: var(--green);
  color: #fff;
  border-radius: 99px;
  min-height: 48px;
  padding: 0 24px;
  font-size: 16px;
  font-weight: 900;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
}
.capture-btn:active {
  background: var(--green-dark);
}

/* ---------- トースト ---------- */
.toast-success {
  background: var(--success-bg);
  border: 1px solid var(--border-success);
  border-radius: 16px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  text-align: left;
}

.toast-success .check-circle {
  width: 44px;
  height: 44px;
  flex: none;
  border-radius: 99px;
  background: var(--green);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 900;
}

.toast-success .t-title {
  font-size: 17px;
  font-weight: 900;
}
.toast-success .t-sub {
  font-size: 13px;
  color: var(--text-success);
}

.toast-error {
  background: var(--alert-bg);
  border: 1px solid var(--alert-border);
  border-radius: 16px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.toast-error .x-circle {
  width: 44px;
  height: 44px;
  flex: none;
  border-radius: 99px;
  background: var(--alert);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: 900;
}

.toast-error .t-title {
  font-size: 15px;
  font-weight: 900;
  color: var(--alert-text);
}
.toast-error .t-sub {
  font-size: 13px;
  color: var(--alert-text);
}

/* ---------- リスト ---------- */
.section-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 8px;
}
.section-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-sub);
}
.section-note {
  font-size: 13px;
  color: var(--text-aux);
}

.row-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.person-row {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 44px;
}

.person-row.pending {
  border: 1px dashed var(--border-undone);
  opacity: 0.65;
}

.status-dot {
  width: 10px;
  height: 10px;
  flex: none;
  border-radius: 99px;
  background: var(--green);
}
.person-row.pending .status-dot {
  background: var(--border-undone);
}

.person-name {
  font-size: 15px;
  font-weight: 700;
}
.person-care {
  font-size: 12px;
  color: var(--text-aux);
}
.person-time {
  margin-left: auto;
  font-size: 13px;
  color: var(--text-success);
  font-weight: 700;
}
.person-row.pending .person-time {
  color: var(--text-disabled);
  font-weight: 400;
}

/* ---------- カード ---------- */
.card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 14px 16px;
}

.card-label {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-sub);
}
.card-label .unit {
  font-weight: 400;
  color: var(--text-aux);
}

/* ---------- バイタル入力 ---------- */
.bp-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.bp-title {
  font-size: 15px;
  font-weight: 900;
}
.bp-unit {
  font-size: 12px;
  color: var(--text-aux);
}
.bp-prev {
  margin-left: auto;
  font-size: 12px;
  color: var(--text-aux);
}

.bp-inputs {
  display: flex;
  gap: 10px;
  align-items: center;
}
.bp-slash {
  color: var(--text-disabled);
  font-size: 20px;
  font-weight: 700;
}

.num-box {
  flex: 1;
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 8px;
  text-align: center;
}
.num-box:focus-within {
  border: 2px solid var(--green);
  padding: 7px;
}
.num-box .nb-label {
  font-size: 11px;
  color: var(--text-aux);
}
.num-box input {
  width: 100%;
  border: none;
  background: transparent;
  outline: none;
  text-align: center;
  font-size: 30px;
  font-weight: 900;
  padding: 0;
  color: var(--text);
}
.num-box input::placeholder {
  color: var(--text-disabled);
  font-weight: 700;
}

.vitals-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.vital-cell {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 12px 14px;
}
.vital-cell:focus-within {
  border: 2px solid var(--green);
  padding: 11px 13px;
}
.vital-cell input {
  width: 100%;
  border: none;
  background: transparent;
  outline: none;
  font-size: 28px;
  font-weight: 900;
  padding: 0;
  color: var(--text);
}
.vital-cell input::placeholder {
  color: var(--text-disabled);
  font-weight: 700;
}
.vital-prev {
  font-size: 11px;
  color: var(--text-aux);
}

/* ---------- アラート ---------- */
.alert-banner {
  background: var(--alert-bg);
  border: 1px solid var(--alert-border);
  border-radius: 14px;
  padding: 10px 14px;
  display: flex;
  gap: 10px;
  align-items: center;
}
.alert-dot {
  width: 10px;
  height: 10px;
  flex: none;
  border-radius: 99px;
  background: var(--alert);
}
.alert-text {
  font-size: 13px;
  color: var(--alert-text);
  font-weight: 700;
}

/* ---------- ボタン ---------- */
.btn-row {
  display: flex;
  gap: 10px;
}

.btn-outline {
  flex: 1;
  background: #fff;
  border: 2px solid var(--green);
  color: var(--green);
  border-radius: 14px;
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 900;
}
.btn-outline:active {
  background: var(--input-bg);
}

.btn-primary {
  flex: 2;
  background: var(--green);
  color: #fff;
  border-radius: 14px;
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  font-weight: 900;
  box-shadow: 0 6px 16px rgba(46, 125, 50, 0.3);
}
.btn-primary:active {
  background: var(--green-dark);
}
.btn-primary:disabled {
  opacity: 0.5;
  box-shadow: none;
}

.btn-training {
  background: var(--purple);
  color: #fff;
  border-radius: 14px;
  min-height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 900;
  box-shadow: 0 6px 16px rgba(91, 94, 166, 0.3);
  width: 100%;
}
.btn-training:active {
  background: var(--purple-dark);
}
.btn-training:disabled {
  opacity: 0.5;
  box-shadow: none;
}

.link-plain {
  font-size: 13px;
  font-weight: 700;
  color: var(--green);
  text-align: center;
  padding: 8px;
  min-height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  width: 100%;
}

/* ---------- セグメント選択 ---------- */
.segment-row {
  display: flex;
  gap: 8px;
}

.segment {
  flex: 1;
  min-height: 48px;
  border: 1px solid var(--border);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 700;
  background: var(--input-bg);
  color: var(--text);
}
.segment.small {
  font-size: 15px;
}
.segment.selected {
  border: 2px solid var(--purple);
  background: var(--purple-pale);
  color: var(--purple-dark);
  font-weight: 900;
}

/* ---------- テキストエリア ---------- */
.note-area {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 12px;
  min-height: 64px;
  padding: 10px 12px;
  font-size: 14px;
  background: var(--subtle-bg);
  resize: vertical;
  outline: none;
}
.note-area:focus {
  border: 2px solid var(--purple);
  padding: 9px 11px;
}
.note-area::placeholder {
  color: var(--text-aux);
}

/* ---------- 実施状況リスト ---------- */
.exercise-row {
  background: var(--success-bg);
  border: 1px solid var(--border-success);
  border-radius: 12px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 44px;
}
.exercise-row .check {
  color: var(--green);
  font-weight: 900;
}
.exercise-row .ex-name {
  font-size: 14px;
  font-weight: 700;
}
.exercise-row .ex-summary {
  margin-left: auto;
  font-size: 12px;
  color: var(--text-success);
}

.exercise-row.undone {
  background: #fff;
  border: 1px dashed var(--border-undone);
  opacity: 0.7;
}
.exercise-row.undone .check {
  color: var(--text-disabled);
  font-weight: 400;
}
.exercise-row.undone .ex-summary {
  color: var(--text-disabled);
}

/* ---------- モーダル(手動選択フォールバック) ---------- */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(31, 42, 34, 0.5);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 50;
}
.modal-sheet {
  background: var(--card-face);
  border-radius: 20px 20px 0 0;
  width: 100%;
  max-width: 430px;
  max-height: 70dvh;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.modal-title {
  font-size: 16px;
  font-weight: 900;
}
.modal-row {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 48px;
  width: 100%;
  text-align: left;
  font-size: 15px;
  font-weight: 700;
}
.modal-row:active {
  background: var(--input-bg);
}

/* ---------- 管理者 PC 画面 ---------- */
.admin-wrap {
  min-height: 100dvh;
  padding: 24px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.admin-frame {
  width: 100%;
  max-width: 1180px;
  background: var(--card-face);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 12px 40px rgba(31, 42, 34, 0.14);
  border: 1px solid var(--border);
  display: flex;
  min-height: 720px;
}

.admin-sidebar {
  width: 220px;
  flex: none;
  background: var(--sidebar);
  color: var(--border);
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.admin-sidebar .brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 8px 16px;
}
.admin-sidebar .brand img {
  height: 30px;
  width: 30px;
  background: #fff;
  border-radius: 99px;
  padding: 2px;
  object-fit: contain;
}
.admin-sidebar .brand-name {
  font-size: 15px;
  font-weight: 900;
  color: #fff;
}

.nav-item {
  padding: 10px 12px;
  font-size: 14px;
  border-radius: 10px;
  color: var(--border);
  text-align: left;
  width: 100%;
  cursor: pointer;
  touch-action: manipulation;
}
@media (hover: hover) and (pointer: fine) {
  .nav-item:hover {
    background: rgba(255, 255, 255, 0.08);
  }
}
.nav-item:active {
  transform: translateY(1px);
}
.nav-item.active {
  background: var(--green);
  color: #fff;
  font-weight: 700;
}

.admin-staff {
  margin-top: auto;
  padding: 10px 12px;
  font-size: 13px;
  color: #8fa491;
}

.admin-content {
  flex: 1;
  padding: 24px 28px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  min-width: 0;
}

.admin-page-head {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.breadcrumb {
  font-size: 13px;
  color: var(--text-aux);
}
.admin-h1 {
  font-size: 24px;
  font-weight: 900;
}
.admin-h1 .attrs {
  font-size: 14px;
  color: var(--text-aux);
  font-weight: 700;
}

.admin-actions {
  margin-left: auto;
  display: flex;
  gap: 8px;
  align-items: center;
}

.select-plain {
  border: 1px solid var(--border);
  background: #fff;
  border-radius: 10px;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 700;
  outline: none;
  cursor: pointer;
}

.btn-csv {
  background: var(--green);
  color: #fff;
  border-radius: 10px;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 700;
}
.btn-csv:hover {
  background: var(--green-dark);
}

.admin-grid {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 18px;
}
@media (max-width: 900px) {
  .admin-grid {
    grid-template-columns: 1fr;
  }
  .admin-frame {
    flex-direction: column;
  }
  .admin-sidebar {
    width: 100%;
    flex-direction: row;
    flex-wrap: wrap;
    align-items: center;
  }
  .admin-staff {
    margin-top: 0;
    margin-left: auto;
  }
}

.panel {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px 20px;
}

.panel-title {
  font-size: 15px;
  font-weight: 900;
  margin-bottom: 12px;
}
.panel-title .sub {
  font-size: 12px;
  color: var(--text-aux);
  font-weight: 400;
}

.legend {
  display: flex;
  gap: 16px;
  margin-top: 8px;
  font-size: 12px;
  color: var(--text-sub);
  flex-wrap: wrap;
}
.legend span {
  display: flex;
  align-items: center;
  gap: 6px;
}
.legend .chip {
  flex: none;
  width: 14px;
  height: 3px;
  min-height: 0;
  border: 0;
  border-radius: 2px;
}

/* 横棒グラフ */
.bar-rows {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.bar-row {
  display: grid;
  grid-template-columns: 110px 1fr 30px;
  gap: 10px;
  align-items: center;
}
.bar-label {
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.bar-track {
  background: var(--page);
  border-radius: 6px;
  height: 18px;
}
.bar-fill {
  height: 100%;
  border-radius: 6px;
  transition: width 0.4s ease;
}
.bar-count {
  font-size: 13px;
  font-weight: 900;
  text-align: right;
}

/* 日別テーブル */
.day-table {
  display: grid;
  grid-template-columns: 90px 70px 110px 1fr 1fr;
  font-size: 13px;
}
.day-table .th {
  padding: 8px 10px;
  font-weight: 700;
  color: var(--text-aux);
  border-bottom: 2px solid var(--border);
}
.day-table .td {
  padding: 10px;
  border-bottom: 1px solid var(--page);
}
.day-table .td.date {
  font-weight: 700;
}
.day-table .td.note {
  color: var(--text-sub);
}
.day-table .td.last {
  border-bottom: none;
}

.flag-mark {
  color: var(--alert);
  font-weight: 900;
}

/* 汎用テーブル(本日の記録一覧など) */
.gen-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.gen-table th {
  text-align: left;
  padding: 8px 10px;
  font-weight: 700;
  color: var(--text-aux);
  border-bottom: 2px solid var(--border);
}
.gen-table td {
  padding: 10px;
  border-bottom: 1px solid var(--page);
}

/* QR発行カード */
.qr-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px;
}
.qr-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 10px;
  display: grid;
  grid-template-columns: minmax(96px, 43%) minmax(0, 1fr);
  align-items: center;
  gap: 14px;
  text-align: center;
  aspect-ratio: 91 / 55;
  overflow: hidden;
}
.qr-code {
  width: 100%;
  max-width: 136px;
  aspect-ratio: 1;
  display: grid;
  place-items: center;
}
.qr-code img,
.qr-code canvas {
  width: 100% !important;
  height: auto !important;
  aspect-ratio: 1;
}
.qr-card .qr-name {
  font-size: 17px;
  font-weight: 900;
}
.qr-card .qr-sub {
  font-size: 12px;
  color: var(--text-aux);
}
/* 券面の補足情報(利用曜日・介護度)。名前の下に小さく並べる */
.qr-card .qr-card-copy {
  min-width: 0;
  text-align: left;
}
.qr-card .qr-meta {
  display: flex;
  align-items: baseline;
  gap: 6px;
  margin-top: 4px;
  font-size: 12px;
  line-height: 1.3;
  white-space: nowrap;
}
.qr-card .qr-meta-key {
  color: var(--text-aux);
  font-size: 11px;
  white-space: nowrap;
}
.qr-card .qr-meta-val {
  font-weight: 700;
}

.empty-note {
  font-size: 13px;
  color: var(--text-aux);
  padding: 8px 0;
}

@media print {
  .admin-sidebar,
  .admin-page-head .admin-actions,
  .no-print {
    display: none !important;
  }
  .admin-wrap {
    padding: 0;
  }
  .admin-frame {
    box-shadow: none;
    border: none;
  }
}

.compact-intro h1 { font-size:20px; }

.modal-head { display:flex; align-items:flex-start; justify-content:space-between; }

.search-box { min-height:50px; display:flex; align-items:center; gap:9px; padding:0 14px; border:1px solid var(--border); border-radius:14px; background:#fff; color:var(--text-aux); }
.search-box input { width:100%; border:0; outline:0; background:transparent; font-size:16px; }
.camera-view {

.capture-wrap { bottom: 24px; }

}

/* ---------- 追加UI: スナックバー・保存ヒント・infoトースト ---------- */
.snackbar {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--sidebar);
  color: #fff;
  border-radius: 14px;
  padding: 12px 14px;
  box-shadow: 0 6px 16px rgba(31, 42, 34, 0.3);
  animation: slide-in 0.25s cubic-bezier(0.2, 0.8, 0.3, 1);
}
.snack-text { font-size: 14px; font-weight: 700; flex: 1; }
.snack-undo {
  color: #ffd98e;
  font-size: 14px;
  font-weight: 900;
  min-height: 44px;
  padding: 0 10px;
}
.snack-close { color: #8fa491; font-size: 14px; min-height: 44px; min-width: 44px; }

.save-hint {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-aux);
  text-align: center;
  min-height: 18px;
}

.toast-success.toast-info { background: #e7f0f7; border-color: #c3d8e8; }
.toast-success.toast-info .check-circle { background: #38648c; }
.toast-success.toast-info .t-sub { color: #38648c; }

@keyframes slide-in {
  from { opacity: 0; transform: translateY(-6px); }
}
/* ---------- ライブ読取: 検出フィードバック ---------- */
.camera-view.detected .camera-corner {
  border-color: #fff;
  filter: drop-shadow(0 0 6px rgba(123, 198, 126, 0.9));
}
.camera-view.detected {
  box-shadow: inset 0 0 0 4px var(--green-l1);
}
.detected-badge {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  background: var(--green);
  color: #fff;
  font-size: 17px;
  font-weight: 900;
  padding: 12px 22px;
  border-radius: 99px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
  z-index: 3;
  animation: badge-pop 0.25s cubic-bezier(0.2, 0.8, 0.3, 1);
}
@keyframes badge-pop {
  from { opacity: 0; transform: translate(-50%, -50%) scale(0.7); }
}
/* 撮影/起動ボタンを縦並びに(Chrome iOS 用ライブ起動ボタン追加のため) */
.capture-wrap {
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.capture-btn.live {
  background: #fff;
  color: var(--green-dark);
}
/* ---------- 利用者一覧・詳細 ---------- */
.list-controls {
  position: sticky; top: 0; z-index: 5;
  background: var(--card-face);
  display: flex; flex-direction: column; gap: 10px;
  padding: 4px 0 10px;
}
.filter-chips { display: flex; gap: 8px; }
.chip {
  flex: 1; min-height: 44px; border-radius: 99px;
  border: 1px solid var(--border); background: #fff;
  font-size: 14px; font-weight: 700; color: var(--text-sub);
}
.chip.selected {
  border: 2px solid var(--green); background: var(--green-l4);
  color: var(--green-dark); font-weight: 900;
}
.chip-alert.selected {
  border-color: var(--alert); background: var(--alert-bg); color: var(--alert-text);
}
.kana-head {
  position: sticky; top: 112px; z-index: 4;
  font-size: 13px; font-weight: 900; color: var(--text-aux);
  background: var(--card-face); padding: 4px 2px;
}
.person-row.tappable { width: 100%; text-align: left; min-height: 60px; }
.person-row.tappable:active { background: var(--input-bg); }
.person-main { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
.person-row.tappable .person-name { font-size: 17px; }
.person-row.tappable .person-time { flex: none; margin-left: 8px; }
.person-row.offday { background: rgba(255, 255, 255, 0.7); }
.person-row.offday .status-dot { background: transparent; border: 2px solid var(--border-undone); }
.person-row.offday .person-time { color: var(--text-disabled); font-weight: 400; }
.chev { flex: none; color: var(--text-disabled); font-size: 20px; margin-left: 2px; }
.badge-alert {
  flex: none; min-width: 30px; height: 30px;
  display: grid; place-items: center; border-radius: 99px;
  background: var(--alert-bg); border: 1px solid var(--alert-border);
  color: var(--alert); font-size: 15px; font-weight: 900;
}

/* 利用者詳細 */
.today-card { display: flex; flex-direction: column; gap: 8px; }
.today-status { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 900; }
.today-status.absent { color: var(--text-aux); font-weight: 700; }
.today-vitals { font-size: 15px; color: var(--text-sub); }
.today-vitals b { font-size: 18px; color: var(--text); }
.vital-cell.stat { display: flex; flex-direction: column; gap: 2px; }
.stat-value { font-size: 26px; font-weight: 900; line-height: 1.2; }
.history-day { display: flex; flex-direction: column; gap: 4px; padding: 12px 16px; }
.history-date { font-size: 14px; font-weight: 900; }
.history-ex { font-size: 14px; color: var(--text-sub); }
.history-note {
  font-size: 13px; color: var(--text-aux); background: var(--subtle-bg);
  border-radius: 8px; padding: 6px 10px;
}
/* ---------- 利用者管理フォーム ---------- */
.form-grid { display: flex; flex-direction: column; gap: 12px; }
.form-grid label { font-size: 14px; font-weight: 700; color: var(--text-sub); display: block; }
.form-grid input, .form-grid select { display: block; width: 100%; margin-top: 4px; }
.check-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.check-item {
  display: flex; align-items: center; gap: 6px;
  border: 1px solid var(--border); border-radius: 10px;
  padding: 8px 12px; min-height: 44px; background: #fff;
  font-size: 14px; font-weight: 700; cursor: pointer;
}
.check-item input { width: 20px; height: 20px; accent-color: var(--green); }
.check-item:has(input:checked) { border: 2px solid var(--green); background: var(--green-l4); }
.btn-danger {
  background: var(--alert-bg); color: var(--alert-text);
  border: 1px solid var(--alert-border); border-radius: 10px;
  padding: 8px 14px; font-size: 13px; font-weight: 700; min-height: 40px;
}
.btn-danger[data-confirm="1"] { background: var(--alert); color: #fff; }
.footer-links { display: flex; justify-content: center; gap: 4px; }
.footer-links .link-plain { width: auto; padding: 8px 12px; color: var(--text-aux); font-size: 13px; }

/* ========================================================================== */
/* Responsive hardening                                                       */
/* ========================================================================== */

html {
  width: 100%;
  min-width: 0;
  overflow-x: hidden;
  overflow-x: clip;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body,
#app {
  width: 100%;
  max-width: 100%;
  min-width: 0;
  min-height: 100%;
}

body {
  overflow-x: hidden;
  overflow-x: clip;
}

img,
svg,
canvas,
video {
  max-width: 100%;
}

button,
input,
select,
textarea {
  min-width: 0;
  max-width: 100%;
}

.phone-wrap,
.phone,
.phone-body,
.phone-body > *,
.admin-wrap,
.admin-frame,
.admin-content,
.admin-grid,
.panel {
  min-width: 0;
}

.phone-header {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
}

.phone-header > :not(.logo):not(.back-btn):not(.h-right) {
  min-width: 0;
}

.phone-header .h-title,
.phone-header .h-sub,
.screen-intro h1,
.screen-intro p,
.toast-success,
.toast-error,
.alert-text {
  overflow-wrap: anywhere;
}

.phone-header .h-right {
  min-width: 0;
  margin-left: 0;
}

.camera-view { height: 390px; }
.camera-frame {
  position: absolute;
  top: 18px;
  left: 50%;
  width: min(62%, 230px);
  aspect-ratio: 1;
  transform: translateX(-50%);
  border-radius: 16px;
  box-shadow: 0 0 0 3000px rgba(0, 0, 0, 0.35);
  pointer-events: none;
  z-index: 1;
}
.camera-frame .camera-corner.tl { top: 0; left: 0; right: auto; bottom: auto; }
.camera-frame .camera-corner.tr { top: 0; right: 0; left: auto; bottom: auto; }
.camera-frame .camera-corner.bl { bottom: 0; left: 0; right: auto; top: auto; }
.camera-frame .camera-corner.br { bottom: 0; right: 0; left: auto; top: auto; }

.camera-hint,
.capture-wrap {
  max-width: 100%;
}

.modal-sheet {
  width: 100%;
  max-width: min(460px, calc(100vw - 36px));
}

.admin-page-head > :first-child,
.admin-actions {
  min-width: 0;
}

.panel {
  overflow-x: auto;
  overscroll-behavior-inline: contain;
  -webkit-overflow-scrolling: touch;
}

.gen-table {
  min-width: 660px;
}

.day-table {
  min-width: 680px;
}

.qr-grid {
  /* 券面に利用曜日・介護度も入るため、1枚あたりの最小幅を広めに取る */
  grid-template-columns: repeat(auto-fit, minmax(min(268px, 100%), 1fr));
}

@media (max-width: 900px) {
  .admin-frame {
    flex-direction: column;
  }

  .admin-sidebar {
    width: 100%;
    max-width: 100%;
    flex-direction: row;

/* ---------- 連絡帳 作成・A4横印刷 ---------- */
.notebook-tools {

  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;

  border: 1px solid var(--border);
  border-radius: 14px;

}
.notebook-tools .btn-outline { flex: none; min-height: 42px; padding: 0 16px; }
.notebook-count { margin-left: auto; font-weight: 800; color: var(--green-dark); }
.notebook-count.warn { color: var(--alert-text); }
.communication-sheet {
  width: 100%;
  max-width: 1120px;
  margin: 0 auto;
  padding: 28px 32px 18px;
  background: #fff;
  border: 1px solid #d8ded8;
  border-radius: 18px;
  box-shadow: 0 16px 42px rgba(20,45,36,.12);
  color: #17231d;
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
}
.notebook-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 24px;
  padding-bottom: 12px;
  border-bottom: 2px solid #2d5c4b;
}
.notebook-brand { display: flex; align-items: center; gap: 12px; }
.notebook-brand img { width: 54px; height: 54px; object-fit: contain; }
.notebook-brand small { color: var(--green); font-weight: 900; letter-spacing: .08em; }
.notebook-brand h1 { margin: 0; font-size: 30px; line-height: 1.1; letter-spacing: .04em; }
.notebook-meta { display: flex; gap: 22px; }
.notebook-meta div { min-width: 210px; padding: 6px 10px; border-bottom: 1px solid #8fa49b; }
.notebook-meta small { display: block; color: #5f7068; font-weight: 700; }
.notebook-meta strong { display: block; font-size: 17px; margin-top: 2px; }
.notebook-thanks { margin: 12px 0; font-size: 17px; font-weight: 900; }
.notebook-layout { display: grid; grid-template-columns: 1.1fr .9fr; gap: 14px; }
.notebook-left { display: grid; grid-template-rows: auto 1fr auto; gap: 12px; min-width: 0; }
.notebook-box { position: relative; border: 2px solid #d8ded8; border-radius: 13px; padding: 22px 18px 14px; min-width: 0; }
.notebook-box h2 {
  position: absolute;
  top: -15px;
  left: 22px;
  margin: 0;
  padding: 5px 16px;
  border-radius: 8px;
  font-size: 16px;
  line-height: 1.2;
}
.notebook-box.program { border-color: #ef927c; }
.notebook-box.program h2 { background: #f6b3a3; }
.notebook-box.facility { border-color: #e7bb48; min-height: 118px; }
.notebook-box.facility h2 { background: #ffd75c; }
.notebook-box.family { border-color: #86a94b; min-height: 96px; }
.notebook-box.family h2 { background: #8eae4f; color: #122111; }
.notebook-box.photo { border-color: #31a8c2; min-height: 470px; padding: 24px 16px 14px; }
.notebook-box.photo h2 { background: #27a8c8; color: #042c35; }
.notebook-box.program ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.notebook-box.program li { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: center; min-height: 28px; }
.notebook-box.program li > span { width: 24px; height: 24px; border-radius: 99px; display: grid; place-items: center; background: #fff1ee; color: #a44836; font-weight: 900; }
.notebook-box.program li b { font-size: 15px; }
.notebook-box.program li small { color: #59675f; }
.notebook-box.program li.planned { opacity: .68; }
.notebook-box.program li.planned b { grid-column: 1 / -1; }
.notebook-vitals { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #d5dcd7; display: grid; gap: 2px; font-size: 11px; color: #4f6258; }
.notebook-comment { min-height: 76px; line-height: 1.75; font-size: 14px; outline: none; white-space: pre-wrap; }
.notebook-comment:focus { background: #fff9e8; box-shadow: 0 0 0 3px rgba(231,187,72,.25); border-radius: 6px; }
.family-lines { display: grid; gap: 22px; padding-top: 12px; }
.family-lines span { display: block; border-bottom: 1px solid #b9c7bc; }
#notebook-photo { width: 100%; height: 100%; min-height: 420px; display: grid; place-items: center; overflow: hidden; border-radius: 8px; background: #eef6f7; }
#notebook-photo img { width: 100%; height: 100%; max-height: 450px; object-fit: cover; border-radius: 8px; }
.notebook-photo-empty { display: grid; place-items: center; gap: 5px; color: #55808a; text-align: center; }
.notebook-photo-empty span { font-size: 44px; font-weight: 900; opacity: .25; }
.notebook-photo-empty small { max-width: 180px; }
.notebook-footer { margin-top: 8px; text-align: right; color: #607069; font-size: 10px; }

@media (max-width: 900px) {
  .communication-sheet { padding: 20px; border-radius: 14px; overflow-x: auto; }
  .notebook-head { align-items: flex-start; flex-direction: column; }
  .notebook-meta { width: 100%; flex-direction: column; gap: 4px; }
  .notebook-meta div { min-width: 0; }
  .notebook-layout { grid-template-columns: 1fr; }
  .notebook-box.photo { min-height: 360px; }

.precaution-label { display: block; margin-bottom: 3px; font-size: 12px; font-weight: 900; letter-spacing: .04em; }

@media (max-width: 600px) {
  .notebook-count { width: 100%; margin-left: 0; }

  .day-table .th { display: none; }
  .day-table .td {
    display: grid;
    grid-template-columns: 74px minmax(0, 1fr);
    gap: 8px;
    padding: 7px 10px;
    border-inline: 1px solid var(--border);
    border-bottom: 0;
  }
  .day-table .td::before { color: var(--text-aux); font-size: 11px; font-weight: 800; }
  .day-table .td:nth-child(5n + 1) { margin-top: 12px; border-top: 1px solid var(--border); border-radius: 12px 12px 0 0; }
  .day-table .td:nth-child(5n + 1)::before { content: '日付'; }
  .day-table .td:nth-child(5n + 2)::before { content: '来所'; }
  .day-table .td:nth-child(5n + 3)::before { content: 'バイタル'; }
  .day-table .td:nth-child(5n + 4)::before { content: '実施種目'; }
  .day-table .td:nth-child(5n + 5) { border-bottom: 1px solid var(--border); border-radius: 0 0 12px 12px; }
  .day-table .td:nth-child(5n + 5)::before { content: '所見'; }
  .gen-table { min-width: 0; }

  .gen-table, .gen-table tbody, .gen-table tr, .gen-table td { display: block; width: 100%; }
  .gen-table tr { margin: 12px 0; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; background: #fff; }
  .gen-table td { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 8px; padding: 6px 0; border: 0; white-space: normal !important; }
  /* ラベルは JS が thead から data-label に転記する(表ごとの列ずれ防止) */
  .gen-table td::before {
    content: attr(data-label);
    color: var(--text-aux);
    font-size: 11px;
    font-weight: 800;

  .gen-table td[data-label=''] { display: block; }
  .gen-table td[data-label='']::before { content: none; }
  /* 帰苑登録などの操作類はラベルの下に全幅で並べ、はみ出させない */
  .gen-table .checkout-controls {

  display: inline-block; flex: none;
  padding: 2px 9px; border-radius: 99px;
  background: var(--input-bg); border: 1px solid var(--border);
  font-size: 11px; font-weight: 900; color: var(--text-aux);
}
.role-badge.admin {
  background: var(--green-l4); border-color: var(--green-l3); color: var(--green-dark);
}
.signed-in-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding-top: 4px; border-top: 1px solid var(--border);
}
.signed-in-name { font-size: 13px; font-weight: 700; color: var(--text-aux); }
.signed-in-bar .link-plain { width: auto; padding: 8px 10px; font-size: 13px; }


/* ---------- 入力・操作の体感速度 ---------- */
.pin-placeholder { font-size: 14px; font-weight: 700; color: var(--text-aux); }
.pin-count { font-size: 13px; font-weight: 700; color: var(--text-aux); margin-left: 6px; }
.pin-display { flex-wrap: wrap; }

/* タップ待ち・ハイライトを消して反応を速く見せる */
button, a, input, select, textarea, .person-row, .menu-action, .exercise-row, .segment, .chip {
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.pin-key, .segment, .menu-action, .person-row.tappable, .chip {
  transition: background-color .08s linear, border-color .08s linear, transform .06s linear;
}
.pin-key:active { transform: scale(.96); background: var(--green-l4); }


/* ---------- アプリ更新の案内 ---------- */
.update-banner {
  position: fixed;
  left: 12px; right: 12px;
  bottom: calc(12px + env(safe-area-inset-bottom));
  z-index: 100;
  display: flex; align-items: center; gap: 10px;
  background: var(--sidebar); color: #fff;
  border-radius: 14px; padding: 12px 14px;
  box-shadow: 0 8px 24px rgba(20, 45, 36, 0.35);
  font-size: 14px; font-weight: 700;
  animation: slide-in .25s cubic-bezier(.2, .8, .3, 1);
}
.update-banner span { flex: 1; }
.update-btn {
  flex: none; background: var(--green-l1); color: var(--green-dark);
  border-radius: 99px; padding: 8px 16px; min-height: 40px;
  font-size: 14px; font-weight: 900;
}
.update-close { flex: none; color: #8fa491; font-size: 14px; min-width: 32px; min-height: 40px; }
.build-tag { text-align: center; font-size: 11px; color: var(--text-disabled); }

/* ---------- 顔写真(アバター) ---------- */
.avatar {
  flex: none;
  border-radius: 50%;
  object-fit: cover;
  background: var(--green-l4);
  color: var(--green);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  overflow: hidden;
}
.avatar-sm { width: 36px; height: 36px; font-size: 15px; }
.avatar-md { width: 42px; height: 42px; font-size: 17px; border: 2px solid rgba(255,255,255,.65); }
.phone-header .avatar-md { background: rgba(255,255,255,.9); }
.avatar-lg {
  width: 104px; height: 104px; font-size: 40px;
  border: 3px solid #fff;
  box-shadow: 0 4px 14px rgba(20, 45, 36, 0.18);
}

/* ---------- 受付確認(QR読み取り直後の本人確認) ---------- */
.arrival-card { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 20px 16px; }
.arrival-photo { margin-top: 4px; }
.arrival-kana { font-size: 13px; color: var(--text-sub); font-weight: 700; }
.arrival-name { font-size: 24px; font-weight: 900; color: var(--green-dark); }
.arrival-status {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--green-l4); color: var(--green-dark);
  border-radius: 99px; padding: 8px 18px;
  font-size: 15px; font-weight: 800;
}
.arrival-status.info { background: #e8f0fa; color: #23538f; }
.arrival-status .check-circle {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--green); color: #fff;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 13px; flex: none;
}
.arrival-status.info .check-circle { background: #23538f; }
.arrival-grid { width: 100%; margin-top: 8px; display: flex; flex-direction: column; }
.arrival-row {
  display: flex; gap: 12px; padding: 9px 2px;
  border-top: 1px solid var(--border);
  font-size: 14px;
}
.arrival-label { flex: none; width: 72px; color: var(--text-sub); font-weight: 700; }
.arrival-value { flex: 1; font-weight: 700; word-break: break-word; }

/* ---------- 利用者管理: 顔写真欄 ---------- */
.photo-field { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
.photo-actions { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.user-cell { display: flex; align-items: center; gap: 10px; }

/* ---------- 連絡帳: 自動作成し直しのフィードバック ---------- */
.notebook-comment.flash { animation: notebook-flash .7s ease-out; }
@keyframes notebook-flash {
  0% { background: #ffe98a; }
  100% { background: transparent; }
}

/* ---------- 体調・特記事項などの選択チップ ---------- */
.cond-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.cond-chips .chip { flex: none; padding: 0 14px; text-align: left; min-height: 42px; }

/* ---------- 連絡帳: バイタル欄 ---------- */
.notebook-vital-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed #d5dcd7;
}
.nv-cell {
  display: grid;
  gap: 1px;
  padding: 5px 8px;
  border: 1px solid #e3e8e2;
  border-radius: 8px;
  background: #fbfdfb;
  text-align: center;
}
.nv-label { font-size: 10px; font-weight: 800; color: #5f7068; }
.nv-value { font-size: 15px; font-weight: 900; min-height: 20px; outline: none; }
.nv-value:focus { background: #fff9e8; border-radius: 4px; }
.nv-unit { font-size: 9px; color: #8a978f; }

/* ---------- 運動記録: 15分×4コマ ---------- */
.exercise-slots { display: grid; gap: 10px; }
.exercise-slot {
  display: grid;
  grid-template-columns: 34px 1fr 28px;
  align-items: center;
  gap: 10px;
  min-height: 62px;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #fbfdfb;
}
.exercise-slot.fixed { background: var(--green-l4); border-color: var(--green-l2); }
.slot-number { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: var(--green); color: #fff; font-weight: 900; }
.slot-main { min-width: 0; display: grid; gap: 2px; }
.slot-main small { color: var(--text-aux); font-size: 11px; }
.slot-main select, .form-select {
  width: 100%; min-height: 46px; padding: 9px 38px 9px 12px;
  border: 1px solid var(--border); border-radius: 10px; background: #fff; color: var(--text);
  font: inherit; font-size: 15px; font-weight: 700;
}
.form-select.compact { min-height: 42px; padding-top: 7px; padding-bottom: 7px; }
.menu-done { color: var(--green); font-weight: 900; text-align: center; }

/* ---------- 脳トレ: 数値入力・推移 ---------- */
.cognitive-metric-grid { display: grid; grid-template-columns: 1fr 1fr .75fr; gap: 10px; margin-top: 10px; }
.cognitive-metric-grid label { display: grid; gap: 5px; color: var(--text-sub); font-size: 12px; font-weight: 700; }
.cognitive-metric-grid input {
  width: 100%; min-height: 44px; padding: 8px 10px; border: 1px solid var(--border);
  border-radius: 10px; background: var(--input-bg); color: var(--text); font: inherit; font-size: 16px; font-weight: 800;
}
.input-with-unit { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 5px; }
.input-with-unit b { color: var(--text-aux); }
.trend-card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin-bottom: 10px; }
.trend-card { min-width: 0; padding: 10px 12px 6px; background: #fff; border: 1px solid var(--border); border-radius: 14px; }
.trend-title { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 900; }
.trend-title span { color: var(--text-aux); font-size: 11px; font-weight: 600; }
.numeric-trend-svg { width: 100%; height: auto; }
.numeric-trend-svg text { fill: #7a8a7d; font-size: 11px; }
.numeric-trend-svg .trend-latest { fill: var(--green-dark); font-weight: 900; }
.admin-trends { grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); }

/* ---------- 体力測定: 種目別一括グリッド ---------- */
.assessment-wide-wrap { align-items: flex-start; }
.phone.assessment-wide { max-width: 1040px; }
.assessment-item-select { display: grid; grid-template-columns: minmax(180px, 1fr) auto; align-items: end; gap: 8px 16px; }
.assessment-item-select .card-label { grid-column: 1 / -1; }
.auto-date { color: var(--text-aux); font-size: 12px; white-space: nowrap; }
.assessment-grid { display: grid; gap: 8px; }
.assessment-grid-head, .assessment-grid-row {
  display: grid; grid-template-columns: minmax(180px, 1fr) minmax(140px, .7fr) minmax(220px, 1.2fr); gap: 10px; align-items: center;
}
.assessment-grid-head { padding: 0 14px; color: var(--text-aux); font-size: 12px; }
.assessment-grid-row { position: relative; padding: 11px 14px; background: #fff; border: 1px solid var(--border); border-radius: 13px; }
.assessment-person { display: flex; align-items: center; gap: 9px; min-width: 0; }
.assessment-person > span { min-width: 0; display: grid; }
.assessment-person b { font-size: 14px; }
.assessment-person small { color: var(--text-aux); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.assessment-grid-row label { display: grid; gap: 3px; color: var(--text-aux); font-size: 10px; }
.assessment-grid-row input { width: 100%; min-height: 42px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 9px; background: var(--input-bg); font: inherit; }
.assessment-saved { grid-column: 2 / -1; margin-top: -5px; color: var(--green-dark); font-size: 11px; font-weight: 700; }
.avatar-xs { width: 30px; height: 30px; font-size: 12px; }

.notebook-tools .is-processing { opacity: .55; pointer-events: none; }

@media (max-width: 700px) {
  .cognitive-metric-grid { grid-template-columns: 1fr 1fr; }
  .cognitive-metric-grid label:last-child { grid-column: 1 / -1; }
  .assessment-grid-head { display: none; }
  .assessment-grid-row { grid-template-columns: 1fr 1fr; }
  .assessment-person { grid-column: 1 / -1; }
  .assessment-saved { grid-column: 1 / -1; margin-top: 0; }
  .assessment-item-select { grid-template-columns: 1fr; }
  .assessment-item-select .card-label { grid-column: auto; }
}

@media print {
  body.results-print-mode .admin-wrap,
  body.results-print-mode .admin-frame,
  body.results-print-mode .admin-content { display: block !important; width: 100% !important; max-width: none !important; margin: 0 !important; padding: 0 !important; box-shadow: none !important; border: 0 !important; }
  body.results-print-mode .admin-mobile-head,
  body.results-print-mode .admin-sidebar,
  body.results-print-mode .admin-actions,
  body.results-print-mode .tab-bar { display: none !important; }
  body.results-print-mode .panel { break-inside: avoid; box-shadow: none; margin-bottom: 5mm; }
  body.results-print-mode .admin-grid { grid-template-columns: 1fr 1fr; gap: 5mm; }
  body.results-print-mode .admin-trends { grid-template-columns: 1fr 1fr; }
  body.results-print-mode .day-table { font-size: 9px; }
}

/**
 * 施設コード。管理者が配布するリンク( .../?c=ginshoen )に含まれる合言葉。
 * 一度開けば端末に保存されるので、ホーム画面から起動しても引き継がれる。
 * これがないとログイン画面の職員一覧を取得できない(第三者への氏名流出を防ぐ)。
 */
var FACILITY_CODE = (function () {
  var m = location.search.match(/[?&]c=([^&]+)/);
  var fromUrl = m ? decodeURIComponent(m[1]).trim() : '';
  if (fromUrl) {
    localStorage.setItem('facilityCode', fromUrl);
    return fromUrl;
  }
  return localStorage.getItem('facilityCode') || '';
})();

// 配布リンクの ?k= に含まれる端末トークン。一度開けば端末に保存され、以後は不要。
// トークンは公開ページには含めず、リンクだけで配る。
(function () {
  var m = location.search.match(/[?&]k=([^&]+)/);
  var fromUrl = m ? decodeURIComponent(m[1]).trim() : '';
  if (fromUrl) {
    localStorage.setItem('gasApiToken', fromUrl);
    window.GAS_API_TOKEN = fromUrl;
  }
  // URLに秘密情報を残さない(履歴・共有からの漏れを防ぐ)
  if (m && window.history && history.replaceState) {
    var clean = location.pathname + location.search.replace(/([?&])k=[^&]*/, '$1').replace(/[?&]$/, '').replace(/\?&/, '?') + location.hash;
    history.replaceState(null, '', clean);
  }
})();

// QR関連ライブラリは初期表示を止めないよう、必要になった時点で非同期読込する。
var OPTIONAL_SCRIPTS = {};
function loadScriptOnce(src, globalName) {
  if (window[globalName]) return Promise.resolve(window[globalName]);
  if (OPTIONAL_SCRIPTS[globalName]) return OPTIONAL_SCRIPTS[globalName];
  OPTIONAL_SCRIPTS[globalName] = new Promise(function (resolve, reject) {
    var script = document.createElement('script');
    script.src = src;
    script.async = true;
    script.onload = function () {
      if (window[globalName]) resolve(window[globalName]);
      else reject(new Error(globalName + 'を読み込めませんでした'));
    };
    script.onerror = function () { reject(new Error(globalName + 'を読み込めませんでした')); };
    document.head.appendChild(script);
  }).catch(function (err) {
    delete OPTIONAL_SCRIPTS[globalName];
    throw err;
  });
  return OPTIONAL_SCRIPTS[globalName];
}
function ensureQrDecoder() {
  return loadScriptOnce('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js', 'jsQR')
    .catch(function () {
      return loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js', 'jsQR');
    });
}

  return loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js', 'QRCode')

      return loadScriptOnce('https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js', 'QRCode');
    });
}

var RPC_CACHE = {};
var RPC_INFLIGHT = {};
var RPC_CACHE_EPOCH = 0;
var RPC_READ_TTL = {
  apiGetBootstrap: 300000,
  apiRefreshToday: 15000,
  apiGetVitalContext: 60000,
  apiGetTodayExercises: 45000,
  apiGetTodayAlerts: 60000,
  apiGetUserDetail: 45000,

  apiGetTodayRecords: 45000,
  apiGetMonthly: 60000,
  apiGetCommunicationBook: 15000,
  apiAdminGetStaff: 20000,
  apiGetStaffList: 60000,
};
function rpcCacheKey(name, args) {
  return name + ':' + JSON.stringify(args || []);
}
function clearRpcCache() {
  RPC_CACHE = {};
  RPC_CACHE_EPOCH += 1;
}
function delay(ms) {
  return new Promise(function (resolve) { setTimeout(resolve, ms); });
}
function fetchRpc(name, args) {
  var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
  var timeoutMs = RPC_READ_TTL[name] ? 12000 : 25000;
  var timeout = setTimeout(function () { if (controller) controller.abort(); }, timeoutMs);
  return fetch(window.GAS_API_URL, {
    method: 'POST',
    // Content-Type を text/plain のままにして CORS プリフライトを回避する
    body: JSON.stringify({
      fn: name, args: args,
      token: window.GAS_API_TOKEN || '',
      session: S.session || '', // 職員ログインのセッション(サーバー側で権限判定)
      facility: FACILITY_CODE,  // ログイン前APIの保護に使う施設コード
    }),
    signal: controller ? controller.signal : undefined,
  }).then(function (r) {
    if (!r.ok) throw new Error('通信エラー(' + r.status + ')');
    return r.json();
  }).then(function (res) {
    if (!res.ok) throw new Error(res.error || 'サーバーエラー');
    return res.data;
  }).catch(function (err) {
    if (err && err.name === 'AbortError') throw new Error('通信がタイムアウトしました');
    throw err;
  }).finally(function () { clearTimeout(timeout); });
}

function rpc(name) {
  var args = [].slice.call(arguments, 1);
  var ttl = RPC_READ_TTL[name] || 0;
  var key = rpcCacheKey(name, args);
  var requestEpoch = RPC_CACHE_EPOCH;
  var cached = RPC_CACHE[key];
  if (ttl && cached && cached.expires > Date.now()) return Promise.resolve(cached.data);
  if (ttl && RPC_INFLIGHT[key]) return RPC_INFLIGHT[key];

  var request;
  // ホスティング版: GAS の /exec を JSON API として呼ぶ(iOSライブカメラ対応構成)
  if (window.GAS_API_URL) {
    request = fetchRpc(name, args).catch(function (err) {
      // 読み取りだけを1回再試行。保存系は二重登録を避けるため自動再試行しない。
      if (!ttl || String(err && err.message || err).indexOf('認証') >= 0) throw err;
      return delay(350).then(function () { return fetchRpc(name, args); });
    });
  } else if (window.google && google.script && google.script.run) {
    // GAS版も apiCall 経由に統一し、サーバー側で権限を判定させる
    request = new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (e) { reject(e); })
        .apiCall(name, args, S.session || '', FACILITY_CODE);
    });
  } else {
    request = Mock.call(name, args); // ローカルプレビュー用モック
  }

  request = Promise.resolve(request).then(function (data) {
    if (ttl && requestEpoch === RPC_CACHE_EPOCH) RPC_CACHE[key] = { data: data, expires: Date.now() + ttl };
    else clearRpcCache();
    return data;
  }).finally(function () { delete RPC_INFLIGHT[key]; });
  if (ttl) RPC_INFLIGHT[key] = request;
  return request;
}

/** 未登録端末を管理者PINでGASへペアリングする。 */
function pairDeviceRpc(pin) {
  if (!window.GAS_API_URL) return Promise.reject(new Error('GAS URLが未設定です'));
  return fetch(window.GAS_API_URL, {
    method: 'POST',
    body: JSON.stringify({
      fn: 'apiPairDevice', args: [String(pin || '')], token: '',
      facility: FACILITY_CODE, // ペアリングも施設コードで保護する
    }),
  }).then(function (r) {
    if (!r.ok) throw new Error('通信エラー(' + r.status + ')');
    return r.json();
  }).then(function (res) {
    if (!res.ok) throw new Error(res.error || '端末を認証できませんでした');
    return res.data;
  });
}

/** 顔写真の一括取得(セッション中1回)。失敗しても画面はイニシャル表示で成立する */
function ensurePhotos() {
  if (!S.photosPromise) {

      S.photos = map || {};
      updateAvatars();
      return S.photos;
    }).catch(function () {
      S.photosPromise = null; // 次の画面表示時に再試行できるようにする
      return S.photos;
    });
  }
  return S.photosPromise;

/** 丸型の顔写真。未登録(または未取得)の間は氏名の頭文字を表示する */
function avatarHtml(user, cls) {
  var photo = user && S.photos[user.id];
  var base = 'avatar' + (cls ? ' ' + cls : '');
  if (photo) {
    return '<img class="' + base + '" data-avatar="' + esc(user.id) + '" data-has-photo="1" src="' + esc(photo) + '" alt="">';
  }
  var ch = String(user && user.name || '?').trim().charAt(0);
  return '<span class="' + base + '" data-avatar="' + esc(user ? user.id : '') + '" aria-hidden="true">' + esc(ch) + '</span>';
}

/** 写真の取得完了後、表示中のイニシャルを実写真に差し替える */
function updateAvatars() {
  var els = document.querySelectorAll('[data-avatar]');
  for (var i = 0; i < els.length; i++) {
    var el = els[i];
    var id = el.getAttribute('data-avatar');
    if (!id || el.getAttribute('data-has-photo') === '1' || !S.photos[id]) continue;
    var user = userById(id);
    if (!user) continue;
    var m = /(?:^|\s)avatar-(sm|md|lg)(?:\s|$)/.exec(el.className);
    el.outerHTML = avatarHtml(user, m ? 'avatar-' + m[1] : '');
  }
}
function exerciseById(id) {
  for (var i = 0; i < S.exercises.length; i++) if (S.exercises[i].id === id) return S.exercises[i];
  return null;
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function timeKey(t) { return ('00000' + t).slice(-5); }
function shortDate(date) {
  var p = date.split('-');
  return Number(p[1]) + '/' + Number(p[2]);
}
function dayLabel(date) {
  var d = new Date(date + 'T00:00:00');
  return (d.getMonth() + 1) + '/' + d.getDate() + '(' + WEEKDAYS[d.getDay()] + ')';
}
function monthLabel(m) {
  var p = m.split('-');
  return p[0] + '年' + Number(p[1]) + '月';
}
function nowClock() {
  var d = new Date();
  return {
    date: (d.getMonth() + 1) + '月' + d.getDate() + '日(' + WEEKDAYS[d.getDay()] + ')',
    time: d.getHours() + ':' + ('0' + d.getMinutes()).slice(-2),
  };
}

// バイタル閾値判定(サーバーと同一ロジック。ライブ表示用)
function evaluateVitalAlerts(draft, prev) {
  var alerts = [];
  var sys = Number(draft.systolic);
  if (draft.systolic !== '' && !isNaN(sys)) {
    if (sys >= 160) alerts.push('収縮期血圧が高値です(160以上)。運動可否を看護師に確認してください');
    else if (prev && sys - prev.systolic >= 20) alerts.push('収縮期血圧が前回より高めです。運動前に再測定を推奨');
  }
  var spo2 = Number(draft.spo2);
  if (draft.spo2 !== '' && !isNaN(spo2) && spo2 <= 92) alerts.push('SpO2が低めです(92%以下)。安静にして再測定してください');
  var temp = Number(draft.temp);
  if (draft.temp !== '' && !isNaN(temp) && temp >= 37.5) alerts.push('体温が高めです(37.5℃以上)。本日の運動可否を確認してください');
  return alerts;
}

var VITAL_LIMITS = {
  systolic: [60, 250], diastolic: [30, 150], pulse: [30, 220],
  temp: [30, 45], spo2: [50, 100], weight: [20, 250],
};
function vitalValidationErrors(draft) {
  var labels = { systolic: '収縮期血圧', diastolic: '拡張期血圧', pulse: '脈拍', temp: '体温', spo2: 'SpO2', weight: '体重' };
  var errors = [];
  Object.keys(VITAL_LIMITS).forEach(function (key) {
    if (draft[key] === '') return;
    var value = Number(draft[key]);
    var range = VITAL_LIMITS[key];
    if (!isFinite(value) || value < range[0] || value > range[1]) {
      errors.push(labels[key] + 'は' + range[0] + '〜' + range[1] + 'の範囲で入力してください');
    }
  });
  if (draft.systolic && draft.diastolic && Number(draft.diastolic) >= Number(draft.systolic)) {
    errors.push('下の血圧は上の血圧より小さい値にしてください');
  }
  return errors;
}

var Scanner = {
  stream: null, timer: null, video: null, lastValue: '', lastAt: 0, paused: false,
  onDetect: null, generation: 0, scanning: false, detectionTimer: null,
  mode: '', autoMode: '',
  /**
   * 画面表示時の準備のみ(カメラは起動しない)。
   * ライブスキャンは「スキャンを開始」ボタンのタップで起動し、
   * 一度開始した後は、読み取り→短時間静止→保存→次の読み取りを自動で繰り返す。

  prepare: function (onDetect, mode) {
    var self = this;

      toggle.setAttribute('data-bound', 'true');

        else {

          self.start(self.onDetect);
        }
      });
    }

    if (self.autoMode === self.mode && !self.stream && !self.timer) {

        if (self.autoMode === self.mode && document.getElementById('camera-view')) self.start(self.onDetect);
      }, 120);
    }
  },
  /** ライブスキャンを止めて「開始」待ちの状態に戻す */
  stopToIdle: function (message) {
    var video = this.video;
    this.stop();
    this.autoMode = '';
    if (video && video.parentNode) video.parentNode.removeChild(video);
    this.video = null;
    var toggle = document.getElementById('scan-toggle-btn');
    if (toggle) toggle.textContent = '📷 スキャンを開始';
    var resume = document.getElementById('camera-resume-btn');
    if (resume) resume.remove();
    var hint = document.getElementById('camera-hint');
    if (hint) hint.textContent = message || '「スキャンを開始」を押してください';
  },
  start: function (onDetect) {
    var self = this;
    // カメラ起動と並行してデコーダーを読み込む。初期画面の表示は待たせない。
    if (typeof jsQR !== 'function') ensureQrDecoder().catch(function () {});
    // 再入時は既存リソースを必ず解放する。iOSはカメラ同時1キャプチャ制約が
    // あるため、前回の stream が生きていると2回目以降の getUserMedia が
    // NotReadableError で恒久的に失敗する(「ボタンを押しても無反応」の主因)。
    if (self.timer) { clearInterval(self.timer); self.timer = null; }
    if (self.detectionTimer) { clearTimeout(self.detectionTimer); self.detectionTimer = null; }
    if (self.stream) { self.stream.getTracks().forEach(function (t) { t.stop(); }); self.stream = null; }
    if (self.video && self.video.parentNode) self.video.parentNode.removeChild(self.video);
    self.video = null; self.paused = false; self.scanning = false;
    var generation = ++self.generation;
    self.onDetect = onDetect;
    var view = document.getElementById('camera-view');
    self.bindCapture();
    // まずライブカメラを試行し、起動できた端末は連続読取。
    // GAS iframe で拒否される端末は撮影ボタンに自動フォールバックする。
    if (!view || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      self.fail(); return;
    }
    navigator.mediaDevices.getUserMedia({
      // QR読取には十分な解像度へ抑え、iPhoneでの発熱・フレーム落ちを防ぐ。

        }

        video.setAttribute('muted', ''); // WKWebViewはコンテンツ属性も参照する

        video.setAttribute('webkit-playsinline', '');

            if (hintEl) hintEl.textContent = 'タップしてカメラを開始';
            var retryPlay = function () {
              video.play().then(function () {
                view.removeEventListener('click', retryPlay);
                var h = document.getElementById('camera-hint');
                if (h) h.textContent = 'QRコードを枠内にかざしてください';
              }).catch(function () {});
            };
            view.addEventListener('click', retryPlay);
            return; // 許可は取得済みなので後続のスキャン準備は継続
          }
          throw err;
        });
      })
      .then(function () {
        if (generation !== self.generation || !self.video) return;
        var hintEl = document.getElementById('camera-hint');
        if (hintEl) hintEl.textContent = 'QRコードを枠内にかざしてください';
        var toggle = document.getElementById('scan-toggle-btn');
        if (toggle) toggle.textContent = '⏹ スキャンを停止';
        self.liveSince = Date.now();
        var canvas = document.createElement('canvas');
        var canvasCtx = canvas.getContext('2d', { willReadFrequently: true });

        self.timer = setInterval(function () {
          var v = self.video;
          if (!v || self.paused || self.scanning) return;
          if (v.readyState < 2) {
            // 1フレームも来ないまま15秒経過 = 起動失敗(「読取なし」とは区別して案内)
            if (Date.now() - self.liveSince > 15000) {
              self.suspend('カメラ映像を取得できませんでした。タップして再試行してください');
            }
            return;
          }
          self.scanning = true;
          var handle = function (value) {
            if (generation !== self.generation || self.paused) return;
            var now = Date.now();
            if (value === self.lastValue && now - self.lastAt < 2000) return;
            self.lastValue = value; self.lastAt = now;
            self.flash();
            self.detectionTimer = setTimeout(function () {
              self.detectionTimer = null;
              if (generation === self.generation) onDetect(value);
            }, 550);
          };
          var decodeWithJsQr = function () {
            var vw = v.videoWidth, vh = v.videoHeight;
            if (!vw || !vh || !canvasCtx || typeof jsQR !== 'function') return;
            // 正方形の読取枠周辺だけを512pxで解析。通常の黒QRを高速優先し、
            // 4回に1回だけ反転QRも試すことで速度と互換性を両立する。
            var source = Math.min(vw, vh);
            var size = Math.min(512, source);
            var sx = Math.round((vw - source) / 2);
            var sy = Math.round((vh - source) / 2);
            if (canvas.width !== size || canvas.height !== size) {
              canvas.width = size; canvas.height = size;
              canvasCtx = canvas.getContext('2d', { willReadFrequently: true });
            }
            canvasCtx.drawImage(v, sx, sy, source, source, 0, 0, size, size);
            self.decodeTick = (self.decodeTick || 0) + 1;
            var inversion = self.decodeTick % 4 === 0 ? 'attemptBoth' : 'dontInvert';
            var code = jsQR(canvasCtx.getImageData(0, 0, size, size).data, size, size, { inversionAttempts: inversion });
            if (code && code.data) handle(code.data);
          };
          if (detector) {
            detector.detect(v).then(function (codes) {
              if (generation !== self.generation || v !== self.video) return;
              if (codes.length) handle(codes[0].rawValue);
            }).catch(function () {
              if (generation !== self.generation) return;
              detector = null;
              decodeWithJsQr();
            }).then(function () { if (generation === self.generation) self.scanning = false; });
            return;
          }
          try { decodeWithJsQr(); } finally { self.scanning = false; }
        }, 250);
      })
      .catch(function (err) {
        if (generation !== self.generation) return;
        // 原因を画面に表示する(これまでは握りつぶしていて切り分け不能だった)
        var name = (err && err.name) || 'UnknownError';
        var guide = {
          NotAllowedError: 'カメラが許可されていません。iPhoneの「設定 → Chrome(またはSafari)→ カメラ」を許可にして、ページを再読み込みしてください',
          NotReadableError: 'カメラが他のアプリ・タブで使用中です。他のカメラ利用を閉じてから「ライブカメラを起動」を押してください',
          NotFoundError: 'この端末で利用できるカメラが見つかりません',
          OverconstrainedError: '背面カメラを起動できません。もう一度お試しください',
          SecurityError: 'この画面ではライブカメラを使えません。公開URL(ginshoen.github.io)から開いてください',
        }[name] || 'カメラを起動できませんでした';
        var hint = document.getElementById('camera-hint');
        if (hint) hint.textContent = guide + '(' + name + ')';
        self.fail(true);
      });
  },
  /**
   * ライブカメラ不可時のフォールバック。
   * GAS のウェブアプリは sandbox 付き iframe で配信されるため getUserMedia が
   * ブロックされる(Safari/Chrome共通)。その場で「撮影→写真をjsQRで解読」する
   * file capture 方式は iframe 内でも動作する。
   */
  fail: function (keepHint) {
    var hint = document.getElementById('camera-hint');
    if (hint && !keepHint) hint.textContent = 'ライブカメラを使えません。「写真から読み取る」をご利用ください';
    var toggle = document.getElementById('scan-toggle-btn');
    if (toggle) toggle.textContent = '📷 スキャンを開始';
    this.bindCapture();
  },
  /** 15秒無検出での自動停止(バッテリー配慮)。「開始」待ちに戻す */
  suspend: function (message) {
    this.stopToIdle(message || '読み取りがないため自動停止しました。「スキャンを開始」で再開できます');
  },
  bindCapture: function () {
    var self = this;
    var input = document.getElementById('capture-input');
    var button = document.getElementById('capture-btn');
    var hint = document.getElementById('camera-hint');
    if (!input || !button || input.getAttribute('data-bound') === 'true') return;
    input.setAttribute('data-bound', 'true');
    button.addEventListener('click', function () { input.click(); });
    input.addEventListener('change', function () {
      var file = input.files && input.files[0];
      input.value = '';
      if (!file || !self.onDetect) return;
      if (hint) hint.textContent = '読み取り中…';
      decodeQrFromFile(file).then(function (value) {
        if (value) {
          self.flash();
          self.onDetect(value);
        } else if (hint) {
          hint.textContent = 'QRを読み取れませんでした。枠いっぱいに写るよう撮り直してください';
        }
      });
    });
  },

   * 読取成功の瞬間に映像を静止し、「✓ 読み取りました」を表示する。
   * 成功時は画面遷移で自動的に解除、エラー時は resume() で再開する。
   */
  flash: function () {
    if (this.video) { try { this.video.pause(); } catch (e) {} }
    this.paused = true;
    var view = document.getElementById('camera-view');
    if (view && !view.querySelector('.detected-badge')) {
      view.classList.add('detected');
      var badge = document.createElement('div');
      badge.className = 'detected-badge';
      badge.setAttribute('role', 'status');
      badge.setAttribute('aria-live', 'assertive');
      badge.textContent = '✓ 読み取りました';
      view.appendChild(badge);
    }

  },
  resume: function () {
    var view = document.getElementById('camera-view');
    if (view) {
      view.classList.remove('detected');
      var badge = view.querySelector('.detected-badge');
      if (badge) badge.remove();
    }
    this.paused = false;
    if (this.video) { try { this.video.play(); } catch (e) {} }
  },
  stop: function () {
    this.generation += 1;
    if (this.timer) clearInterval(this.timer);
    if (this.detectionTimer) clearTimeout(this.detectionTimer);
    if (this.stream) this.stream.getTracks().forEach(function (t) { t.stop(); });
    this.timer = null; this.detectionTimer = null; this.stream = null; this.video = null; this.paused = false; this.scanning = false;
  },
};

/** 撮影した写真からQRを解読(複数スケールで試行) */
function decodeQrFromFile(file) {
  return new Promise(function (resolve) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var scales = [1000, 1600, 640];
      var result = null;
      for (var i = 0; i < scales.length && !result; i++) {
        var max = scales[i];
        var ratio = Math.min(1, max / Math.max(img.width, img.height));
        var w = Math.round(img.width * ratio);
        var h = Math.round(img.height * ratio);
        var canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        var ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0, w, h);
        try {
          var code = typeof jsQR === 'function' && jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'attemptBoth' });
          if (code && code.data) result = code.data;
        } catch (e) {}
      }
      URL.revokeObjectURL(url);
      resolve(result);
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      resolve(null);
    };
    img.src = url;
  });
}

 * 版番号(APP_BUILD)を見比べて、新しい版があればアプリ内から更新できるようにする。

var APP_BUILD = window.APP_BUILD || '';

function reloadApp() {
  var base = location.origin + location.pathname;
  // 保存済みデータを迂回するため、毎回異なるURLで読み直す
  location.replace(base + '?v=' + Date.now() + location.hash);
}

/** 公開中の版番号を確認し、新しければ更新の案内を出す */
function checkForUpdate() {
  if (!APP_BUILD) return; // GAS版は毎回サーバーから配信されるため不要
  fetch('version.txt?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.text() : ''; })
    .then(function (text) {
      var latest = String(text || '').trim();
      if (!latest || latest === APP_BUILD) return;
      showUpdateBanner(latest);
    })
    .catch(function () { /* オフライン時は何もしない */ });
}

function showUpdateBanner(latest) {
  if (document.getElementById('update-banner')) return;
  var bar = document.createElement('div');
  bar.id = 'update-banner';
  bar.className = 'update-banner';
  bar.innerHTML =
    '<span>新しいバージョンがあります</span>' +
    '<button class="update-btn" onclick="reloadApp()">今すぐ更新</button>' +
    '<button class="update-close" onclick="this.parentNode.remove()" aria-label="閉じる">✕</button>';

}

// ---------------------------------------------------------------- ルーター

function go(hash) {
  if (hash !== '') Scanner.autoMode = ''; // スキャナーは受付画面(空ハッシュ)でのみ使う
  var current = location.hash.replace(/^#\/?/, '');
  // 同じメニューをもう一度押した場合も再読み込みし、無反応に見えないようにする。
  if (current === hash) {
    render();
    return false;
  }
  location.hash = hash;
  return false;
}

window.addEventListener('hashchange', render);

/**
 * スマホ幅では表をカード形式に組み替える。その際の項目ラベルを
 * 各表の見出し(thead)から自動で付与する(表ごとの列ずれを防ぐ)。
 */
function labelGenTables() {
  document.querySelectorAll('table.gen-table').forEach(function (table) {
    var heads = [].map.call(table.querySelectorAll('thead th'), function (th) {
      return th.textContent.trim();
    });
    [].forEach.call(table.querySelectorAll('tbody tr'), function (tr) {
      [].forEach.call(tr.children, function (td, i) {
        var label = td.hasAttribute('colspan') ? '' : (heads[i] || '');
        if (td.getAttribute('data-label') !== label) td.setAttribute('data-label', label);
      });
    });
  });
}

function render() {
  var renderId = (S.renderId || 0) + 1;
  S.renderId = renderId;
  // 画面描画のたびに表ラベルを付け直す(非同期描画にも追従する)
  if (!S.tableObserver) {
    var appRoot = document.getElementById('app');
    if (appRoot) {
      S.tableObserver = new MutationObserver(labelGenTables);
      S.tableObserver.observe(appRoot, { childList: true, subtree: true });
    }
  }
  Scanner.stop();
  if (S.toastTimer) { clearTimeout(S.toastTimer); S.toastTimer = null; }
  if (S.arrivalTimer) { clearTimeout(S.arrivalTimer); S.arrivalTimer = null; }
  if (S.pollTimer) { clearInterval(S.pollTimer); S.pollTimer = null; }
  var app = document.getElementById('app');
  // 未ログインなら常にログイン画面(以降の画面はログイン後のみ)
  if (!S.me) return renderLogin(app);
  if (!S.ready) return;
  var h = location.hash.replace(/^#\/?/, '');
  // 管理画面は管理者のみ。現場職員には権限がない旨だけ表示する
  if (h.indexOf('admin') === 0 && !isAdmin()) return renderNoPermission(app);
  if (h === 'admin/menu') return renderAdminMenu(app);
  if (h === 'admin/staff') return renderAdminStaff(app, renderId);
  if (h === 'users') return renderUserList(app, renderId);
  if (h.indexOf('users/') === 0) return renderUserDetail(app, h.slice(6), renderId);
  if (h.indexOf('arrival/') === 0) return renderArrival(app, h.slice(8));
  if (h === 'menu') return renderUserMenu(app, renderId);
  if (h === 'vitals') return renderVitals(app, renderId);
  if (h === 'exercise') return renderExerciseScan(app, renderId);
  if (h === 'cognitive') return renderCognitive(app, renderId);
  if (h === 'assessment') return renderAssessment(app, renderId);
  if (h.indexOf('exercise/') === 0) return go('exercise'); // 旧: 種目別入力フォーム(ワンタップ記録化で廃止)
  if (h === 'admin') return renderAdminResults(app, renderId);
  if (h === 'admin/users') return renderAdminUsers(app, renderId);
  if (h === 'admin/today') return renderAdminToday(app, renderId);
  if (h === 'admin/master') return renderAdminMaster(app, renderId);
  if (h === 'admin/monthly') return renderAdminMonthly(app, renderId);
  if (h === 'admin/notebook') return renderCommunicationBook(app, renderId);
  return renderCheckin(app);
}

function checkinStatusView() {
  var usersById = {};

  S.todayCheckins.forEach(function (c) { checkedIds[c.userId] = c.time; });
  var todayWeekday = WEEKDAYS[new Date().getDay()];
  var scheduled = S.users.filter(function (u) { return String(u.scheduleLabel || '').indexOf(todayWeekday) >= 0; });
  var pending = scheduled.filter(function (u) { return !checkedIds[u.id]; });
  // 受付済みの行はタップで記録メニューへ(受付後はいつでも記録できる)

      '<button class="person-row tappable" onclick="Actions.startSession(\'' + u.id + '\')">' +
      avatarHtml(u, 'avatar-sm') +
      '<span class="person-main"><span class="person-name">' + esc(u.name) + '</span>' +
      '<span class="person-care">' + esc(u.careLevel) + '</span></span>' +
      '<span class="person-time">' + esc(c.time) + '</span>' +
      '<span class="chev" aria-hidden="true">›</span></button>'
    );
  }).join('') + pending.map(function (u) {
    return (
      '<div class="person-row pending">' + avatarHtml(u, 'avatar-sm') +

      '<span class="person-care">' + esc(u.careLevel) + '</span>' +

    '<div class="screen-intro"><span class="eyebrow">来所受付</span><h1>利用者カードを読み取る</h1>' +
    '<p>受付後は、下の一覧から利用者を選べばいつでも記録できます。</p></div>' +

      if (JSON.stringify(res.todayCheckins) !== JSON.stringify(S.todayCheckins)) {
        S.todayCheckins = res.todayCheckins;
        // カメラを止めず、来所状況だけを差し替える。
        if (document.getElementById('checkin-list')) updateCheckinStatusDom();
        else render();
      }
    }).catch(function () { /* 一時的な通信断は次回ポーリングで回復 */ });
  }, 60000);
}

  return (
    '<section class="precaution-banner" role="alert"><span class="precaution-icon" aria-hidden="true">!</span><div>' +
    '<span class="precaution-label">運動の禁止事項・注意点</span><strong>' + esc(user.precautions) + '</strong>' +

      : '') +

  );

/** 本日の全記録(15秒キャッシュ)。メニューの状況表示に使う */
function getTodayStatus() {
  var cached = S.todayStatusCache;
  if (cached && cached.expires > Date.now()) return Promise.resolve(cached.data);
  return rpc('apiGetTodayRecords').then(function (res) {
    S.todayStatusCache = { data: res, expires: Date.now() + 45000 };
    return res;
  });
}

// ---------------------------------------------------------------- 1c 機能訓練

/**
 * 全種目の実施状況リスト。個人別の予定種目は廃止したため、
 * 種目マスタの全種目から実施したものをタップして記録する。
 */
function progressHtml(records, pickable) {
  var latest = {};
  records.forEach(function (r) { latest[r.exerciseId] = r; });
  var doneCount = Object.keys(latest).length;

  var rows = S.exercises.map(function (ex) {
    var rec = latest[ex.id];
    if (rec) {
      // ワンタップ記録(実績のみ)は実施量を持たないため時刻だけを表示する
      var summary = rec.amount && rec.amount !== '実施' ? rec.time + ' · ' + rec.amount : rec.time + ' 実施';
      return (
        '<div class="exercise-row"><span class="check">✓</span>' +
        '<span class="ex-name">' + esc(ex.name) + '</span>' +
        '<span class="ex-summary">' + esc(summary) + '</span></div>'
      );
    }
    var tag = pickable ? 'button' : 'div';
    var attr = pickable ? ' style="width:100%;text-align:left;" data-ex="' + ex.id + '" onclick="Actions.exQuickSave(this, \'' + ex.id + '\')"' : '';
    return (
      '<' + tag + ' class="exercise-row undone"' + attr + '><span class="check">○</span>' +
      '<span class="ex-name">' + esc(ex.name) + '</span>' +
      '<span class="ex-summary">' + (pickable ? 'タップで記録' : '未実施') + '</span></' + tag + '>'
    );
  }).join('');

  return (
    '<div><div class="section-head" style="margin-bottom:8px;"><span class="section-title">' +
    '本日の実施状況(' + doneCount + '種目 実施)</span></div>' +
    '<div class="row-list">' + rows + '</div></div>'
  );
}

function getTodayExerciseRecords(userId) {
  var cached = S.exerciseCache[userId];
  if (cached && cached.expires > Date.now()) return Promise.resolve(cached.data);
  return rpc('apiGetTodayExercises', userId).then(function (records) {
    S.exerciseCache[userId] = { data: records, expires: Date.now() + 45000 };
    return records;
  });
}

function renderCognitive(app, renderId) {
  var user = currentUser();
  if (!user) return go('');
  if (!S.cogDraft) S.cogDraft = {
    activity: '', free: '', durationMinutes: '', metricValue: '', metricUnit: '点', note: '',
  };
  showLoading(app, hasTodayStatusCache());

  getTodayStatus().then(function (today) {
    if (!isCurrentRender(renderId)) return;
    var d = S.cogDraft;
    var menu = (S.cognitiveMenu || []).filter(function (m) { return m.active; });
    var options = '<option value="">実施したプログラムを選択</option>' + menu.map(function (m) {
      return '<option value="' + esc(m.name) + '"' + (d.activity === m.name ? ' selected' : '') + '>' + esc(m.name) + '</option>';
    }).join('');
    options += '<option value="__free__"' + (d.activity === '__free__' ? ' selected' : '') + '>その他（自由入力）</option>';
    var todayRecords = (today.cognitiveRecords || []).filter(function (c) { return c.userId === user.id; });
    var recordsHtml = todayRecords.length
      ? todayRecords.map(function (r) {
          var metric = [];
